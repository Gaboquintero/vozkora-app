    function formatLocalDateTimeCrm(dateInput = new Date()) {
      const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput || '');
      try {
        const parts = new Intl.DateTimeFormat('es-EC', {
          timeZone: 'America/Guayaquil',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).formatToParts(d);
        const get = t => (parts.find(p => p.type === t) || {}).value || '00';
        const hh = get('hour') === '24' ? '00' : get('hour');
        return `${get('year')}-${get('month')}-${get('day')} ${hh}:${get('minute')}`;
      } catch (e) {
        const utcMs = d.getTime() + (d.getTimezoneOffset() * 60000);
        const loc = new Date(utcMs - (5 * 3600000));
        const pad = n => String(n).padStart(2, '0');
        return `${loc.getFullYear()}-${pad(loc.getMonth() + 1)}-${pad(loc.getDate())} ${pad(loc.getHours())}:${pad(loc.getMinutes())}`;
      }
    }

    function nowFormatted() {
      const iso = formatLocalDateTimeCrm(new Date());
      const [ymd, hm] = iso.split(' ');
      const [y, m, d] = ymd.split('-');
      return `${d}/${m}/${y} ${hm}`;

        return (INTERNAL_ROLES_META[r] && INTERNAL_ROLES_META[r].tabs) || ['tickets'];
      },

      open() {
        const ses = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
        const rolNorm = String((ses && ses.rol) || '').trim().toUpperCase();
        if (!ses || !this.isInternalRole(rolNorm)) {
          $('crm-overlay').classList.add('hidden');
          return toast('⛔ Acceso denegado: Solo personal autorizado puede ingresar.');
        }
        const allowedTabs = this.getAllowedTabsForCurrentUser();
        const allTabs = ['tickets', 'crm360', 'activations', 'invoicing', 'billing', 'analytics', 'companies', 'users', 'staff', 'repo'];
        allTabs.forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            const ok = allowedTabs.includes(t);
            btn.classList.toggle('hidden', !ok);
            btn.style.display = ok ? '' : 'none';
          }
        });
        $('crm-overlay').classList.remove('hidden');
        const initialTab = allowedTabs.includes(this.currentTab) ? this.currentTab : allowedTabs[0];
        this.setTab(initialTab);
      },

      setTab(tab) {
        const allowedTabs = this.getAllowedTabsForCurrentUser();
        const allTabs = ['tickets', 'crm360', 'activations', 'invoicing', 'billing', 'analytics', 'companies', 'users', 'staff', 'repo'];
        allTabs.forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            const ok = allowedTabs.includes(t);
            btn.classList.toggle('hidden', !ok);
            btn.style.display = ok ? '' : 'none';
          }
        });
        if (!allowedTabs.includes(tab)) {
          tab = allowedTabs[0];
        }
        this.currentTab = tab;
        allTabs.forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            btn.className = (t === tab)
              ? 'w-full text-left px-3 py-2.5 rounded-xl bg-[#70d2bd] text-[#073e3b] font-extrabold shadow-xs cursor-pointer transition flex items-center gap-2'
              : 'w-full text-left px-3 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-teal-100 cursor-pointer transition flex items-center gap-2';
          }
        });
        if (tab === 'companies') this.loadCompanies();
        else if (tab === 'users') this.loadUsers();
        else if (tab === 'staff') this.loadStaffTab();
        else if (tab === 'billing') this.loadBillingTab();
        else if (tab === 'tickets') this.loadTickets();
        else if (tab === 'crm360') this.loadCrm360View();
        else if (tab === 'activations') this.loadActivationsTab();
        else if (tab === 'invoicing') this.loadInvoicingTab();
        else if (tab === 'analytics') this.loadAnalyticsTab();
        else if (tab === 'repo') this.loadRepo(this.repoTable);
      },
      // -------------------------------------------------------------------
      // PESTAÑA 1: EMPRESAS (REGISTRO PRIVADO DE CLIENTES SAAS VOZKORA)
      // -------------------------------------------------------------------
      async loadCompanies() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Cargando registro privado de empresas...</div>';
        try {
          const [emps, usrs] = await Promise.all([crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.renderCompaniesView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl font-bold">Error cargando empresas: ${esc(e.message)}</div>`;
        }
      },

      getCompanyStatusBadge(emp) {
        if (!emp || emp.activa === false) {
          return {
            cls: 'bg-rose-100 text-rose-800 border-rose-200',
            dot: 'bg-rose-600',
            shortLabel: '🔴 Suspendida',
            fullLabel: '🔴 Suspendida (Acceso Pausado)'
          };
        }
        const sub = typeof evaluarEstadoSuscripcion === 'function'
          ? evaluarEstadoSuscripcion(emp)
          : { estado: 'AL_DIA', diasMora: 0 };
        if (sub.estado === 'BLOQUEADO_CORTE') {
          return {
            cls: 'bg-rose-100 text-rose-800 border-rose-200',
            dot: 'bg-rose-600',
            shortLabel: `🔴 Mora +${sub.diasMora}d`,
            fullLabel: `🔴 Suspendida por Corte (${sub.diasMora} días mora)`
          };
        }
        if (sub.estado === 'PENDIENTE_RENOVACION') {
          return {
            cls: 'bg-amber-100 text-amber-900 border-amber-300',
            dot: 'bg-amber-500',
            shortLabel: `🟡 Gracia (${sub.diasMora}/5d)`,
            fullLabel: `🟡 En Días de Gracia (${sub.diasMora} de 5 días)`
          };
        }
        if (sub.estado === 'EXENTO_HASTA') {
          return {
            cls: 'bg-cyan-100 text-cyan-900 border-cyan-200',
            dot: 'bg-cyan-600',
            shortLabel: '🟢 Activa (Exenta)',
            fullLabel: `🟢 Activa (Exenta hasta ${sub.exentoHasta})`
          };
        }
        return {
          cls: 'bg-emerald-100 text-emerald-800 border-emerald-200',
          dot: 'bg-emerald-600',
          shortLabel: '🟢 Activa',
          fullLabel: '🟢 Activa y Al Día'
        };

        this.selectedCompanyId = empId;

      async saveNewCompany() {
        const nombre = $('empNewName').value.trim();
        const ruc = $('empNewRuc').value.trim();
        const telefono = $('empNewTel').value.trim();
        const email_contacto = $('empNewEmail').value.trim().toLowerCase();
        const plan_activo = $('empNewPlan').value;
        const max_usuarios = Math.max(1, parseInt($('empNewQuota').value, 10) || 1);
        const entorno = $('empNewEnv').value;
        if (!nombre || !ruc) return toast('Ingresa nombre y RUC de la empresa.');
        const allPackIds = ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas'];
        const isEnt = plan_activo === 'enterprise';
        try {
          await crmCrearEmpresa({
            nombre,
            ruc,
            telefono,
            email_contacto,
            plan_activo,
            max_usuarios,
            entorno,
            activa: true,
            packs_ia: isEnt ? allPackIds : [],
            sva_elegidos_fijos: isEnt
          });
          V.closeModal();
          toast(`✓ Empresa ${nombre} registrada con cupo de ${max_usuarios} usuario(s)${isEnt ? ' y Full IA activo' : ''}.`);
          this.loadCompanies();
        } catch (e) {
          toast('Error creando empresa: ' + e.message);
        }
      },

      async changeCompanyPlan(id, plan_activo) {
        const pl = PLANS.find(x => x.id === plan_activo);
        const max_usuarios = pl ? pl.includedUsers : 5;
        const allPackIds = ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas'];
        const patch = { plan_activo, max_usuarios };
        if (plan_activo === 'enterprise' || (pl && pl.includesComboFull)) {
          patch.packs_ia = allPackIds;
          patch.sva_elegidos_fijos = true;
        } else {
          // Liberar selección para que el cliente elija en la App los módulos gratis de su nuevo plan
          patch.packs_ia = [];
          patch.sva_elegidos_fijos = false;
        }
        await crmActualizarEmpresa(id, patch);
        const svaMsg = plan_activo === 'enterprise'
          ? ' + 6 Módulos IA activados automáticamente'
          : (pl && pl.includedSVACount > 0 ? ` + ${pl.includedSVACount} módulo(s) IA gratis disponibles para elegir en App` : '');
        toast(`✓ Plan actualizado a ${pl ? pl.name : plan_activo} (Cupo: ${max_usuarios} usu.${svaMsg}).`);
        this.loadCompanies();
      },

        const max_usuarios = Math.max(1, parseInt(val, 10) || 1);
        await crmActualizarEmpresa(id, { max_usuarios });
        toast(`✓ Cupo máximo actualizado a ${max_usuarios} usuario(s).`);
        this.loadCompanies();
      },

        toast('✓ Entorno de empresa cambiado a ' + entorno);
        this.loadCompanies();

      async changeCompanyPeriodicity(id, periodicidad) {

        await crmActualizarEmpresa(id, { periodicidad, fecha_proximo_corte });
        toast(`✓ Periodicidad cambiada a ${periodicidad}. Próximo corte: ${fecha_proximo_corte}`);
        this.loadCompanies();

      async toggleCompanySvaPack(empId, packId) {
        const emp = this.cachedCompanies.find(x => x.id === empId);
        if (!emp) return;
        const plObj = PLANS.find(p => p.id === emp.plan_activo) || PLANS[0];
        if (emp.plan_activo === 'enterprise' || plObj.includesComboFull) {
          return toast('⚡ El Plan Enterprise incluye los 6 Módulos IA activos automáticamente.');
        }
        const freeQuota = Number(plObj.includedSVACount) || 0;
        const prev = Array.isArray(emp.packs_ia) ? emp.packs_ia.slice() : [];
        const next = prev.includes(packId) ? prev.filter(x => x !== packId) : [...prev, packId];
        const fixedFlag = freeQuota > 0 ? (next.length >= freeQuota) : (next.length > 0);
        emp.packs_ia = next;
        emp.sva_elegidos_fijos = fixedFlag;
        this.renderCompaniesView();
        try {
          await crmActualizarEmpresa(empId, { packs_ia: next, sva_elegidos_fijos: fixedFlag });
          toast('✓ Módulos IA actualizados en vivo para ' + emp.nombre);
        } catch (e) {
          emp.packs_ia = prev;
          this.renderCompaniesView();
          toast('⚠️ Error guardando módulo IA: ' + e.message);
        }
      },

      async unlockCompanyFreeSvaQuota(empId, empName) {
        await crmActualizarEmpresa(empId, { packs_ia: [], sva_elegidos_fijos: false });
        toast(`🔓 Cupo de módulos gratis liberado para ${empName}. El cliente ya puede volver a elegirlos desde su App.`);
        this.loadCompanies();
      },

      async resetCompanyIaQuota(empId, empRuc, empName) {
        await crmReiniciarConsumoIaEmpresa(empId, empRuc);
        toast(`✓ Contador de consumo IA de ${empName} reiniciado a 0.`);
        this.loadCompanies();
      },

      billingFilter: 'ALL',
      async loadBillingTab() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Calculando estado de cartera, asignaciones y fechas de corte...</div>';
        try {
          const [emps, usrs, tks] = await Promise.all([crmListarEmpresas(), crmListarUsuarios(), crmListarTickets()]);
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.cachedTickets = tks;
          this.cachedStaff = usrs.filter(u => this.isInternalRole(u.rol));
          this.renderBillingView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      getBillingAssignmentsMap() {
        let localMap = {};
        try {
          localMap = JSON.parse(localStorage.getItem('vozkora_crm_cartera_asignada') || '{}');
        } catch (e) {}
        return localMap;
      },

      async assignSelectedBillingPortfolio() {
        if (!this.isMasterAdmin()) return toast('⛔ Solo admin@vozkora.com puede asignar cartera.');
        const targetEmail = ($('billingAssignTargetEmail')?.value || '').trim().toLowerCase();
        if (!this.selectedBillingRucs.length) {
          return toast('⚠️ Selecciona al menos una empresa con check en el listado.');
        }
        const map = this.getBillingAssignmentsMap();
        const staffObj = (this.cachedStaff || []).find(s => String(s.email || '').toLowerCase() === targetEmail);
        const staffName = staffObj ? (staffObj.nombre_completo || staffObj.email) : '';

        this.selectedBillingRucs.forEach(ruc => {
          if (targetEmail) {
            map[ruc] = { email: targetEmail, nombre: staffName, fecha: nowFormatted() };
          } else {
            delete map[ruc];
          }
        });
        try {
          localStorage.setItem('vozkora_crm_cartera_asignada', JSON.stringify(map));
        } catch (e) {}

        const count = this.selectedBillingRucs.length;
        this.selectedBillingRucs = [];
        toast(targetEmail
          ? `✅ ${count} empresa(s) de cartera asignada(s) a ${staffName}.`
          : `✅ Asignación removida de ${count} empresa(s).`);
        this.renderBillingView();
      },

      toggleBillingSelectRuc(ruc, checked) {
        const clean = String(ruc || '').trim();
        if (checked) {
          if (!this.selectedBillingRucs.includes(clean)) this.selectedBillingRucs.push(clean);
        } else {
          this.selectedBillingRucs = this.selectedBillingRucs.filter(x => x !== clean);
        }
        const badge = $('billingSelectedCountBadge');
        if (badge) badge.textContent = `${this.selectedBillingRucs.length} seleccionada(s)`;
      },

      renderBillingView() {
        const body = $('crm-body');
        const isMaster = this.isMasterAdmin();
        const myEmail = this.getSessionEmail();
        const assignMap = this.getBillingAssignmentsMap();

        // Empresas con pago/cobranza recién reportado pendiente de activación/facturación se ocultan de la cartera pendiente del asesor
        const pendingPayRucs = new Set(
          (this.cachedTickets || [])
            .filter(t => ['ACTIVACION_VENTA', 'FACTURACION_PAGO'].includes(String(t.tipo_solicitud || '').toUpperCase()) && t.estado === 'PENDIENTE')
            .map(t => String(t.empresa_ruc || '').trim())

        let baseCompanies = this.cachedCompanies;
        if (!isMaster && !this.isReadOnlyRole()) {

            const ruc = String(emp.ruc || '').trim();
            const asg = assignMap[ruc];
            if (!asg || String(asg.email || '').toLowerCase() !== myEmail) return false;
            if (pendingPayRucs.has(ruc)) return false;
            const st = evaluarEstadoSuscripcion(emp);
            return st.estado === 'PENDIENTE_RENOVACION' || st.estado === 'BLOQUEADO_CORTE' || !emp.activa;
          });

        const nombre_completo = $('usrEditFullName').value.trim();
        const email = $('usrEditEmail').value.trim().toLowerCase();
        const clave = $('usrEditPass').value.trim();
        const rol = $('usrEditRol').value;
        const activo = $('usrEditActivo').value === 'true';

        if (!nombre_completo || !email || !clave) {
          return toast('Completa nombre, correo y contraseña.');

        const patch = {
          nombre_completo,
          email,
          clave,
          rol,
          activo
        };
        if (emp) {
          patch.empresa_id = emp.id;
          patch.empresa_nombre = emp.nombre;
          patch.empresa_ruc = emp.ruc;
          patch.entorno = emp.entorno;
          patch.plan_activo = emp.plan_activo;
          patch.packs_ia = emp.packs_ia || [];
        }

        try {
          await crmActualizarUsuario(id, patch);
          V.closeModal();
          toast(`✓ Usuario ${email} actualizado correctamente.`);
          this.loadUsers();
        } catch (e) {
          toast('Error actualizando usuario: ' + e.message);

          toast('Error eliminando usuario: ' + e.message);

      getQuotaStatusText(empId) {
        const emp = this.cachedCompanies.find(c => c.id === empId);
        if (!emp) return '';
        const used = this.cachedUsers.filter(u => (u.empresa_id === emp.id || u.empresa_ruc === emp.ruc) && u.activo).length;
        if (used >= emp.max_usuarios) {
          return `⚠️ CUPO LLENO (${used}/${emp.max_usuarios}): Amplía el cupo de usuarios de ${emp.nombre} antes de crear otro.`;
        }
        return `✓ Cupo disponible en Plan ${emp.plan_activo.toUpperCase()}: ${used} de ${emp.max_usuarios} usuarios usados.`;

      async saveNewUser() {
        const empId = $('usrNewCompanyId').value;
        const emp = this.cachedCompanies.find(c => c.id === empId);
        const nombre_completo = $('usrNewFullName').value.trim();
        const email = $('usrNewEmail').value.trim().toLowerCase();
        const clave = $('usrNewPass').value.trim();
        const rol = $('usrNewRol').value;

        if (!emp || !nombre_completo || !email || !clave) {
          return toast('Completa empresa, nombre, correo y contraseña.');
        }

        // Cruce estricto contra el cupo contratado en el plan de la empresa
        const activeUsersCount = this.cachedUsers.filter(u => (u.empresa_id === emp.id || u.empresa_ruc === emp.ruc) && u.activo).length;
        if (activeUsersCount >= emp.max_usuarios) {
          return toast(`⛔ Límite alcanzado: ${emp.nombre} tiene ${activeUsersCount}/${emp.max_usuarios} usuarios en su plan ${emp.plan_activo.toUpperCase()}. Amplía el cupo en Empresas.`);
        }

        try {
          await crmCrearUsuario({
            empresa_id: emp.id,
            empresa_nombre: emp.nombre,
            empresa_ruc: emp.ruc,
            empresa_telefono: emp.telefono || '',
            nombre_completo,
            email,
            clave,
            rol,
            entorno: emp.entorno,
            plan_activo: emp.plan_activo,
            packs_ia: emp.packs_ia || ['voz', 'ventas'],
            activo: true
          });
          V.closeModal();
          toast(`✓ Usuario ${email} creado en ${emp.nombre} (${activeUsersCount + 1}/${emp.max_usuarios} cupos).`);
          this.loadUsers();
        } catch (e) {
          toast('Error creando usuario: ' + e.message);
        }

      // -------------------------------------------------------------------
      ticketLabel(st) {
        if (st === 'PENDIENTE') return '🟡 Abierto';
        if (st === 'EN_PROCESO') return '🔵 En Proceso';
        if (st === 'APROBADO') return '🟢 Cerrado (Resuelto)';
        if (st === 'RECHAZADO') return '🔴 Cerrado (Rechazado)';
        return st;
      },

      async loadTickets() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Cargando bandeja de leads y tickets...</div>';
        try {
          const [tks, emps, usrs] = await Promise.all([crmListarTickets(), crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedTickets = tks;
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.cachedStaff = usrs.filter(u => ['SUPERADMIN', 'SOPORTE', 'VENTAS'].includes(String(u.rol || '').toUpperCase()));
          this.renderTicketsView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      async assignTicketStaff(ticketId, staffEmail) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const staffObj = this.cachedStaff.find(s => s.email === staffEmail);
        const staffName = staffObj ? `${staffObj.nombre_completo || staffObj.email} (${staffObj.rol})` : 'Sin asignar';
        try {
          await crmAsignarTicketAColaborador(ticketId, staffEmail, staffName, tk.detalle || {});
          toast(staffEmail ? `✅ Ticket asignado a ${staffName}` : 'Ticket marcado como Sin asignar');
          await this.loadTickets();
        } catch (e) {
          toast('Error asignando ticket: ' + e.message);
        }
      },

      selectTicketMaster(tkId) {
        this.selectedTicketId = tkId;
        this.renderTicketsView();
      },

      isTicketWhatsappSent(tk) {
        const det = (tk && tk.detalle) || {};
        if (det.whatsapp_enviado === true || String(det.whatsapp_estado || '').toUpperCase() === 'ENVIADO') {
          return true;
        }
        const hist = Array.isArray(det.historial) ? det.historial : [];
        return hist.some(h => /enviado a whatsapp/i.test(String(h.a_estado || '')));
      },

      renderTicketsView() {
        const body = $('crm-body');
        const sesNow = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
        const rolNorm = String((sesNow && sesNow.rol) || '').trim().toUpperCase();
        const isSuper = this.isMasterAdmin();
        const canSeeAllTickets = ['SUPERADMIN', 'SUPERVISOR', 'AUDITOR'].includes(rolNorm);
        const isReadOnly = this.isReadOnlyRole();
        const myEmail = String((sesNow && sesNow.email) || '').trim().toLowerCase();

        const pureTickets = this.cachedTickets.filter(t => !['ACTIVACION_VENTA', 'FACTURACION_PAGO'].includes(String(t.tipo_solicitud || '').toUpperCase()));

        const baseTickets = canSeeAllTickets
          ? pureTickets
          : pureTickets.filter(t => {
              const assigned = String(t.asignado_a || (t.detalle && t.detalle.asignado_a_email) || '').trim().toLowerCase();
              return assigned !== '' && assigned === myEmail;
            });

        const abiertos = baseTickets.filter(t => t.estado === 'PENDIENTE' || t.estado === 'ABIERTO');
        const enProceso = baseTickets.filter(t => t.estado === 'EN_PROCESO');
        const cerrados = baseTickets.filter(t => t.estado === 'APROBADO' || t.estado === 'RECHAZADO');
        const waNotSentCount = baseTickets.filter(t => !this.isTicketWhatsappSent(t)).length;
        const waSentCount = baseTickets.filter(t => this.isTicketWhatsappSent(t)).length;

        let listToShow = abiertos;
        if (this.ticketFilterStatus === 'EN_PROCESO') listToShow = enProceso;
        else if (this.ticketFilterStatus === 'CERRADOS') listToShow = cerrados;
        else if (this.ticketFilterStatus === 'TODOS') listToShow = baseTickets;

        if (canSeeAllTickets) {
          if (this.ticketAssigneeFilter === 'MINE' && sesNow) {
            listToShow = listToShow.filter(t => (t.asignado_a || (t.detalle && t.detalle.asignado_a_email)) === sesNow.email);
          } else if (this.ticketAssigneeFilter === 'UNASSIGNED') {
            listToShow = listToShow.filter(t => !(t.asignado_a || (t.detalle && t.detalle.asignado_a_email)));
          }
        }

        if (this.ticketWaFilter === 'WA_SENT') {
          listToShow = listToShow.filter(t => this.isTicketWhatsappSent(t));
        } else if (this.ticketWaFilter === 'WA_NOT_SENT') {
          listToShow = listToShow.filter(t => !this.isTicketWhatsappSent(t));
        }

        if (this.ticketTypeFilter && this.ticketTypeFilter !== 'ALL') {
          listToShow = listToShow.filter(t => {
            const d = t.detalle || {};
            const code = String(d.tipo_operacion || t.tipo_solicitud || '').toUpperCase();
            return code === this.ticketTypeFilter;
          });
        }

        if (listToShow.length > 0 && (!this.selectedTicketId || !listToShow.some(x => x.id === this.selectedTicketId))) {
          this.selectedTicketId = listToShow[0].id;
        } else if (listToShow.length === 0) {
          this.selectedTicketId = '';
        }

        const selTk = listToShow.find(x => x.id === this.selectedTicketId) || null;

        let ticketDetailHtml = `
          <div class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-400 space-y-2">
            <div class="text-3xl">🎫</div>
            <div class="text-sm font-extrabold text-[#073e3b]">Selecciona un ticket o lead del listado</div>
            <p class="text-[11px] max-w-sm">Haz clic sobre el nombre del cliente a la izquierda para ver el detalle completo, si envió o no mensaje a WhatsApp y el estado de su cuenta.</p>
          </div>
        `;

        if (selTk) {
          const realIdx = this.cachedTickets.findIndex(x => x.id === selTk.id);
          const det = selTk.detalle || {};
          const hist = Array.isArray(det.historial) ? det.historial : [];
          const waSent = this.isTicketWhatsappSent(selTk);
          const localTimeStr = det.fecha_hora_local || (selTk.creado_en ? formatLocalDateTimeCrm(selTk.creado_en) : '');
          const empObj = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(selTk.empresa_ruc || '').trim()) || null;
          const empBadge = empObj
            ? this.getCompanyStatusBadge(empObj)
            : { cls: 'bg-slate-100 text-slate-700 border-slate-200', fullLabel: '⚪ Prospecto / Sin empresa SaaS' };

          const tkBadgeCls = selTk.estado === 'PENDIENTE'
            ? 'bg-amber-100 text-amber-900'
            : (selTk.estado === 'EN_PROCESO'
              ? 'bg-cyan-100 text-cyan-900'
              : (selTk.estado === 'APROBADO' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'));

          const clientFullMsg = selTk.tipo_solicitud === 'NUEVO_USUARIO'
            ? `Solicita crear usuario para <strong>${esc(det.nombre || 'N/A')}</strong> (${esc(det.email_nuevo || 'N/A')}) · Perfil: <strong>${esc(det.perfil || 'N/A')}</strong>${det.descripcion ? ' · Nota: ' + esc(det.descripcion) : ''}`
            : `${esc(det.descripcion || det.motivo || JSON.stringify(det))}`;

          const waDigits = String(det.telefono_contacto || (empObj && empObj.telefono) || '').replace(/\D/g, '');

          ticketDetailHtml = `
            <div class="space-y-3">
              <!-- Encabezado con Estado del Ticket + Estado Cuenta + Estado WhatsApp (Verde/Rojo) -->
              <div class="p-3.5 rounded-2xl bg-gradient-to-r from-[#073e3b] to-[#0a524e] text-white space-y-2">
                <div class="flex flex-wrap items-start justify-between gap-2">
                  <div>
                    <div class="text-[10px] uppercase font-bold text-[#70d2bd]">Cliente / Empresa Solicitante</div>
                    <h4 class="text-base font-black">${esc(selTk.empresa_nombre)}</h4>
                    <div class="text-[11px] font-mono text-teal-100">RUC: <strong>${esc(selTk.empresa_ruc)}</strong> · Solicitante: ${esc(selTk.solicitado_por)}</div>
                  </div>
                  <div class="flex flex-col items-end gap-1">
                    <span class="px-2.5 py-0.5 rounded-full text-[10.5px] font-extrabold ${tkBadgeCls}">${this.ticketLabel(selTk.estado)}</span>
                    <span class="px-2.5 py-0.5 rounded-full text-[10.5px] font-extrabold border ${empBadge.cls}">${empBadge.fullLabel}</span>
                  </div>
                </div>

                <!-- Indicador explícito Verde / Rojo de envío a WhatsApp -->
                <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t border-white/15 text-[10.5px] text-teal-100">
                  <span>Categoría: <strong class="text-white">${esc(det.categoria || selTk.tipo_solicitud)}</strong></span>
                  <span>📅 ${esc(localTimeStr)}</span>
                  <div class="flex items-center gap-1.5 ml-auto">
                    ${waSent
                      ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-500 text-white font-extrabold text-[10px] shadow-xs">🟢 Enviado a WhatsApp${det.whatsapp_enviado_en ? ' (' + esc(det.whatsapp_enviado_en) + ')' : ''}</span>`
                      : `<span class="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-extrabold text-[10px] shadow-xs">🔴 No envió a WhatsApp (Contactar)</span>`
                    }
                    ${waDigits ? `
                      <button onclick="window.open('https://wa.me/${esc(waDigits)}','_blank')" class="px-2.5 py-1 rounded-lg bg-[#70d2bd] hover:bg-white text-[#073e3b] font-extrabold text-[10px] cursor-pointer">
                        💬 Abrir Chat (${esc(det.telefono_contacto || empObj.telefono)})
                      </button>
                    ` : ''}
                  </div>
                </div>
              </div>

              <!-- Mensaje original del cliente -->
              <div class="p-3 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11.5px] text-slate-800 space-y-1">
                <div class="text-[10px] font-extrabold uppercase text-[#087e70]">📩 Solicitud / Mensaje del Cliente:</div>
                <div>${clientFullMsg}</div>
              </div>

              <!-- Responsable + Acceso directo a Hoja de Vida 360° -->
              <div class="p-2.5 rounded-xl bg-white border border-slate-200 flex flex-wrap items-center justify-between gap-2 text-[11px]">
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-[#073e3b]">🎧 Responsable:</span>
                  ${isSuper ? `
                    <select onchange="CRM.assignTicketStaff('${selTk.id}', this.value)" class="border border-[#d7e1e0] rounded-lg px-2 py-1 bg-[#f5f8f8] font-bold text-[#073e3b]">
                      <option value="">-- Sin asignar --</option>
                      ${(this.cachedStaff || []).map(st => {
                        const currAssigned = selTk.asignado_a || det.asignado_a_email || '';
                        return `<option value="${esc(st.email)}" ${currAssigned === st.email ? 'selected' : ''}>${esc(st.nombre_completo || st.email)} [${esc(st.rol)}]</option>`;
                      }).join('')}
                    </select>
                  ` : `<span class="px-2 py-0.5 rounded-lg bg-[#e7f5f1] text-[#073e3b] font-bold">${esc(sesNow?.nombre_completo || myEmail)}</span>`}
                </div>
                <button onclick="CRM.openClient360ByRuc('${esc(selTk.empresa_ruc)}')" class="px-3 py-1.5 rounded-xl bg-[#e7f5f1] hover:bg-[#087e70] text-[#073e3b] hover:text-white border border-[#b9d1cd] font-extrabold cursor-pointer">
                  🗂️ Abrir Hoja de Vida 360° →
                </button>
              </div>

              <!-- Acciones de cambio de estado (ocultas para Supervisor/Auditor Solo Lectura) -->
              ${isReadOnly ? `<div class="p-2 rounded-xl bg-slate-100 border border-slate-200 text-[10.5px] font-bold text-slate-600">👁️ Modo Auditoría / Supervisión (Solo Lectura)</div>` : `
              <div class="flex flex-wrap items-center gap-1.5 pt-1">
                ${selTk.estado !== 'PENDIENTE' ? `
                  <button onclick="CRM.openTicketTransitionModal(${realIdx}, 'PENDIENTE')" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-amber-100 hover:bg-amber-200 text-amber-900 cursor-pointer">
                    🟡 Pasar a Abierto
                  </button>
                ` : ''}
                ${selTk.estado !== 'EN_PROCESO' ? `
                  <button onclick="CRM.openTicketTransitionModal(${realIdx}, 'EN_PROCESO')" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-cyan-100 hover:bg-cyan-200 text-cyan-900 cursor-pointer">
                    🔵 Pasar a En Proceso
                  </button>
                ` : ''}
                ${selTk.estado !== 'APROBADO' ? `
                  <button onclick="CRM.openTicketTransitionModal(${realIdx}, 'APROBADO')" class="px-2.5 py-1.5 rounded-xl text-[11px] font-extrabold bg-[#087e70] hover:bg-[#073e3b] text-white cursor-pointer">
                    🟢 Cerrar (Resuelto)
                  </button>
                ` : ''}
                ${selTk.estado !== 'RECHAZADO' ? `
                  <button onclick="CRM.openTicketTransitionModal(${realIdx}, 'RECHAZADO')" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-rose-100 hover:bg-rose-200 text-rose-800 cursor-pointer">
                    🔴 Cerrar (Rechazado)
                  </button>
                ` : ''}

                <button onclick="CRM.openTicketCommentModal(${realIdx})" class="ml-auto px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-[#073e3b] text-[#70d2bd] hover:bg-[#087e70] hover:text-white cursor-pointer">
                  💬 Comentar en Bitácora
                </button>
              </div>`}

              <!-- Bitácora cronológica -->
              <div class="p-3 rounded-xl bg-[#e7f5f1]/60 border border-[#b9d1cd] text-[10.5px] text-[#073e3b] space-y-1.5">
                <div class="font-extrabold uppercase text-[9.5px] text-[#087e70]">📜 Historial Completo de Movimientos (${hist.length}):</div>
                ${hist.length === 0 ? '<p class="text-slate-500">Sin movimientos adicionales registrados aún.</p>' : hist.map((h, i) => `
                  <div class="border-t border-[#b9d1cd]/50 pt-1.5 first:border-0 first:pt-0">
                    <span class="font-bold">#${i + 1} [${esc(h.fecha)}] ${esc(h.de_estado)} → ${esc(h.a_estado)}:</span>
                    <span>${esc(h.motivo)}</span>
                    <span class="text-slate-500">(${esc(h.autor || 'Sistema')})</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        body.innerHTML = `
          <div class="bg-white rounded-2xl p-4 border border-[#dce6e5] space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
              <div>
                <h3 class="text-sm font-extrabold text-[#073e3b]">🔥 ${isSuper ? `Leads & Tickets (${baseTickets.length})` : `Mis Tickets Asignados (${baseTickets.length})`}</h3>
                <p class="text-[11px] text-slate-500">Filtra por estado o por envío a WhatsApp (🟢 Enviado / 🔴 No envió) para contactar clientes pendientes.</p>
              </div>
              <div class="flex flex-wrap gap-1.5 items-center">
                <button onclick="CRM.ticketFilterStatus='ABIERTOS'; CRM.renderTicketsView();" class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold cursor-pointer ${this.ticketFilterStatus === 'ABIERTOS' ? 'bg-amber-500 text-white' : 'bg-amber-50 text-amber-900 border border-amber-200'}">
                  🟡 Abiertos (${abiertos.length})
                </button>
                <button onclick="CRM.ticketFilterStatus='EN_PROCESO'; CRM.renderTicketsView();" class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold cursor-pointer ${this.ticketFilterStatus === 'EN_PROCESO' ? 'bg-cyan-700 text-white' : 'bg-cyan-50 text-cyan-900 border border-cyan-200'}">
                  🔵 Proceso (${enProceso.length})
                </button>
                <button onclick="CRM.ticketFilterStatus='CERRADOS'; CRM.renderTicketsView();" class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold cursor-pointer ${this.ticketFilterStatus === 'CERRADOS' ? 'bg-[#087e70] text-white' : 'bg-[#e7f5f1] text-[#073e3b] border border-[#b9d1cd]'}">
                  🟢 Cerrados (${cerrados.length})
                </button>
                <button onclick="CRM.ticketFilterStatus='TODOS'; CRM.renderTicketsView();" class="px-2.5 py-1 rounded-xl text-[11px] font-bold cursor-pointer ${this.ticketFilterStatus === 'TODOS' ? 'bg-[#073e3b] text-[#70d2bd]' : 'bg-[#f5f8f8] text-slate-600 border border-[#dce6e5]'}">
                  Todos (${baseTickets.length})
                </button>

                <!-- Filtro por Tipo de Solicitud -->
                <select onchange="CRM.ticketTypeFilter=this.value; CRM.renderTicketsView();" class="border border-[#d7e1e0] rounded-xl px-2.5 py-1 bg-[#f5f8f8] text-[11px] font-extrabold text-[#073e3b]">
                  <option value="ALL" ${this.ticketTypeFilter === 'ALL' ? 'selected' : ''}>📋 Tipo Solicitud: Todos</option>
                  <option value="VENTAS_UPGRADE" ${this.ticketTypeFilter === 'VENTAS_UPGRADE' ? 'selected' : ''}>⬆️ Solicitud Upgrade App</option>
                  <option value="NUEVO_USUARIO" ${this.ticketTypeFilter === 'NUEVO_USUARIO' ? 'selected' : ''}>👤 Alta Nuevo Usuario</option>
                  <option value="SOPORTE_TECNICO" ${this.ticketTypeFilter === 'SOPORTE_TECNICO' ? 'selected' : ''}>🛠️ Soporte Técnico</option>
                  <option value="CONSULTA_CANAL_TECNICO" ${this.ticketTypeFilter === 'CONSULTA_CANAL_TECNICO' ? 'selected' : ''}>📲 Consulta Canal Técnico</option>
                  <option value="SOLICITUD_ELIMINACION_CUENTA" ${this.ticketTypeFilter === 'SOLICITUD_ELIMINACION_CUENTA' ? 'selected' : ''}>⚠️ Eliminación de Cuenta</option>
                </select>

                <!-- Filtro por estado de WhatsApp (Verde / Rojo) -->
                <select onchange="CRM.ticketWaFilter=this.value; CRM.renderTicketsView();" class="border border-[#d7e1e0] rounded-xl px-2.5 py-1 bg-[#f5f8f8] text-[11px] font-extrabold text-[#073e3b]">
                  <option value="ALL" ${this.ticketWaFilter === 'ALL' ? 'selected' : ''}>📲 WhatsApp: Todos</option>
                  <option value="WA_NOT_SENT" ${this.ticketWaFilter === 'WA_NOT_SENT' ? 'selected' : ''}>🔴 Sin enviar WhatsApp (${waNotSentCount})</option>
                  <option value="WA_SENT" ${this.ticketWaFilter === 'WA_SENT' ? 'selected' : ''}>🟢 Enviado a WhatsApp (${waSentCount})</option>
                </select>

                ${canSeeAllTickets ? `
                  <select onchange="CRM.ticketAssigneeFilter=this.value; CRM.renderTicketsView();" class="border border-[#d7e1e0] rounded-xl px-2.5 py-1 bg-[#f5f8f8] text-[11px] font-bold text-[#073e3b]">
                    <option value="ALL" ${this.ticketAssigneeFilter === 'ALL' ? 'selected' : ''}>👤 Todos</option>
                    <option value="MINE" ${this.ticketAssigneeFilter === 'MINE' ? 'selected' : ''}>⭐ Míos</option>
                    <option value="UNASSIGNED" ${this.ticketAssigneeFilter === 'UNASSIGNED' ? 'selected' : ''}>⚪ Sin asignar</option>
                  </select>
                ` : `<span class="px-2.5 py-1 rounded-xl bg-[#e7f5f1] text-[#073e3b] text-[10.5px] font-bold">👤 ${esc(sesNow?.nombre_completo || myEmail)}</span>`}
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
              <!-- PANEL IZQUIERDO: LISTADO COMPACTO DE TICKETS POR CLIENTE -->
              <div class="lg:col-span-4 bg-[#f5f8f8] rounded-2xl p-3 border border-[#dce6e5] max-h-[68vh] overflow-y-auto crm-scroll space-y-1.5">
                ${listToShow.length === 0 ? '<p class="text-slate-500 text-center py-6 text-[11px]">No hay tickets en esta bandeja.</p>' : listToShow.map(tk => {
                  const isSel = tk.id === this.selectedTicketId;
                  const det = tk.detalle || {};
                  const waSent = this.isTicketWhatsappSent(tk);
                  const localTimeStr = det.fecha_hora_local || (tk.creado_en ? formatLocalDateTimeCrm(tk.creado_en) : '');
                  const empObj = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;
                  const empBadge = empObj ? this.getCompanyStatusBadge(empObj) : { cls: 'bg-slate-100 text-slate-600 border-slate-200', shortLabel: '⚪ Lead' };
                  const tkDot = tk.estado === 'PENDIENTE' ? '🟡' : (tk.estado === 'EN_PROCESO' ? '🔵' : (tk.estado === 'APROBADO' ? '🟢' : '🔴'));

                  return `
                    <button type="button" onclick="CRM.selectTicketMaster('${tk.id}')" class="w-full text-left p-2.5 rounded-xl border transition cursor-pointer space-y-1 ${isSel ? 'bg-[#073e3b] text-white border-[#073e3b] shadow-sm' : 'bg-white hover:bg-[#e7f5f1]/60 text-[#17343a] border-[#dce6e5]'}">
                      <div class="flex items-center justify-between gap-1.5">
                        <span class="font-extrabold text-xs truncate">${tkDot} ${esc(tk.empresa_nombre)}</span>
                        <span class="px-2 py-0.5 rounded-full text-[9px] font-extrabold border shrink-0 ${isSel ? 'bg-white/15 text-[#70d2bd] border-white/20' : empBadge.cls}">
                          ${empBadge.shortLabel}
                        </span>
                      </div>
                      <div class="flex items-center justify-between gap-1.5">
                        <span class="text-[10.5px] font-semibold truncate ${isSel ? 'text-teal-100' : 'text-slate-600'}">
                          ${esc(det.categoria || tk.tipo_solicitud)}
                        </span>
                        <span class="px-1.5 py-0.5 rounded text-[9px] font-extrabold shrink-0 ${waSent ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-rose-500/20 text-rose-300 border border-rose-400/30'} ${!isSel ? (waSent ? '!bg-emerald-100 !text-emerald-800 !border-emerald-200' : '!bg-rose-100 !text-rose-800 !border-rose-200') : ''}">

                        </span>
                      </div>
                      <div class="text-[9.5px] font-mono ${isSel ? 'text-teal-200/80' : 'text-slate-400'}">
                        📅 ${esc(localTimeStr)}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- PANEL DERECHO: DETALLE DEL TICKET Y CLIENTE CON SCROLL INTERNO -->
              <div class="lg:col-span-8 bg-white rounded-2xl p-4 border border-[#dce6e5] max-h-[68vh] overflow-y-auto crm-scroll">

              </div>
            </div>
          </div>

      },

      openTicketTransitionModal(idx, targetEstado) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const fromLabel = this.ticketLabel(tk.estado);
        const toLabel = this.ticketLabel(targetEstado);
        const isUserCreation = tk.tipo_solicitud === 'NUEVO_USUARIO' && targetEstado === 'APROBADO';

        V.openModal(
          `🔄 Cambiar Estado de Ticket`,
          `<div class="space-y-2.5">
             <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">
               <div><strong>Empresa:</strong> ${esc(tk.empresa_nombre)} (RUC: ${esc(tk.empresa_ruc)})</div>
               <div><strong>Cambio de estado:</strong> ${fromLabel} → <strong>${toLabel}</strong></div>
             </div>
             <div>
               <label class="font-bold text-[11px] text-[#073e3b]">Motivo / Observación obligatoria del cambio *</label>
               <textarea id="tkTransitionReason" rows="3" class="w-full border border-[#d7e1e0] rounded-xl p-2.5 mt-1 text-xs focus:outline-none focus:border-[#087e70]" placeholder="Escribe obligatoriamente el porqué del cambio de estado o la solución aplicada..."></textarea>
             </div>
             ${isUserCreation ? `
               <label class="flex items-center gap-2 p-2 rounded-xl bg-[#e7f5f1] border border-[#b9d1cd] text-[11px] font-bold text-[#073e3b] cursor-pointer">
                 <input type="checkbox" id="tkAlsoCreateUser" checked />
                 <span>Abrir formulario para crear el usuario (${esc(tk.detalle?.email_nuevo || '')}) inmediatamente</span>
               </label>
             ` : ''}
           </div>`,
          `<button onclick="V.closeModal()" class="px-3 py-2 rounded-xl text-xs font-bold text-slate-500 cursor-pointer">Cancelar</button>
           <button onclick="CRM.confirmTicketTransition(${idx}, '${targetEstado}')" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-[#087e70] text-white cursor-pointer">Guardar Cambio en Bitácora</button>`
        );
      },

      async confirmTicketTransition(idx, targetEstado) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const motivo = ($('tkTransitionReason')?.value || '').trim();
        if (!motivo) {
          return toast('⚠️ Debes escribir obligatoriamente el motivo del cambio de estado.');
        }

        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };
        const det = Object.assign({}, tk.detalle || {});
        const prevHist = Array.isArray(det.historial) ? det.historial.slice() : [
          {
            fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
            de_estado: 'NUEVO',
            a_estado: '🟡 Abierto',
            motivo: det.descripcion || 'Solicitud inicial del cliente',
            autor: tk.solicitado_por
          }
        ];

        prevHist.push({
          fecha: nowFormatted(),
          de_estado: this.ticketLabel(tk.estado),
          a_estado: this.ticketLabel(targetEstado),
          motivo,
          autor: ses.email
        });
        det.historial = prevHist;

        const alsoCreateUser = !!$('tkAlsoCreateUser')?.checked;

        try {
          const updatedRow = await crmActualizarTicket(tk.id, targetEstado, det);
          if (updatedRow) {
            this.cachedTickets[idx] = updatedRow;
          } else {
            this.cachedTickets[idx].estado = targetEstado;
            this.cachedTickets[idx].detalle = det;
          }
          V.closeModal();
          toast(`✓ Ticket actualizado a ${this.ticketLabel(targetEstado)} y guardado en bitácora.`);
          await this.loadTickets();

          if (alsoCreateUser && tk.tipo_solicitud === 'NUEVO_USUARIO' && targetEstado === 'APROBADO') {
            this.openNewUserForm({
              empresa_ruc: tk.empresa_ruc,
              nombre: det.nombre || '',
              email: det.email_nuevo || ''
            });
          }
        } catch (e) {
          toast('Error actualizando ticket: ' + e.message);
        }
      },

      openTicketCommentModal(idx) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const currLabel = this.ticketLabel(tk.estado);
        V.openModal(
          '💬 Agregar Nota / Comentario en Bitácora',
          `<div class="space-y-2.5">
             <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">

        const comentario = ($('tkOnlyCommentText')?.value || '').trim();
        if (!comentario) {

        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };
        const det = Object.assign({}, tk.detalle || {});
        const prevHist = Array.isArray(det.historial) ? det.historial.slice() : [
          {
            fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
            de_estado: 'NUEVO',
            a_estado: '🟡 Abierto',
            motivo: det.descripcion || 'Solicitud inicial del cliente',

          }
        ];

        const currLabel = this.ticketLabel(tk.estado);
        prevHist.push({
          fecha: nowFormatted(),
          de_estado: '💬 Nota',
          a_estado: currLabel,
          motivo: comentario,

      async loadRepo(tabla) {
        this.repoTable = tabla;
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Consultando repositorio de auditoría y documentos en Supabase...</div>';
        try {
          if (tabla === 'repo_pagos_documentos_saas') {
            const tks = await crmListarTickets();
            this.cachedTickets = tks;
            this.repoRows = tks
              .filter(t => ['ACTIVACION_VENTA', 'FACTURACION_PAGO'].includes(String(t.tipo_solicitud || '').toUpperCase()))
              .map(t => {
                const d = t.detalle || {};
                return {
                  creado_en: d.fecha_hora_local || (t.creado_en || '').slice(0, 16).replace('T', ' '),
                  empresa_ruc: t.empresa_ruc,
                  empresa_nombre: t.empresa_nombre,
                  entorno: 'PRODUCCION',
                  tipo_registro: t.tipo_solicitud === 'ACTIVACION_VENTA' ? 'ACTIVACION / VENTA' : 'PAGO / FACTURACION',
                  operacion_concepto: d.concepto_pago || d.categoria || t.tipo_solicitud,
                  monto_usd: Number(d.monto_usd || 0).toFixed(2),
                  referencia_bancaria: d.referencia_pago || 'N/A',
                  banco_canal: d.banco_canal || 'Transferencia',
                  numero_factura_sri: d.numero_factura_emitida || 'PENDIENTE',
                  estado: t.estado,
                  responsable: d.agente_nombre || t.solicitado_por || '',
                  formula_cobro: d.formula_cobro || '',
                  link_comprobante_pago: d.comprobante_url || '',
                  link_factura_emitida: d.factura_emitida_url || ''
                };
              });
          } else {
            this.repoRows = await consultarRepositorio(tabla);
          }
          this.renderRepoView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      getFilteredRepoRows() {
        const q = (this.repoSearch || '').toLowerCase();
        return this.repoRows.filter(r => {
          if (this.repoFilterEmpresa !== 'ALL' && r.empresa_ruc !== this.repoFilterEmpresa) return false;
          if (this.repoFilterEntorno !== 'ALL' && r.entorno !== this.repoFilterEntorno) return false;
          const rowDate = (r.creado_en || '').slice(0, 10);
          if (this.repoFilterDesde && rowDate && rowDate < this.repoFilterDesde) return false;
          if (this.repoFilterHasta && rowDate && rowDate > this.repoFilterHasta) return false;
          if (q) {
            const hay = Object.values(r).some(v => String(v ?? '').toLowerCase().includes(q));
            if (!hay) return false;
          }
          return true;
        });
      },

      async exportStaffCommercialXlsx(staffEmail, staffName) {
        const targetMonth = this.staffExcelMonth || new Date().toISOString().slice(0, 7);
        const cleanEmail = String(staffEmail || '').trim().toLowerCase();
        toast(`⏳ Generando Excel (.xlsx) de ${staffName} (${targetMonth})...`);

        try {
          const allTks = await crmListarTickets();
          const userTks = allTks.filter(t => {
            if (String(t.tipo_solicitud || '').toUpperCase() !== 'ACTIVACION_VENTA') return false;
            if (t.estado !== 'APROBADO') return false;
            const d = t.detalle || {};
            const agent = String(d.agente_email || t.solicitado_por || '').trim().toLowerCase();
            if (agent !== cleanEmail) return false;
            const iso = String(d.fecha_iso_local || (t.creado_en ? formatLocalDateTimeCrm(t.creado_en).slice(0, 10) : '')).slice(0, 7);
            return iso === targetMonth;
          });

          const excelRows = [];
          userTks.forEach(t => {
            const d = t.detalle || {};
            const dg = d.desglose_gerencial || {};
            const fechaStr = d.fecha_hora_local || (t.creado_en ? formatLocalDateTimeCrm(t.creado_en) : '');
            const pushRow = (accion, vacVal) => {
              excelRows.push({
                'Nombre de Cliente': t.empresa_nombre || '',
                'RUC': t.empresa_ruc || '',
                'Acción Comercial': accion,
                'VAC (Valor Acción Comercial)': Number(Number(vacVal || 0).toFixed(2)),
                'Fecha': fechaStr
              });
            };

            if (d.es_cobranza) {
              const vacCob = typeof dg.cobranza_vac_usd === 'number'
                ? dg.cobranza_vac_usd
                : Number(d.vac_cobranza_usd || 0);
              pushRow(dg.cobranza_accion_label || d.concepto_pago || 'Cobranza / Renovación', vacCob);
              return;
            }

            let addedAny = false;
            if (Number(dg.venta_nueva_usd) > 0) {
              pushRow(`Venta Nueva de Plan (${String(d.plan_nuevo || '').toUpperCase()})`, Number(dg.venta_nueva_usd));
              addedAny = true;
            }
            if (Number(dg.upgrade_plan_usd) > 0) {
              pushRow(`Upgrade de Plan (${String(d.plan_anterior_label || '')} → ${String(d.plan_nuevo || '').toUpperCase()})`, Number(dg.upgrade_plan_usd));
              addedAny = true;
            }
            if (Number(dg.usuarios_extra_usd) > 0) {
              pushRow('Usuarios Nuevos Adicionales', Number(dg.usuarios_extra_usd));
              addedAny = true;
            }
            if (Number(dg.modulos_ia_extra_usd) > 0) {
              pushRow('Módulos Adicionales IA', Number(dg.modulos_ia_extra_usd));
              addedAny = true;
            }
            if (Number(dg.modulo_personalizado_usd) > 0) {
              pushRow('Módulo Personalizado (A medida)', Number(dg.modulo_personalizado_usd));
              addedAny = true;
            }
            if (Number(dg.downgrade_plan_usd) > 0) {
              pushRow(`Downgrade de Plan (${String(d.plan_anterior_label || '')} → ${String(d.plan_nuevo || '').toUpperCase()})`, -Math.abs(Number(dg.downgrade_plan_usd)));
              addedAny = true;
            }
            if (Number(dg.baja_usuarios_usd) > 0) {
              pushRow('Baja de Usuarios de Cobro', -Math.abs(Number(dg.baja_usuarios_usd)));
              addedAny = true;
            }
            if (Number(dg.baja_modulos_usd) > 0) {
              pushRow('Baja de Módulos IA', -Math.abs(Number(dg.baja_modulos_usd)));
              addedAny = true;
            }

            if (!addedAny) {
              const isBaja = ['DOWNGRADE_PLAN', 'BAJA_USUARIOS_EXTRA', 'BAJA_MODULO_IA'].includes(String(d.tipo_operacion || ''));
              const rawAmt = Number(d.monto_usd || 0);
              pushRow(d.categoria || d.tipo_operacion || 'Movimiento Comercial', isBaja ? -Math.abs(rawAmt) : rawAmt);
            }
          });

          if (excelRows.length === 0) {
            return toast(`⚠️ ${staffName} no tiene acciones comerciales aprobadas en ${targetMonth}.`);
          }

          const totalVac = excelRows.reduce((acc, r) => acc + Number(r['VAC (Valor Acción Comercial)'] || 0), 0);
          excelRows.push({
            'Nombre de Cliente': 'TOTAL NETO VAC DEL MES',
            'RUC': '',
            'Acción Comercial': `${excelRows.length} movimiento(s)`,
            'VAC (Valor Acción Comercial)': Number(totalVac.toFixed(2)),
            'Fecha': targetMonth
          });

          if (typeof XLSX === 'undefined') {
            return toast('⚠️ Librería Excel aún cargando, intenta nuevamente en 2 segundos.');
          }

          const ws = XLSX.utils.json_to_sheet(excelRows);
          ws['!cols'] = [{ wch: 34 }, { wch: 16 }, { wch: 38 }, { wch: 28 }, { wch: 20 }];
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'VAC_Comercial');
          const safeFile = `VAC_${String(staffName).replace(/[^a-zA-Z0-9_-]/g, '_')}_${targetMonth}.xlsx`;
          XLSX.writeFile(wb, safeFile);
          toast(`✅ Excel "${safeFile}" descargado (${excelRows.length - 1} filas + Total).`);
        } catch (e) {
          toast('Error generando Excel: ' + e.message);
        }
      },

      getPlanObject(planId) {
        return PLANS.find(p => p.id === planId) || PLANS[0];
      },

      getEffectiveIncludedModulesCount(planId) {
        const pl = this.getPlanObject(planId);
        return (pl.id === 'enterprise' || pl.includesComboFull) ? 6 : (Number(pl.includedSVACount) || 0);
      },

      computeSaleEngineState() {
        const ruc = ($('saleFormRuc')?.value || '').trim();
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === ruc) || null;
        const tipoOperacion = $('saleFormTipoOp')?.value || 'VENTA_NUEVA_PLAN';
        const planNuevoId = $('saleFormPlan')?.value || 'expansion';
        const periodicidad = $('saleFormPeriod')?.value || 'MENSUAL';
        const isAnual = periodicidad === 'ANUAL';

        const targetPlan = this.getPlanObject(planNuevoId);
        const currentPlan = emp ? this.getPlanObject(emp.plan_activo) : null;

        // Estado actual del cliente ("LO QUE TIENE")
        const currPlanName = currentPlan ? currentPlan.name : 'Ninguno (Cliente Nuevo)';
        const currPlanPrice = currentPlan ? (isAnual ? currentPlan.annualPrice : currentPlan.monthlyPrice) : 0;
        const currIncludedUsers = currentPlan ? currentPlan.includedUsers : 0;
        const currTotalUsers = emp ? (Number(emp.max_usuarios) || currIncludedUsers) : 0;
        const currPaidExtraUsers = Math.max(0, currTotalUsers - currIncludedUsers);
        const currPacks = emp && Array.isArray(emp.packs_ia)
          ? (emp.plan_activo === 'enterprise' ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas'] : emp.packs_ia)
          : [];
        const currIncludedModsQuota = currentPlan ? this.getEffectiveIncludedModulesCount(currentPlan.id) : 0;
        const currPaidExtraModsCount = Math.max(0, currPacks.length - currIncludedModsQuota);

        // Carrito multiproducto (checkboxes + cantidad de usuarios adicionales)
        const cartChangePlan = !!$('cartChkPlan')?.checked;
        const cartAddUsers = !!$('cartChkUsersAdd')?.checked;
        const cartAddMods = !!$('cartChkModsAdd')?.checked;
        const cartCustomMod = !!$('cartChkCustom')?.checked;
        const cartDowngrade = !!$('cartChkDowngrade')?.checked;
        const cartDownUsers = !!$('cartChkUsersDown')?.checked;
        const cartDownMods = !!$('cartChkModsDown')?.checked;

        const qtyUsersAdd = cartAddUsers ? Math.max(1, parseInt($('saleUsersAddQty')?.value, 10) || 1) : 0;
        const qtyUsersDown = cartDownUsers ? Math.max(1, parseInt($('saleUsersDownQty')?.value, 10) || 1) : 0;

        // Plan resultante automático
        const effectivePlan = (cartChangePlan || cartDowngrade || tipoOperacion === 'VENTA_NUEVA_PLAN')
          ? targetPlan
          : (currentPlan || targetPlan);

        const newIncludedUsers = effectivePlan.includedUsers;
        const baseExtraUsersCarry = (emp && effectivePlan.id !== 'piloto') ? currPaidExtraUsers : 0;
        const newPaidExtraUsers = Math.max(0, baseExtraUsersCarry + qtyUsersAdd - qtyUsersDown);
        const newTotalUsers = effectivePlan.id === 'piloto' ? 1 : (newIncludedUsers + newPaidExtraUsers);

        // Módulos seleccionados actualmente en los checkboxes
        const selectedMods = effectivePlan.id === 'enterprise'
          ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas']
          : Array.from(document.querySelectorAll('.sale-mod-chk:checked')).map(x => x.value);

        const newIncludedModsQuota = this.getEffectiveIncludedModulesCount(effectivePlan.id);
        const extraModsOverIncluded = Math.max(0, selectedMods.length - newIncludedModsQuota);

        // Cálculos económicos automáticos
        const newPlanPrice = isAnual ? effectivePlan.annualPrice : effectivePlan.monthlyPrice;
        const unitExtraUserPrice = isAnual ? 9.60 : 1.00;
        const usersAddCost = qtyUsersAdd * unitExtraUserPrice;

        // Módulos nuevos agregados respecto a los que ya tenía
        const newlyAddedMods = selectedMods.filter(m => !currPacks.includes(m));
        const freeSlotsAvailable = Math.max(0, newIncludedModsQuota - currPacks.filter(m => selectedMods.includes(m)).length);
        const chargeableNewMods = newlyAddedMods.slice(freeSlotsAvailable);
        const modsAddCost = chargeableNewMods.reduce((sum, mId) => {
          const pk = SVA_PACKS.find(x => x.id === mId);
          return sum + (pk ? (isAnual ? pk.annualPrice : pk.monthlyPrice) : 0);
        }, 0);

        const customModPrice = cartCustomMod ? (Math.max(0, parseFloat($('saleCustomPrice')?.value) || 0)) : 0;

        // Cálculos de Downgrade / Bajas (para reporte gerencial y control)
        const downgradePlanDiff = (cartDowngrade && currentPlan)
          ? Math.max(0, currPlanPrice - newPlanPrice)
          : 0;
        const downgradeUsersDiff = cartDownUsers ? (qtyUsersDown * unitExtraUserPrice) : 0;
        const removedMods = currPacks.filter(m => !selectedMods.includes(m));
        const downgradeModsDiff = cartDownMods
          ? removedMods.reduce((sum, mId) => {
              const pk = SVA_PACKS.find(x => x.id === mId);
              return sum + (pk ? (isAnual ? pk.annualPrice : pk.monthlyPrice) : 0);
            }, 0)
          : 0;
        const totalDowngradeValue = Number((downgradePlanDiff + downgradeUsersDiff + downgradeModsDiff).toFixed(2));

        // Valor total sugerido a cobrar al cliente
        let suggestedCharge = 0;
        if (tipoOperacion === 'VENTA_NUEVA_PLAN') {
          suggestedCharge = newPlanPrice + usersAddCost + modsAddCost + customModPrice;
        } else {
          if (cartChangePlan) suggestedCharge += newPlanPrice;
          if (cartAddUsers) suggestedCharge += usersAddCost;
          if (cartAddMods) suggestedCharge += modsAddCost;
          if (cartCustomMod) suggestedCharge += customModPrice;
          if (cartDowngrade && !cartChangePlan) suggestedCharge += newPlanPrice; // En downgrade se cobra el plan al que baja
        }
        suggestedCharge = Number(suggestedCharge.toFixed(2));

        // Validaciones estrictas
        const errors = [];
        const activeUsersInDb = emp
          ? this.cachedUsers.filter(u => (u.empresa_id === emp.id || u.empresa_ruc === emp.ruc) && u.activo).length
          : 0;

        if (!emp && tipoOperacion !== 'VENTA_NUEVA_PLAN') {
          errors.push('Este RUC aún no existe como empresa SaaS. Selecciona "Venta Nueva de Plan".');
        }
        if (emp && tipoOperacion === 'VENTA_NUEVA_PLAN') {
          errors.push(`La empresa ${emp.nombre} ya existe (Plan ${currPlanName}). Usa Upgrade, Downgrade o Carrito de Adicionales.`);
        }
        if (cartChangePlan && currentPlan && effectivePlan.rank <= currentPlan.rank) {
          errors.push(`Para Upgrade de Plan debes elegir un plan superior a ${currPlanName}.`);
        }
        if (cartDowngrade && currentPlan && effectivePlan.rank >= currentPlan.rank) {
          errors.push(`Para Downgrade de Plan debes elegir un plan inferior a ${currPlanName}.`);
        }
        if (effectivePlan.id === 'piloto' && (cartAddUsers || newTotalUsers > 1)) {
          errors.push('El Plan Piloto es de 1 solo usuario y no admite usuarios adicionales.');
        }

        // Regla estricta: El cliente NO puede dar de baja usuarios incluidos gratis del plan
        if (cartDownUsers) {
          if (currPaidExtraUsers <= 0) {
            errors.push(`El cliente tiene ${currIncludedUsers} usuarios incluidos gratis en su plan y 0 usuarios de cobro. No se pueden dar de baja usuarios incluidos para obtener descuento.`);
          } else if (qtyUsersDown > currPaidExtraUsers) {
            errors.push(`Solo puedes dar de baja hasta ${currPaidExtraUsers} usuario(s) adicional(es) de cobro (los ${currIncludedUsers} usuarios base son incluidos gratis).`);
          }
        }

        // Regla estricta: Si baja de plan o no marca "Agregar Módulo IA Adicional", no puede exceder el cupo incluido del plan
        if (!cartAddMods && selectedMods.length > newIncludedModsQuota) {
          errors.push(`Cupo excedido: El Plan ${effectivePlan.name} solo incluye ${newIncludedModsQuota} módulo(s) IA gratis y tienes ${selectedMods.length} marcados. Desmarca ${selectedMods.length - newIncludedModsQuota} módulo(s) o marca en el carrito "+ Módulo Adicional IA".`);
        }
        if (cartAddMods && chargeableNewMods.length === 0 && newlyAddedMods.length === 0) {
          errors.push('Marcaste "+ Módulo Adicional IA" en el carrito: debes marcar con check cuál módulo nuevo contrata el cliente.');
        }
        if (cartDownMods && removedMods.length === 0) {
          errors.push('Marcaste "- Baja de Módulo IA": debes desmarcar el check del módulo que el cliente da de baja.');
        }

        return {
          ok: errors.length === 0,
          errors,
          emp,
          tipoOperacion,
          periodicidad,
          isAnual,
          currentPlan,
          currPlanName,
          currPlanPrice,
          currIncludedUsers,
          currTotalUsers,
          currPaidExtraUsers,
          currPacks,
          effectivePlan,
          newPlanPrice,
          newIncludedUsers,
          newPaidExtraUsers,
          newTotalUsers,
          selectedMods,
          newIncludedModsQuota,
          qtyUsersAdd,
          qtyUsersDown,
          unitExtraUserPrice,
          usersAddCost,
          chargeableNewMods,
          modsAddCost,
          cartCustomMod,
          customModPrice,
          cartChangePlan,
          cartAddUsers,
          cartAddMods,
          cartDowngrade,
          cartDownUsers,
          cartDownMods,
          downgradePlanDiff,
          downgradeUsersDiff,
          downgradeModsDiff,
          totalDowngradeValue,
          removedMods,
          suggestedCharge,
          activeUsersInDb
        };
      },

      autofillSaleModalByRuc(rucVal) {
        const clean = String(rucVal || '').trim();
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === clean);
        if (!emp) {
          this.recheckSaleFormLive(true);
          return;
        }
        if ($('saleFormNombre')) $('saleFormNombre').value = emp.nombre || '';
        if ($('saleFormTel')) $('saleFormTel').value = emp.telefono || '';
        if ($('saleFormEmail')) $('saleFormEmail').value = emp.email_contacto || '';
        if ($('saleFormPlan')) $('saleFormPlan').value = emp.plan_activo || 'expansion';
        if ($('saleFormUsers')) $('saleFormUsers').value = Number(emp.max_usuarios) || 5;
        if ($('saleFormPeriod')) $('saleFormPeriod').value = emp.periodicidad || 'MENSUAL';
        if ($('saleFormTipoOp') && $('saleFormTipoOp').value === 'VENTA_NUEVA_PLAN') {
          $('saleFormTipoOp').value = 'UPGRADE_PLAN';
        }
        const packs = emp.plan_activo === 'enterprise'
          ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas']
          : (Array.isArray(emp.packs_ia) ? emp.packs_ia : []);
        document.querySelectorAll('.sale-mod-chk').forEach(chk => {
          chk.checked = packs.includes(chk.value);
        });
        toast(`✓ Empresa existente detectada: ${emp.nombre}`);
        this.onSaleMainOpChange();

      recheckSaleFormLive(updateAmounts = false) {
        const st = this.computeSaleEngineState();

        // Mostrar/ocultar cajas de cantidad según carrito
        if ($('boxUsersAddQty')) $('boxUsersAddQty').classList.toggle('hidden', !st.cartAddUsers);

        // Actualizar campo automático de cupo total de usuarios
        if ($('saleFormUsers')) $('saleFormUsers').value = st.newTotalUsers;

        // Actualizar banner inteligente de módulos incluidos
        const modBanner = $('saleModulesQuotaBanner');
        if (modBanner) {
          if (st.effectivePlan.id === 'enterprise') {
            modBanner.className = 'text-[10.5px] font-extrabold text-[#087e70]';
            modBanner.textContent = '⚡ Plan Enterprise: Incluye los 6 Módulos IA gratis';
          } else if (st.selectedMods.length > st.newIncludedModsQuota && !st.cartAddMods) {
            modBanner.className = 'text-[10.5px] font-extrabold text-rose-700';
            modBanner.textContent = `⛔ Cupo excedido (${st.selectedMods.length}/${st.newIncludedModsQuota} incluidos). No tiene más cupo gratis.`;
          } else {
            modBanner.className = 'text-[10.5px] font-extrabold text-[#087e70]';
            modBanner.textContent = `Selecciona qué módulos necesita el cliente (${st.selectedMods.length}/${st.newIncludedModsQuota} incluidos en ${st.effectivePlan.name})`;
          }
        }

        // Generar Detalle Técnico Automático (No editable)
        const partsDesc = [];
        if (st.tipoOperacion === 'VENTA_NUEVA_PLAN') partsDesc.push(`Alta Plan ${st.effectivePlan.name} (${st.newIncludedUsers} usu. base)`);
        if (st.cartChangePlan && st.tipoOperacion !== 'VENTA_NUEVA_PLAN') partsDesc.push(`Upgrade a Plan ${st.effectivePlan.name}`);
        if (st.cartDowngrade) partsDesc.push(`Downgrade a Plan ${st.effectivePlan.name}`);
        if (st.cartAddUsers) partsDesc.push(`+${st.qtyUsersAdd} Usuario(s) Adicional(es)`);
        if (st.cartDownUsers) partsDesc.push(`-${st.qtyUsersDown} Usuario(s) de Cobro`);
        if (st.cartAddMods && st.chargeableNewMods.length > 0) partsDesc.push(`+${st.chargeableNewMods.length} Módulo(s) IA Adicional`);
        if (st.cartDownMods && st.removedMods.length > 0) partsDesc.push(`-${st.removedMods.length} Módulo(s) IA`);
        if (st.cartCustomMod) partsDesc.push(`Módulo Personalizado ($${st.customModPrice.toFixed(2)})`);
        const autoTechDetail = partsDesc.length > 0 ? partsDesc.join(' + ') : `Plan ${st.effectivePlan.name} · ${st.newTotalUsers} usuarios`;
        if ($('saleFormCustomDesc')) $('saleFormCustomDesc').value = autoTechDetail;

        // Renderizar Comparativo Visual: LO QUE TIENE vs LO QUE PASA A TENER
        const baBox = $('saleBeforeAfterBox');
        if (baBox) {
          const currModNames = st.currPacks.length
            ? st.currPacks.map(id => (SVA_PACKS.find(p => p.id === id)?.name || id).replace('Pack ', '').replace(' IA', '')).join(', ')
            : 'Ninguno';
          const newModNames = st.selectedMods.length
            ? st.selectedMods.map(id => (SVA_PACKS.find(p => p.id === id)?.name || id).replace('Pack ', '').replace(' IA', '')).join(', ')
            : 'Ninguno';

          baBox.innerHTML = `
            <div class="p-2.5 rounded-xl bg-slate-100 border border-slate-300 space-y-1 text-[10.5px]">
              <div class="font-extrabold text-slate-700 uppercase">📌 LO QUE TIENE EL CLIENTE HOY:</div>
              <div>• <strong>Plan:</strong> ${esc(st.currPlanName)} ($${st.currPlanPrice.toFixed(2)})</div>
              <div>• <strong>Usuarios:</strong> ${st.currTotalUsers} total (${st.currIncludedUsers} base + ${st.currPaidExtraUsers} cobro)</div>
              <div>• <strong>Módulos IA (${st.currPacks.length}):</strong> ${esc(currModNames)}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-[#e7f5f1] border border-[#087e70] space-y-1 text-[10.5px]">
              <div class="font-extrabold text-[#073e3b] uppercase">✨ LO QUE PASA A TENER:</div>
              <div>• <strong>Plan:</strong> <span class="text-[#087e70] font-black">${esc(st.effectivePlan.name)}</span> ($${st.newPlanPrice.toFixed(2)}/${st.isAnual ? 'año' : 'mes'})</div>
              <div>• <strong>Usuarios:</strong> <strong>${st.newTotalUsers} total</strong> (${st.newIncludedUsers} base + ${st.newPaidExtraUsers} cobro)</div>
              <div>• <strong>Módulos IA (${st.selectedMods.length}):</strong> ${esc(newModNames)}</div>
            </div>
          `;
        }

        // Mostrar bloque no configurable de Downgrade / Bajas si aplica
        const dgBox = $('saleDowngradeCalcBox');
        const dgInput = $('saleDowngradeCalcDisplay');
        const hasAnyBaja = st.cartDowngrade || st.cartDownUsers || st.cartDownMods;
        if (dgBox && dgInput) {
          dgBox.classList.toggle('hidden', !hasAnyBaja);
          const dgFormulaParts = [];
          if (st.cartDowngrade && st.currentPlan) {
            dgFormulaParts.push(`Plan ${st.currPlanName} ($${st.currPlanPrice.toFixed(2)}) - Plan ${st.effectivePlan.name} ($${st.newPlanPrice.toFixed(2)}) = $${st.downgradePlanDiff.toFixed(2)}`);
          }
          if (st.cartDownUsers) {
            dgFormulaParts.push(`${st.qtyUsersDown} usu. baja × $${st.unitExtraUserPrice.toFixed(2)} = $${st.downgradeUsersDiff.toFixed(2)}`);
          }
          if (st.cartDownMods) {
            dgFormulaParts.push(`Baja ${st.removedMods.length} mód. IA = $${st.downgradeModsDiff.toFixed(2)}`);
          }
          dgInput.value = `$${st.totalDowngradeValue.toFixed(2)} USD  |  ${dgFormulaParts.join('  +  ') || 'Sin impacto'}`;
        }

        // Actualizar valor sugerido a cobrar y fórmula automática de prorrateo/detalle
        if (updateAmounts) {
          if ($('saleFormAmount')) $('saleFormAmount').value = st.suggestedCharge.toFixed(2);
          if ($('saleSuggestedPriceHint')) {
            $('saleSuggestedPriceHint').textContent = `Tarifa lista calculada: $${st.suggestedCharge.toFixed(2)} USD (puedes ajustar si aplicas prorrateo por días).`;
          }
          const fParts = [];
          if (st.tipoOperacion === 'VENTA_NUEVA_PLAN' || st.cartChangePlan) {
            fParts.push(`Plan ${st.effectivePlan.name}: $${st.newPlanPrice.toFixed(2)}`);
          } else if (st.cartDowngrade) {
            fParts.push(`Cobro nuevo Plan ${st.effectivePlan.name} (Downgrade): $${st.newPlanPrice.toFixed(2)}`);
          }
          if (st.cartAddUsers) {
            fParts.push(`${st.qtyUsersAdd} usuario(s) adicional(es) × $${st.unitExtraUserPrice.toFixed(2)} = $${st.usersAddCost.toFixed(2)}`);
          }
          if (st.cartAddMods && st.chargeableNewMods.length > 0) {
            fParts.push(`${st.chargeableNewMods.length} módulo(s) IA adicional = $${st.modsAddCost.toFixed(2)}`);
          }
          if (st.cartCustomMod) {
            fParts.push(`Módulo personalizado = $${st.customModPrice.toFixed(2)}`);
          }
          if (hasAnyBaja) {
            fParts.push(`[Descuento/Downgrade gerencial: -$${st.totalDowngradeValue.toFixed(2)}]`);
          }
          fParts.push(`Total a cobrar = $${st.suggestedCharge.toFixed(2)} USD`);
          if ($('saleFormFormula')) $('saleFormFormula').value = fParts.join(' | ');
        }

        const box = $('saleFormValidationBox');
        if (!box) return st;
        if (!st.ok) {
          box.innerHTML = st.errors.map(err => `
            <div class="p-2 rounded-xl bg-rose-100 border border-rose-300 text-rose-900 font-bold text-[10.5px]">⛔ ${esc(err)}</div>
          `).join('');
        } else {
          box.innerHTML = `<div class="p-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-[10.5px]">✓ Validación comercial y de cupos correcta (${st.effectivePlan.name} · ${st.newTotalUsers} usu. · ${st.selectedMods.length} mód. IA).</div>`;
        }
        return st;
      },
