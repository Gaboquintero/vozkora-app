      async executeSmartActivation(ticketId) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const det = Object.assign({}, tk.detalle || {});
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;
        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };

        const planId = det.plan_nuevo || 'expansion';
        const maxUsuarios = Math.max(1, Number(det.usuarios_nuevo) || 1);
        const periodicidad = det.periodicidad || 'MENSUAL';
        const packsIa = planId === 'enterprise'
          ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas']
          : (Array.isArray(det.modulos_finales) ? det.modulos_finales : []);

        try {
          let suspendedUsersMsg = '';
          if (emp) {
            const patch = {
              plan_activo: planId,
              max_usuarios: maxUsuarios,
              periodicidad,
              packs_ia: packsIa,
              activa: true
            };
            if (det.tipo_operacion === 'UPGRADE_PLAN' || det.tipo_operacion === 'VENTA_NUEVA_PLAN' || det.es_cobranza) {
              patch.fecha_proximo_corte = calcularProximoCorte(periodicidad);
            }
            await crmActualizarEmpresa(emp.id, patch);

            // Suspensión automática al azar si los usuarios activos superan el nuevo cupo (EXCEPCIÓN: ADMIN_EMPRESA)
            const empActiveUsers = (this.cachedUsers || []).filter(u =>
              (u.empresa_id === emp.id || String(u.empresa_ruc || '').trim() === String(emp.ruc || '').trim()) && u.activo
            );
            if (empActiveUsers.length > maxUsuarios) {
              const excessCount = empActiveUsers.length - maxUsuarios;
              // Excluir ADMIN_EMPRESA y SUPERADMIN de la suspensión automática
              const nonAdminCandidates = empActiveUsers.filter(u => !['ADMIN_EMPRESA', 'SUPERADMIN'].includes(String(u.rol || '').toUpperCase()));
              // Mezclar al azar (Fisher-Yates)
              for (let i = nonAdminCandidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [nonAdminCandidates[i], nonAdminCandidates[j]] = [nonAdminCandidates[j], nonAdminCandidates[i]];
              }
              const toSuspend = nonAdminCandidates.slice(0, excessCount);
              for (const uSusp of toSuspend) {
                await crmActualizarUsuario(uSusp.id, { activo: false, session_token: null, dispositivo_info: 'Suspendido por reducción de cupo' });
              }
              if (toSuspend.length > 0) {
                suspendedUsersMsg = ` · ⚠️ ${toSuspend.length} usuario(s) operador(es) suspendido(s) al azar (Admin protegido): ${toSuspend.map(x => x.email).join(', ')}`;
              }
            }
          } else {
            await crmCrearEmpresa({
              nombre: tk.empresa_nombre,
              ruc: tk.empresa_ruc,
              telefono: det.telefono_contacto || '',
              email_contacto: det.email_contacto || tk.solicitado_por,
              plan_activo: planId,
              max_usuarios: maxUsuarios,
              periodicidad,
              entorno: 'PRODUCCION',
              activa: true,
              packs_ia: packsIa,
              sva_elegidos_fijos: planId === 'enterprise'
            });
          }

          const hist = Array.isArray(det.historial) ? det.historial.slice() : [];
          hist.push({
            fecha: nowFormatted(),
            de_estado: '🟡 Pendiente de Activación',
            a_estado: '🟢 Activada en SaaS',
            motivo: `Activación aprobada y aplicada automáticamente (Plan ${planId.toUpperCase()} · ${maxUsuarios} usu.${suspendedUsersMsg}).`,
            autor: ses.email
          });
          det.historial = hist;
          det.activado_en = nowFormatted();
          det.activado_por = ses.email;

          await crmActualizarTicket(tk.id, 'APROBADO', det);

          // Puente automático hacia 🧾 Facturación Pendientes (para emisión de factura SRI y envío WhatsApp)
          const opMeta = SALE_OPERATION_TYPES[det.tipo_operacion] || { label: det.tipo_operacion || 'Activación SaaS' };
          const fechaFact = nowFormatted();
          await crearTicketVozkora({
            empresa_ruc: tk.empresa_ruc,
            empresa_nombre: tk.empresa_nombre,
            solicitado_por: det.agente_email || tk.solicitado_por || 'ventas@vozkora.com',
            tipo_solicitud: 'FACTURACION_PAGO',
            estado: 'PENDIENTE',
            detalle: {
              categoria: `🚀 ${opMeta.label}`,
              origen_modulo: 'ACTIVACIONES_VENTAS',
              ticket_activacion_id: tk.id,
              concepto_pago: `${opMeta.label} · Plan ${planId.toUpperCase()} (${periodicidad})`,
              banco_canal: det.banco_canal || 'Transferencia / Comprobante Venta',
              monto_usd: Number(det.monto_usd || 0),
              referencia_pago: det.referencia_pago || 'N/A',
              formula_cobro: det.formula_cobro || '',
              comprobante_url: det.comprobante_url || '',
              telefono_contacto: det.telefono_contacto || (emp ? emp.telefono : '') || '',
              email_contacto: det.email_contacto || (emp ? emp.email_contacto : '') || '',
              agente_email: det.agente_email || tk.solicitado_por || '',
              agente_nombre: det.agente_nombre || tk.solicitado_por || 'Asesor Comercial',
              agente_rol: det.agente_rol || 'VENTAS',
              autorizado_por: ses.email,
              autorizado_en: fechaFact,
              fecha_hora_local: fechaFact,
              fecha_iso_local: typeof obtenerFechaLocalISO === 'function' ? obtenerFechaLocalISO(0) : new Date().toISOString().slice(0, 10),
              historial: [
                {
                  fecha: fechaFact,
                  de_estado: '🟢 Activación Autorizada',
                  a_estado: '🟡 Pendiente de Facturar',
                  motivo: `Transferido automáticamente tras autorización de ${opMeta.label} ($${Number(det.monto_usd || 0).toFixed(2)}) por ${ses.email}`,
                  autor: ses.email
                }
              ]
            }
          });

          V.closeModal();
          toast(`✅ Activación aplicada a ${tk.empresa_nombre}${suspendedUsersMsg} y enviada a 🧾 Facturación Pendientes.`);
          await this.loadActivationsTab();
        } catch (e) {
          toast('Error aplicando activación: ' + e.message);
        }
      },

      async loadInvoicingTab() {

        try {

          this.renderInvoicingView();

      renderInvoicingView() {
        const body = $('crm-body');
        const rolNorm = this.getSessionRole();
        const canEmitInvoice = ['SUPERADMIN', 'FACTURACION'].includes(rolNorm);
        const sesNow = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
        const myEmail = String((sesNow && sesNow.email) || '').trim().toLowerCase();

        const allPays = this.cachedTickets.filter(t => String(t.tipo_solicitud || '').toUpperCase() === 'FACTURACION_PAGO');
        const visiblePays = (['SUPERADMIN', 'FACTURACION', 'SUPERVISOR', 'AUDITOR'].includes(rolNorm))
          ? allPays
          : allPays.filter(t => String(t.solicitado_por || '').trim().toLowerCase() === myEmail);

        const pend = visiblePays.filter(t => t.estado === 'PENDIENTE');
        const fact = visiblePays.filter(t => t.estado === 'APROBADO');

        let list = pend;
        if (this.invoicingFilter === 'FACTURADAS') list = fact;
        else if (this.invoicingFilter === 'TODAS') list = visiblePays;

        if (this.invoicingOriginFilter && this.invoicingOriginFilter !== 'ALL') {
          list = list.filter(t => {
            const orig = String((t.detalle && t.detalle.origen_modulo) || 'COBRANZAS').toUpperCase();
            return orig === this.invoicingOriginFilter;
          });
        }

        if (list.length > 0 && (!this.selectedInvoicingId || !list.some(x => x.id === this.selectedInvoicingId))) {
          this.selectedInvoicingId = list[0].id;
        } else if (list.length === 0) {
          this.selectedInvoicingId = '';
        }

        const selPay = list.find(x => x.id === this.selectedInvoicingId) || null;
        let detailHtml = `
          <div class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-400 space-y-2">
            <div class="text-3xl">🧾</div>
            <div class="text-sm font-extrabold text-[#073e3b]">Selecciona una solicitud pendiente de facturar</div>
            <p class="text-[11px] max-w-sm">Aquí llegan tanto las activaciones autorizadas de Ventas/Retención como los pagos de Cobranzas para subir la factura emitida y enviarla por WhatsApp al cliente.</p>
          </div>
        `;

      async submitSaveIssuedInvoice(ticketId) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const numFact = ($('invEmitNumber')?.value || '').trim();
        const fileObj = $('invEmitFile')?.files?.[0] || null;
        const renewCycle = !!$('invRenewCycleChk')?.checked;

        if (!numFact) return toast('⚠️ Ingresa el número de factura emitida.');
        if (!fileObj && !(tk.detalle && tk.detalle.factura_emitida_url)) {
          return toast('⚠️ Selecciona el archivo PDF o imagen de la factura emitida.');
        }

        const btn = $('btnSaveIssuedInv');
        if (btn) { btn.textContent = 'Guardando factura...'; btn.disabled = true; }

        try {
          const det = Object.assign({}, tk.detalle || {});
          let factUrl = det.factura_emitida_url || '';
          if (fileObj && typeof subirComprobanteOperacionSupabase === 'function') {
            const up = await subirComprobanteOperacionSupabase(fileObj, 'facturas_emitidas', tk.empresa_ruc);
            if (up && up.url) factUrl = up.url;
          }

          const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'facturacion@vozkora.com' };
          const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;

          if (renewCycle && emp) {
            const per = String(det.concepto_pago || '').toUpperCase().includes('ANUAL') ? 'ANUAL' : (emp.periodicidad || 'MENSUAL');
            const nextCorte = calcularProximoCorte(per);
            await crmActualizarEmpresa(emp.id, {
              periodicidad: per,
              fecha_proximo_corte: nextCorte,
              activa: true
            });
          }

          const hist = Array.isArray(det.historial) ? det.historial.slice() : [];
          hist.push({
            fecha: nowFormatted(),
            de_estado: '🟡 Pendiente de Facturar',
            a_estado: `🟢 Factura Guardada (${numFact})`,
            motivo: `Factura ${numFact} emitida y archivada por ${ses.email}`,
            autor: ses.email
          });

          det.numero_factura_emitida = numFact;
          det.factura_emitida_url = factUrl;
          det.facturado_por = ses.email;
          det.facturado_en = nowFormatted();
          det.historial = hist;

          await crmActualizarTicket(tk.id, 'PENDIENTE', det);
          V.closeModal();
          toast(`✅ Factura ${numFact} guardada. Pulsa "📲 Enviar Factura al Cliente por WhatsApp" para entregarla y cerrar el pendiente.`);
          await this.loadInvoicingTab();
        } catch (e) {
          toast('Error guardando factura: ' + e.message);
        } finally {
          if (btn) { btn.textContent = '💾 Guardar Factura en Repositorio'; btn.disabled = false; }
        }
      },

      async sendIssuedInvoiceWhatsApp(ticketId) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const det = Object.assign({}, tk.detalle || {});
        if (!det.factura_emitida_url || !det.numero_factura_emitida) {
          return toast('⚠️ Primero guarda el número y archivo de la factura emitida antes de enviarla al cliente.');
        }
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;
        const rawPhone = String(det.telefono_contacto || (emp && emp.telefono) || '').replace(/\D/g, '');
        if (!rawPhone) {
          return toast('⚠️ Esta empresa no tiene teléfono WhatsApp registrado. Agrégalo en Empresas SaaS.');
        }
        const phoneIntl = rawPhone.startsWith('0') && rawPhone.length === 10
          ? ('593' + rawPhone.slice(1))
          : rawPhone;

        const lines = [
          `Hola *${tk.empresa_nombre}* (RUC: ${tk.empresa_ruc}) 👋`,
          `Te adjuntamos tu comprobante electrónico de *Vozkora SaaS*:`,
          `• *Concepto:* ${det.concepto_pago || 'Suscripción Vozkora'}`,
          `• *Factura N°:* ${det.numero_factura_emitida}`,
          `• *Valor Total:* $${Number(det.monto_usd || 0).toFixed(2)} USD`,
          `¡Gracias por confiar en Vozkora!`
        ].filter(Boolean).join('\n');

        try {
          const resp = await fetch(det.factura_emitida_url);
          const blob = await resp.blob();
          const ext = blob.type === 'application/pdf' ? 'pdf' : (blob.type.split('/')[1] || 'jpg');
          const safeNum = String(det.numero_factura_emitida || tk.empresa_ruc || 'Factura').replace(/[^a-zA-Z0-9_-]/g, '_');
          const fileName = `Factura_${safeNum}.${ext}`;

          const a = document.createElement('a');
          const objUrl = URL.createObjectURL(blob);
          a.href = objUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(objUrl); }, 500);
          toast(`📥 Factura "${fileName}" descargada para adjuntar en WhatsApp. Registro cerrado en Facturación.`);
        } catch (e) {
          toast('💬 Abriendo WhatsApp para adjuntar factura. Registro cerrado en Facturación.');
        }

        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'facturacion@vozkora.com' };
        const hist = Array.isArray(det.historial) ? det.historial.slice() : [];
        hist.push({
          fecha: nowFormatted(),
          de_estado: '📄 Factura Guardada',
          a_estado: '🟢 Enviada a Cliente WhatsApp',
          motivo: `Factura ${det.numero_factura_emitida} enviada por WhatsApp por ${ses.email}`,
          autor: ses.email
        });
        det.factura_enviada_cliente = true;
        det.factura_enviada_en = nowFormatted();
        det.historial = hist;

        try {
          await crmActualizarTicket(tk.id, 'APROBADO', det);
        } catch (e) {}

        window.open(`https://wa.me/${phoneIntl}?text=${encodeURIComponent(lines)}`, '_blank');
        if (this.currentTab === 'invoicing') {
          await this.loadInvoicingTab();
        }
      },

      computePaymentEngineState() {
        const ruc = ($('payFormRuc')?.value || '').trim();
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === ruc) || null;
        const concepto = $('payFormConcept')?.value || 'Renovación Mensual';
        const isAnual = concepto === 'Renovación Anual VIP';
        const periodicidad = isAnual ? 'ANUAL' : 'MENSUAL';

        const currentPlan = emp ? this.getPlanObject(emp.plan_activo) : this.getPlanObject('expansion');
        const currPlanPrice = isAnual ? currentPlan.annualPrice : currentPlan.monthlyPrice;
        const currIncludedUsers = currentPlan.includedUsers;
        const currTotalUsers = emp ? (Number(emp.max_usuarios) || currIncludedUsers) : currIncludedUsers;
        const currPaidExtraUsers = Math.max(0, currTotalUsers - currIncludedUsers);
        const currPacks = emp && Array.isArray(emp.packs_ia)
          ? (emp.plan_activo === 'enterprise' ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas'] : emp.packs_ia)
          : [];

        // Opciones de cambio de plan / bajas al renovar
        const payChangePlan = !!$('payChkChangePlan')?.checked;
        const payDownUsers = !!$('payChkDownUsers')?.checked;
        const payDownMods = !!$('payChkDownMods')?.checked;

        const targetPlanId = payChangePlan ? ($('payFormPlan')?.value || currentPlan.id) : currentPlan.id;
        const effectivePlan = this.getPlanObject(targetPlanId);
        const newPlanPrice = isAnual ? effectivePlan.annualPrice : effectivePlan.monthlyPrice;

        // Evaluación por NOMBRE / JERARQUÍA DEL PLAN (no por precio anual vs mensual):
        // - Si el plan nuevo tiene menor jerarquía (rank < currentPlan.rank) => ES DOWNGRADE DE PLAN
        // - Si el plan nuevo es el MISMO nombre/jerarquía (rank === currentPlan.rank) aunque cambie de Anual a Mensual => MANTIENE PLAN (NO es downgrade)
        // - Si el plan nuevo tiene mayor jerarquía (rank > currentPlan.rank) aunque cambie de Anual a Mensual => ES UPGRADE DE PLAN (NO es downgrade)
        const isPlanDowngrade = effectivePlan.rank < currentPlan.rank;
        const isPlanUpgrade = effectivePlan.rank > currentPlan.rank;
        const hasDowngrade = isPlanDowngrade || payDownUsers || payDownMods;

        const qtyUsersDown = payDownUsers ? Math.max(1, parseInt($('payUsersDownQty')?.value, 10) || 1) : 0;
        const unitExtraUserPrice = isAnual ? 9.60 : 1.00;
        const newIncludedUsers = effectivePlan.includedUsers;
        const baseExtraCarry = effectivePlan.id === 'piloto' ? 0 : currPaidExtraUsers;
        const newPaidExtraUsers = Math.max(0, baseExtraCarry - qtyUsersDown);
        const newTotalUsers = effectivePlan.id === 'piloto' ? 1 : (newIncludedUsers + newPaidExtraUsers);

        const selectedMods = effectivePlan.id === 'enterprise'
          ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas']
          : Array.from(document.querySelectorAll('.pay-mod-chk:checked')).map(x => x.value);

        const newIncludedModsQuota = this.getEffectiveIncludedModulesCount(effectivePlan.id);

        // Valor de suscripción resultante a cobrar al cliente
        const extraUsersCharge = newPaidExtraUsers * unitExtraUserPrice;
        const extraModsCharge = selectedMods.slice(newIncludedModsQuota).reduce((sum, mId) => {
          const pk = SVA_PACKS.find(x => x.id === mId);
          return sum + (pk ? (isAnual ? pk.annualPrice : pk.monthlyPrice) : 0);
        }, 0);

        const suggestedCobro = Number((newPlanPrice + extraUsersCharge + extraModsCharge).toFixed(2));

        // Cálculo exacto del VAC de Cobranza basado en JERARQUÍA DE PLAN:
        // - Recuperación cliente mayor a 60 días -> +100% del valor cobrado (igual que venta nueva)
        // - Mismo plan (ej. Anual -> Mensual mismo plan) o Upgrade de plan (ej. Anual Plan X -> Mensual Plan Y) sin bajas -> +10% POSITIVO
        // - Downgrade de plan (baja a plan inferior), baja de usuarios o baja de módulos -> -10% NEGATIVO
        const vacCobranza = concepto === 'Recuperación cliente mayor a 60 días'
          ? suggestedCobro
          : (hasDowngrade ? Number((-suggestedCobro * 0.10).toFixed(2)) : Number((suggestedCobro * 0.10).toFixed(2)));

        // Validaciones
        const errors = [];
        if (emp) {
          const sub = evaluarEstadoSuscripcion(emp);
          if (concepto === 'Recuperación cliente mayor a 60 días' && sub.diasMora <= 60) {
            errors.push(`Esta empresa tiene ${sub.diasMora} días de mora. "Recuperación cliente mayor a 60 días" aplica únicamente cuando supera 60 días.`);
          }
        }
        if (payDownUsers) {
          if (currPaidExtraUsers <= 0) {
            errors.push(`El cliente tiene ${currIncludedUsers} usuarios incluidos gratis y 0 usuarios de cobro. No se pueden dar de baja usuarios incluidos.`);
          } else if (qtyUsersDown > currPaidExtraUsers) {
            errors.push(`Solo puedes dar de baja hasta ${currPaidExtraUsers} usuario(s) adicional(es) de cobro.`);
          }
        }
        if (selectedMods.length > newIncludedModsQuota && hasDowngrade) {
          errors.push(`El Plan ${effectivePlan.name} solo incluye ${newIncludedModsQuota} módulo(s) IA gratis y tienes ${selectedMods.length} marcados. Desmarca ${selectedMods.length - newIncludedModsQuota} módulo(s).`);
        }
        const removedMods = currPacks.filter(m => !selectedMods.includes(m));
        if (payDownMods && removedMods.length === 0) {
          errors.push('Marcaste "- Baja de Módulo IA": debes desmarcar el check del módulo que da de baja el cliente.');
        }

        return {
          ok: errors.length === 0,
          errors,
          emp,
          concepto,
          isAnual,
          periodicidad,
          currentPlan,
          currPlanPrice,
          currIncludedUsers,
          currTotalUsers,
          currPaidExtraUsers,
          currPacks,
          effectivePlan,
          newPlanPrice,
          newIncludedUsers,
          newPaidExtraUsers,
          newTotalUsers,
          selectedMods,
          newIncludedModsQuota,
          qtyUsersDown,
          unitExtraUserPrice,
          payChangePlan,
          payDownUsers,
          payDownMods,
          isPlanDowngrade,
          isPlanUpgrade,
          hasDowngrade,
          suggestedCobro,
          vacCobranza
        };
      },

      recheckPaymentFormLive(updateAmounts = false) {
        const st = this.computePaymentEngineState();
        if ($('payFormPlan')) $('payFormPlan').disabled = !st.payChangePlan;
        if ($('payBoxDownUsersQty')) $('payBoxDownUsersQty').classList.toggle('hidden', !st.payDownUsers);
        if ($('payFormUsers')) $('payFormUsers').value = st.newTotalUsers;

        const modBanner = $('payModsBanner');
        if (modBanner) {
          modBanner.textContent = `${st.selectedMods.length}/${st.newIncludedModsQuota} incluidos en ${st.effectivePlan.name}`;
        }

        const baBox = $('payBeforeAfterBox');
        if (baBox) {
          baBox.innerHTML = `
            <div class="p-2 rounded-xl bg-slate-100 border border-slate-300 text-[10.5px]">
              <div class="font-extrabold text-slate-700">📌 CICLO ANTERIOR:</div>
              <div>Plan: <strong>${esc(st.currentPlan.name)}</strong> · ${st.currTotalUsers} usu. · ${st.currPacks.length} mód.</div>
            </div>
            <div class="p-2 rounded-xl bg-[#e7f5f1] border border-[#087e70] text-[10.5px]">
              <div class="font-extrabold text-[#073e3b]">✨ RENOVACIÓN A APLICAR:</div>
              <div>Plan: <strong>${esc(st.effectivePlan.name)}</strong> (${st.periodicidad}) · ${st.newTotalUsers} usu. · ${st.selectedMods.length} mód.</div>
            </div>
          `;
        }

        const condLabel = st.hasDowngrade
          ? 'CON DOWNGRADE'
          : (st.isPlanUpgrade ? 'UPGRADE DE PLAN' : 'MISMO PLAN');

        if (updateAmounts) {
          if ($('payFormAmount')) $('payFormAmount').value = st.suggestedCobro.toFixed(2);
          if ($('payFormFormula')) {
            $('payFormFormula').value = `${st.concepto} (${condLabel}) · Plan ${st.effectivePlan.name} (${st.newTotalUsers} usu., ${st.selectedMods.length} mód.) = $${st.suggestedCobro.toFixed(2)} USD`;
          }
        }
        const vacHint = $('payVacHint');
        if (vacHint) {
          vacHint.className = st.vacCobranza < 0 ? 'text-[10px] font-extrabold text-rose-700 mt-0.5' : 'text-[10px] font-extrabold text-[#087e70] mt-0.5';
          vacHint.textContent = `VAC Comisionable (${condLabel}): ${st.vacCobranza >= 0 ? '+' : ''}$${st.vacCobranza.toFixed(2)} USD`;
        }

        const vBox = $('payValidationBox');
        if (vBox) {
          vBox.innerHTML = st.ok
            ? `<div class="p-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-[10.5px]">✓ Validación correcta (${condLabel}). Viajará a 🚀 Activaciones Pendientes.</div>`
            : st.errors.map(e => `<div class="p-2 rounded-xl bg-rose-100 border border-rose-300 text-rose-900 font-bold text-[10.5px]">⛔ ${esc(e)}</div>`).join('');
        }
        return st;
      },

      autofillPaymentModalByRuc(rucVal) {
        const clean = String(rucVal || '').trim();
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === clean);
        if (!emp) return;
        if ($('payFormNombre')) $('payFormNombre').value = emp.nombre || '';
        if ($('payFormPlan')) $('payFormPlan').value = emp.plan_activo || 'expansion';
        if ($('payFormConcept') && emp.periodicidad === 'ANUAL') $('payFormConcept').value = 'Renovación Anual VIP';
        const packs = emp.plan_activo === 'enterprise'
          ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas']
          : (Array.isArray(emp.packs_ia) ? emp.packs_ia : []);
        document.querySelectorAll('.pay-mod-chk').forEach(chk => {
          chk.checked = packs.includes(chk.value);
        });
        toast('✓ Empresa detectada: ' + emp.nombre);
        this.recheckPaymentFormLive(true);
      },

      async submitPaymentEntry() {
        const ruc = ($('payFormRuc')?.value || '').trim();
        const nombre = ($('payFormNombre')?.value || '').trim();
        const banco = $('payFormBank')?.value || 'Transferencia';
        const montoUsd = parseFloat($('payFormAmount')?.value);
        const refPago = ($('payFormRef')?.value || '').trim();
        const formulaCobro = ($('payFormFormula')?.value || '').trim();
        const fileObj = $('payFormFile')?.files?.[0] || null;

        if (!ruc || !nombre) return toast('Ingresa RUC y Razón Social del cliente.');
        if (!refPago) return toast('⚠️ El campo N° Comprobante / Referencia * es obligatorio.');
        if (isNaN(montoUsd) || montoUsd <= 0) return toast('Ingresa un monto válido.');
        if (!formulaCobro) return toast('⚠️ Debes escribir la fórmula de cobro.');
        if (!fileObj) return toast('⚠️ Debes adjuntar obligatoriamente el comprobante de pago (imagen o PDF).');

        const st = this.recheckPaymentFormLive(false);
        if (!st.ok) return toast('⛔ Corrige los errores marcados en rojo antes de continuar.');

        const btn = $('btnSubmitPayEntry');
        if (btn) { btn.textContent = 'Enviando a Activaciones...'; btn.disabled = true; }

        try {
          let compUrl = '';
          if (typeof subirComprobanteOperacionSupabase === 'function') {
            const up = await subirComprobanteOperacionSupabase(fileObj, 'cobranzas', ruc);
            if (up && up.url) compUrl = up.url;
          }
          const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || {};
          const fechaLocal = nowFormatted();

          const vacFinal = st.concepto === 'Recuperación cliente mayor a 60 días'
            ? Number(montoUsd.toFixed(2))
            : (st.hasDowngrade ? Number((-montoUsd * 0.10).toFixed(2)) : Number((montoUsd * 0.10).toFixed(2)));

          const condTag = st.hasDowngrade ? ' (Con Downgrade)' : (st.isPlanUpgrade ? ' (Upgrade de Plan)' : ' (Mismo Plan)');
          const accionLabel = `${st.concepto}${condTag}`;

          await crearTicketVozkora({
            empresa_ruc: ruc,
            empresa_nombre: nombre,
            solicitado_por: ses.email || 'cobranzas@vozkora.com',
            tipo_solicitud: 'ACTIVACION_VENTA',
            estado: 'PENDIENTE',
            detalle: {
              categoria: `💳 ${accionLabel}`,
              es_cobranza: true,
              tipo_operacion: st.isPlanDowngrade ? 'DOWNGRADE_PLAN' : (st.isPlanUpgrade ? 'UPGRADE_PLAN' : (st.payDownUsers ? 'BAJA_USUARIOS_EXTRA' : (st.payDownMods ? 'BAJA_MODULO_IA' : 'RENOVACION_COBRANZA'))),
              concepto_pago: accionLabel,
              banco_canal: banco,
              plan_anterior: st.currentPlan.id,
              plan_anterior_label: st.currentPlan.name,
              plan_nuevo: st.effectivePlan.id,
              usuarios_anterior: st.currTotalUsers,
              usuarios_nuevo: st.newTotalUsers,
              usuarios_delta: st.newTotalUsers - st.currTotalUsers,
              periodicidad: st.periodicidad,
              modulos_finales: st.selectedMods,
              monto_usd: montoUsd,
              vac_cobranza_usd: vacFinal,
              desglose_gerencial: {
                cobranza_accion_label: accionLabel,
                cobranza_vac_usd: vacFinal
              },
              referencia_pago: refPago,
              formula_cobro: formulaCobro,
              comprobante_url: compUrl,
              telefono_contacto: (st.emp && st.emp.telefono) || '',
              email_contacto: (st.emp && st.emp.email_contacto) || '',
              agente_email: ses.email || '',
              agente_nombre: ses.nombre_completo || ses.email || 'Cobranzas',
              agente_rol: ses.rol || 'COMERCIAL_COBRANZAS',
              fecha_hora_local: fechaLocal,
              fecha_iso_local: typeof obtenerFechaLocalISO === 'function' ? obtenerFechaLocalISO(0) : new Date().toISOString().slice(0, 10),
              historial: [
                {
                  fecha: fechaLocal,
                  de_estado: 'NUEVO',
                  a_estado: '🟡 Pendiente Activación (Cobranza)',
                  motivo: `${accionLabel} · Cobro: $${montoUsd.toFixed(2)} (VAC: ${vacFinal >= 0 ? '+' : ''}$${vacFinal.toFixed(2)}) · Ref: ${refPago}`,
                  autor: ses.email || 'Cobranzas'
                }
              ]
            }
          });

          V.closeModal();
          toast('🚀 Cobranza registrada: viajó a Activaciones Pendientes y se retiró de tu cartera pendiente.');
          if (this.currentTab === 'billing') await this.loadBillingTab();
          else if (this.currentTab === 'invoicing') await this.loadInvoicingTab();
        } catch (e) {
          toast('Error registrando cobranza: ' + e.message);
        } finally {
          if (btn) { btn.textContent = '🚀 Enviar a Activaciones Pendientes'; btn.disabled = false; }
        }
      },

      async approveInvoicingAndRenew(ticketId) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;
        const det = Object.assign({}, tk.detalle || {});
        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };

        if (!confirm(`¿Confirmas validar el pago de $${Number(det.monto_usd || 0).toFixed(2)} de ${tk.empresa_nombre} y renovar su próximo ciclo de corte?`)) {
          return;
        }

        try {
          if (emp) {
            const per = String(det.concepto_pago || '').toUpperCase().includes('ANUAL') ? 'ANUAL' : (emp.periodicidad || 'MENSUAL');
            const nextCorte = calcularProximoCorte(per);
            await crmActualizarEmpresa(emp.id, {
              periodicidad: per,
              fecha_proximo_corte: nextCorte,
              activa: true
            });
          }

          const hist = Array.isArray(det.historial) ? det.historial.slice() : [];
          hist.push({
            fecha: nowFormatted(),
            de_estado: '🟡 Pendiente de Facturar',
            a_estado: '🟢 Facturado y Renovado',
            motivo: `Pago validado ($${Number(det.monto_usd || 0).toFixed(2)}) y ciclo renovado.`,
            autor: ses.email
          });
          det.historial = hist;
          await crmActualizarTicket(tk.id, 'APROBADO', det);
          toast(`✅ Pago validado y ciclo renovado para ${tk.empresa_nombre}.`);
          await this.loadInvoicingTab();
        } catch (e) {
          toast('Error validando pago: ' + e.message);
        }
      },

      // ===================================================================
      // INFORME GERENCIAL OPERATIVO + CALIDAD DEL EQUIPO (FILTRO DÍA/MES/AÑO)
      // ===================================================================
      async loadAnalyticsTab() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Consolidando indicadores gerenciales y métricas de calidad del equipo...</div>';
        try {
          const [tks, emps, usrs] = await Promise.all([crmListarTickets(), crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedTickets = tks;
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.cachedStaff = usrs.filter(u => this.isInternalRole(u.rol));
          this.renderAnalyticsView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      renderAnalyticsView() {
        const body = $('crm-body');
        const period = this.analyticsPeriod || 'month';
        const refDate = this.analyticsDate || new Date().toISOString().slice(0, 10);
        const refYear = refDate.slice(0, 4);
        const refMonth = refDate.slice(0, 7);

        const matchesDate = (tk) => {
          const det = tk.detalle || {};
          const iso = String(det.fecha_iso_local || (tk.creado_en ? formatLocalDateTimeCrm(tk.creado_en).slice(0, 10) : refDate)).slice(0, 10);
          if (period === 'day') return iso === refDate;
          if (period === 'year') return iso.slice(0, 4) === refYear;
          return iso.slice(0, 7) === refMonth;
        };

        const approvedSales = this.cachedTickets.filter(t => t.tipo_solicitud === 'ACTIVACION_VENTA' && t.estado === 'APROBADO' && matchesDate(t));
        const approvedPays = this.cachedTickets.filter(t => t.tipo_solicitud === 'FACTURACION_PAGO' && t.estado === 'APROBADO' && matchesDate(t));

        const sumByOp = (opKey) => {
          const items = approvedSales.filter(t => (t.detalle || {}).tipo_operacion === opKey);
          return {
            count: items.length,
            total: items.reduce((a, x) => a + Number((x.detalle || {}).monto_usd || 0), 0)
          };
        };

        const sumCartField = (fieldKey, fallbackOpKey) => {
          let count = 0;
          let total = 0;
          approvedSales.forEach(t => {
            const det = t.detalle || {};
            const dg = det.desglose_gerencial || null;
            if (dg && typeof dg[fieldKey] === 'number') {
              if (dg[fieldKey] > 0) { count += 1; total += Number(dg[fieldKey]); }
            } else if (det.tipo_operacion === fallbackOpKey) {
              count += 1;
              total += Number(det.monto_usd || 0);
            }
          });
          return { count, total };
        };

        const kpiNuevas = sumCartField('venta_nueva_usd', 'VENTA_NUEVA_PLAN');
        const kpiUpgrades = sumCartField('upgrade_plan_usd', 'UPGRADE_PLAN');
        const kpiUsersExtra = sumCartField('usuarios_extra_usd', 'VENTA_USUARIOS_EXTRA');
        const kpiModulosIa = sumCartField('modulos_ia_extra_usd', 'VENTA_MODULO_IA');
        const kpiPersonalizado = sumCartField('modulo_personalizado_usd', 'VENTA_MODULO_PERSONALIZADO');
        const kpiDowngrades = sumCartField('downgrade_plan_usd', 'DOWNGRADE_PLAN');
        const kpiBajaUsers = sumCartField('baja_usuarios_usd', 'BAJA_USUARIOS_EXTRA');
        const kpiBajaMods = sumCartField('baja_modulos_usd', 'BAJA_MODULO_IA');
        const totalRecaudoCobranzas = approvedPays.reduce((a, x) => a + Number((x.detalle || {}).monto_usd || 0), 0);

        const sellersMap = {};
        approvedSales.forEach(t => {
          const det = t.detalle || {};
          const k = det.agente_email || t.solicitado_por || 'Sin asignar';
          if (!sellersMap[k]) sellersMap[k] = { name: det.agente_nombre || k, email: k, count: 0, total: 0 };
          sellersMap[k].count += 1;
          sellersMap[k].total += Number(det.monto_usd || 0);
        });
        const topSellers = Object.values(sellersMap).sort((a, b) => b.total - a.total);

        const collectorsMap = {};
        approvedPays.forEach(t => {
          const det = t.detalle || {};
          const k = det.agente_email || t.solicitado_por || 'Sin asignar';
          if (!collectorsMap[k]) collectorsMap[k] = { name: det.agente_nombre || k, email: k, count: 0, total: 0 };
          collectorsMap[k].count += 1;
          collectorsMap[k].total += Number(det.monto_usd || 0);
        });
        const topCollectors = Object.values(collectorsMap).sort((a, b) => b.total - a.total);

        const staffForQuality = this.cachedStaff.filter(u => String(u.rol || '').toUpperCase() !== 'SUPERADMIN');
        const demoQualityRows = staffForQuality.length > 0
          ? staffForQuality.map((u, idx) => {
              const r = String(u.rol || '').toUpperCase();
              const area = r === 'COBRANZAS' ? 'Cobranzas' : (r === 'SOPORTE' ? 'Soporte Técnico' : 'Ventas & Retención');
              const demoScore = [96, 92, 89, 94, 91, 88][idx % 6];
              return { name: u.nombre_completo || u.email, rol: r, area, score: demoScore, cases: 14 + (idx * 3) };
            })
          : [
              { name: 'Laura Mendoza (Demo)', rol: 'VENTAS', area: 'Ventas & Retención', score: 95, cases: 18 },
              { name: 'Carlos Paredes (Demo)', rol: 'COBRANZAS', area: 'Cobranzas', score: 92, cases: 24 },
              { name: 'Andrea Gómez (Demo)', rol: 'RETENCION', area: 'Ventas & Retención', score: 90, cases: 12 }
            ];

        const avgGeneral = demoQualityRows.length > 0
          ? (demoQualityRows.reduce((a, x) => a + x.score, 0) / demoQualityRows.length).toFixed(1)
          : '92.5';
        const salesQRows = demoQualityRows.filter(x => x.area !== 'Cobranzas');
        const cobQRows = demoQualityRows.filter(x => x.area === 'Cobranzas');
        const avgVentasQ = salesQRows.length > 0 ? (salesQRows.reduce((a, x) => a + x.score, 0) / salesQRows.length).toFixed(1) : '93.0';
        const avgCobranzasQ = cobQRows.length > 0 ? (cobQRows.reduce((a, x) => a + x.score, 0) / cobQRows.length).toFixed(1) : '91.5';

        body.innerHTML = `
          <div class="bg-white rounded-2xl p-4 border border-[#dce6e5] space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
              <div>
                <h3 class="text-sm font-extrabold text-[#073e3b]">📈 Informe Gerencial de Operación SaaS & Calidad</h3>
                <p class="text-[11px] text-slate-500">Consolidado en vivo de ventas nuevas, upgrades, bajas, recaudación y desempeño del equipo.</p>
              </div>
              <div class="flex flex-wrap items-center gap-1.5 bg-[#f5f8f8] p-1.5 rounded-xl border border-[#dce6e5]">
                <button onclick="CRM.analyticsPeriod='day'; CRM.renderAnalyticsView();" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${period === 'day' ? 'bg-[#073e3b] text-[#70d2bd]' : 'text-slate-600'}">Por Día</button>
                <button onclick="CRM.analyticsPeriod='month'; CRM.renderAnalyticsView();" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${period === 'month' ? 'bg-[#073e3b] text-[#70d2bd]' : 'text-slate-600'}">Por Mes</button>
                <button onclick="CRM.analyticsPeriod='year'; CRM.renderAnalyticsView();" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${period === 'year' ? 'bg-[#073e3b] text-[#70d2bd]' : 'text-slate-600'}">Por Año</button>
                ${period === 'day' ? `<input type="date" value="${esc(refDate)}" onchange="CRM.analyticsDate=this.value; CRM.renderAnalyticsView();" class="border border-[#d7e1e0] rounded-lg px-2 py-0.5 text-[11px] font-mono bg-white" />` : ''}
                ${period === 'month' ? `<input type="month" value="${esc(refMonth)}" onchange="CRM.analyticsDate=this.value+'-01'; CRM.renderAnalyticsView();" class="border border-[#d7e1e0] rounded-lg px-2 py-0.5 text-[11px] font-mono bg-white" />` : ''}
                ${period === 'year' ? `
                  <select onchange="CRM.analyticsDate=this.value+'-01-01'; CRM.renderAnalyticsView();" class="border border-[#d7e1e0] rounded-lg px-2 py-0.5 text-[11px] font-mono bg-white">
                    ${[2025, 2026, 2027].map(y => `<option value="${y}" ${refYear === String(y) ? 'selected' : ''}>Año ${y}</option>`).join('')}
                  </select>
                ` : ''}
              </div>
            </div>

            <!-- KPIs Segmentados por Movimiento -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
              <div class="p-3 rounded-2xl bg-[#073e3b] text-white">
                <div class="text-[10px] uppercase font-bold text-teal-200">🆕 Ventas Nuevas Planes</div>
                <div class="text-lg font-black font-mono text-[#70d2bd] mt-0.5">$${kpiNuevas.total.toFixed(2)}</div>
                <div class="text-[10px] text-teal-100">${kpiNuevas.count} cliente(s) nuevo(s)</div>
              </div>
              <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5]">
                <div class="text-[10px] uppercase font-bold text-[#087e70]">⬆️ Upgrades de Planes</div>
                <div class="text-lg font-black font-mono text-[#073e3b] mt-0.5">$${kpiUpgrades.total.toFixed(2)}</div>
                <div class="text-[10px] text-slate-500">${kpiUpgrades.count} ascenso(s) de plan</div>
              </div>
              <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5]">
                <div class="text-[10px] uppercase font-bold text-indigo-800">🤖+ Módulos Adicionales IA</div>
                <div class="text-lg font-black font-mono text-[#073e3b] mt-0.5">$${(kpiModulosIa.total + kpiPersonalizado.total).toFixed(2)}</div>
                <div class="text-[10px] text-slate-500">${kpiModulosIa.count} IA · ${kpiPersonalizado.count} a medida</div>
              </div>
              <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5]">
                <div class="text-[10px] uppercase font-bold text-teal-800">👥+ Usuarios Adicionales</div>
                <div class="text-lg font-black font-mono text-[#073e3b] mt-0.5">$${kpiUsersExtra.total.toFixed(2)}</div>
                <div class="text-[10px] text-slate-500">${kpiUsersExtra.count} ampliación(es) cupo</div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <div class="p-3 rounded-2xl bg-orange-50 border border-orange-200">
                <div class="text-[10px] uppercase font-bold text-orange-900">⬇️ Downgrades de Planes</div>
                <div class="text-base font-black font-mono text-orange-800 mt-0.5">${kpiDowngrades.count} caso(s) · $${kpiDowngrades.total.toFixed(2)}</div>
              </div>
              <div class="p-3 rounded-2xl bg-rose-50 border border-rose-200">
                <div class="text-[10px] uppercase font-bold text-rose-900">📉 Bajas Usuarios / Módulos</div>
                <div class="text-base font-black font-mono text-rose-800 mt-0.5">${kpiBajaUsers.count} baja usu. · ${kpiBajaMods.count} baja mód.</div>
              </div>
              <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200">
                <div class="text-[10px] uppercase font-bold text-emerald-900">💳 Recaudo Cobranzas</div>
                <div class="text-base font-black font-mono text-emerald-800 mt-0.5">$${totalRecaudoCobranzas.toFixed(2)} (${approvedPays.length} pagos)</div>
              </div>
            </div>

            <!-- Rankings: Top Vendedores y Top Cobranzas -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="p-3.5 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5] space-y-2">
                <div class="font-extrabold text-[#073e3b]">🥇 Top Vendedores / Retención</div>
                ${topSellers.length === 0 ? '<p class="text-[11px] text-slate-500">Sin activaciones aprobadas en este período.</p>' : topSellers.map((s, i) => `
                  <div class="p-2 rounded-xl bg-white border border-slate-200 flex items-center justify-between">
                    <span><strong>#${i + 1} ${esc(s.name)}</strong> <span class="text-[10px] text-slate-500">(${s.count} op.)</span></span>
                    <strong class="font-mono text-[#087e70]">$${s.total.toFixed(2)}</strong>
                  </div>
                `).join('')}
              </div>

              <div class="p-3.5 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5] space-y-2">
                <div class="font-extrabold text-[#073e3b]">🥇 Top Gestores de Cobranzas</div>
                ${topCollectors.length === 0 ? '<p class="text-[11px] text-slate-500">Sin pagos conciliados en este período.</p>' : topCollectors.map((c, i) => `
                  <div class="p-2 rounded-xl bg-white border border-slate-200 flex items-center justify-between">
                    <span><strong>#${i + 1} ${esc(c.name)}</strong> <span class="text-[10px] text-slate-500">(${c.count} cobros)</span></span>
                    <strong class="font-mono text-[#087e70]">$${c.total.toFixed(2)}</strong>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Bloque de Calidad del Equipo (Datos Ficticios Provisionales hasta definir rúbrica con Auditor) -->
            <div class="p-4 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="font-extrabold text-indigo-950 text-xs">⭐ Indicadores de Calidad del Equipo (Vista Preliminar)</div>
                  <div class="text-[10.5px] text-indigo-800">Datos referenciales provisionales listos para conectar con la rúbrica de Auditoría.</div>
                </div>
                <span class="px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-900 font-extrabold text-[10px]">Escala 0 – 100 pts</span>
              </div>

              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="p-2.5 rounded-xl bg-white border border-indigo-200">
                  <div class="text-[10px] text-slate-500 font-bold">Calidad General Equipo</div>
                  <div class="text-lg font-black font-mono text-indigo-900">${avgGeneral}%</div>
                </div>
                <div class="p-2.5 rounded-xl bg-white border border-indigo-200">
                  <div class="text-[10px] text-slate-500 font-bold">Nota Calidad Ventas</div>
                  <div class="text-lg font-black font-mono text-[#087e70]">${avgVentasQ}%</div>
                </div>
                <div class="p-2.5 rounded-xl bg-white border border-indigo-200">
                  <div class="text-[10px] text-slate-500 font-bold">Nota Calidad Cobranzas</div>
                  <div class="text-lg font-black font-mono text-[#073e3b]">${avgCobranzasQ}%</div>
                </div>
              </div>

              <div class="space-y-1.5">
                ${demoQualityRows.map(q => `
                  <div class="p-2.5 rounded-xl bg-white border border-indigo-100 flex items-center justify-between gap-2 text-[11px]">
                    <div>
                      <strong class="text-[#073e3b]">${esc(q.name)}</strong>
                      <span class="ml-1.5 px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[9.5px] font-bold">${esc(q.area)}</span>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="text-[10px] text-slate-500">${q.cases} casos rev.</span>
                      <span class="px-2.5 py-0.5 rounded-full font-mono font-extrabold ${q.score >= 92 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">${q.score} / 100</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      },

      exportRepoCsv() {
        const rows = this.getFilteredRepoRows();
        if (!rows.length) return toast('No hay filas filtradas para exportar.');
        const cols = Object.keys(rows[0]);
        const csv = [
          cols.join(';'),
          ...rows.map(r => cols.map(c => `"${String(typeof r[c] === 'object' ? JSON.stringify(r[c]) : (r[c] ?? '')).replace(/"/g, '""')}"`).join(';'))
        ].join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${this.repoTable}_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
        toast(`📥 Excel/CSV descargado (${rows.length} registros).`);
      }
    };



    window.CrmAuth = {
      async login() {
        const email = $('crm-email').value;
        const pass = $('crm-pass').value;
        const err = $('crm-login-err');
        const btn = $('btn-crm-login');
        err.classList.add('hidden');
        btn.textContent = 'Verificando credenciales...';
        btn.disabled = true;
        try {
          const res = await loginVozkora(email, pass);
          if (!res.ok) {
            err.textContent = res.error;
            err.classList.remove('hidden');
            return;
          }
          const cleanRol = String((res.user && res.user.rol) || '').trim().toUpperCase();
          if (!CRM.isInternalRole(cleanRol)) {
            cerrarSesionVozkora();
            err.textContent = `⛔ Acceso denegado: Tu rol (${cleanRol || 'SIN_ROL'}) no tiene permisos para ingresar a Control CRM.`;
            err.classList.remove('hidden');
            return;
          }
          $('crm-login-screen').classList.add('hidden');
          CRM.open();
        } catch (e) {
          err.textContent = 'Error de conexión: ' + e.message;
          err.classList.remove('hidden');
        } finally {
          btn.textContent = 'Ingresar a Consola Maestra →';
          btn.disabled = false;
        }
      },
      logout() {
        cerrarSesionVozkora();
        $('crm-overlay').classList.add('hidden');
        $('crm-login-screen').classList.remove('hidden');
      }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const ses = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
      if (ses && CRM.isInternalRole(ses.rol)) {
        $('crm-login-screen').classList.add('hidden');
        CRM.open();
      }
    });
  </script>
</body>
</html>
