<body class="min-h-screen flex flex-col">

  <!-- PANTALLA DE ACCESO EXCLUSIVO SUPERADMIN CRM -->

      <div id="crm-login-err" class="hidden p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 font-bold text-[11px]"></div>
      <button id="btn-crm-login" onclick="CrmAuth.login()" class="w-full py-3 rounded-xl font-extrabold bg-[#087e70] hover:bg-[#073e3b] text-white shadow cursor-pointer">
        Ingresar a Consola Maestra →

  <!-- CONSOLA MAESTRA VOZKORA CONTROL CRM -->

        <button onclick="CRM.setTab(CRM.currentTab); toast('🔄 Datos actualizados desde Supabase.');" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-[#e7f5f1] text-[#087e70] border border-[#b9d1cd] cursor-pointer">

      <button id="crm-tab-repo" onclick="CRM.setTab('repo')" class="px-3 py-1.5 rounded-xl bg-white/10 text-teal-100 cursor-pointer shrink-0">📊 Hojas Auditoría (Excel)</button>

    <main id="crm-body" class="flex-1 p-4 max-w-7xl w-full mx-auto space-y-4 text-xs">
      Cargando consola maestra...
    </main>

  <!-- MODAL GLOBAL CRM -->
  <div id="phone-modal" class="hidden fixed inset-0 z-[90] bg-slate-950/65 backdrop-blur-[2px] p-4 items-center justify-center">
    <div class="bg-white w-full max-w-[500px] max-h-[90vh] overflow-y-auto rounded-3xl p-5 border border-[#dce6e5] shadow-2xl space-y-3 text-[#17343a]">

        <h4 id="phone-modal-title" class="text-sm font-extrabold text-[#073e3b]">Título</h4>
        <button onclick="V.closeModal()" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs flex items-center justify-center cursor-pointer">✕</button>
      </div>
      <div id="phone-modal-body" class="text-xs space-y-2.5"></div>
      <div id="phone-modal-actions" class="flex justify-end gap-2 pt-2 border-t border-slate-100"></div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] hidden bg-[#073e3b] text-white border border-[#70d2bd]/40 px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold max-w-[92vw] text-center"></div>

  <script src="api.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let toastTimer = null;
    function toast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }
    function nowFormatted() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    window.V = {
      openModal(title, bodyHtml, actionsHtml) {
        $('phone-modal-title').textContent = title;
        $('phone-modal-body').innerHTML = bodyHtml;
        $('phone-modal-actions').innerHTML = actionsHtml;
        const m = $('phone-modal');
        m.classList.remove('hidden');
        m.classList.add('flex');
      },
      closeModal() {
        const m = $('phone-modal');
        m.classList.add('hidden');
        m.classList.remove('flex');
      }
    };

    const SVA_PACKS = [
      {

    window.CRM = {
      currentTab: 'tickets',
      cachedStaff: [],
      selected360Ruc: '',
      search360: '',
      ticketAssigneeFilter: 'ALL',
      cachedCompanies: [],
      companySearch: '',
      companyFilterStatus: 'ALL',
      cachedUsers: [],
      userFilterEmpresa: 'ALL',
      userSearch: '',
      cachedTickets: [],
      ticketFilterStatus: 'ABIERTOS',
      repoTable: 'repo_facturas',
      repoRows: [],
      repoFilterEmpresa: 'ALL',
      repoFilterEntorno: 'ALL',
      repoFilterDesde: '',
      repoFilterHasta: '',
      repoSearch: '',

      isInternalRole(rol) {
        return ['SUPERADMIN', 'SOPORTE', 'VENTAS'].includes(String(rol || '').toUpperCase());
      },

      open() {
        const ses = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
        const rolNorm = String((ses && ses.rol) || '').trim().toUpperCase();
        if (!ses || !this.isInternalRole(rolNorm)) {
          $('crm-overlay').classList.add('hidden');
          return toast('⛔ Acceso denegado: Solo personal autorizado (Súper-Admin, Soporte o Ventas) puede ingresar.');
        }
        const isSuper = (rolNorm === 'SUPERADMIN');
        ['companies', 'users', 'staff', 'billing', 'repo'].forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            if (!isSuper) {
              btn.classList.add('hidden');
              btn.style.display = 'none';
            } else {
              btn.classList.remove('hidden');
              btn.style.display = '';
            }
          }
        });
        $('crm-overlay').classList.remove('hidden');
        this.setTab(isSuper ? this.currentTab : 'tickets');
      },

      setTab(tab) {
        const ses = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
        const rolNorm = String((ses && ses.rol) || '').trim().toUpperCase();
        const isSuper = (rolNorm === 'SUPERADMIN');
        ['companies', 'users', 'staff', 'billing', 'repo'].forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            btn.classList.toggle('hidden', !isSuper);
            btn.style.display = isSuper ? '' : 'none';
          }
        });
        if (!isSuper && !['tickets', 'crm360'].includes(tab)) {
          tab = 'tickets';
        }
        this.currentTab = tab;
        ['tickets', 'crm360', 'companies', 'users', 'staff', 'billing', 'repo'].forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            btn.className = (t === tab)
              ? 'px-3 py-1.5 rounded-xl bg-[#70d2bd] text-[#073e3b] cursor-pointer shrink-0'
              : 'px-3 py-1.5 rounded-xl bg-white/10 text-teal-100 cursor-pointer shrink-0';
          }
        });
        if (tab === 'companies') this.loadCompanies();
        else if (tab === 'users') this.loadUsers();
        else if (tab === 'staff') this.loadStaffTab();
        else if (tab === 'billing') this.loadBillingTab();
        else if (tab === 'tickets') this.loadTickets();
        else if (tab === 'crm360') this.loadCrm360View();
        else if (tab === 'repo') this.loadRepo(this.repoTable);
      },

      // -------------------------------------------------------------------
      // PESTAÑA 1: EMPRESAS (REGISTRO PRIVADO DE CLIENTES SAAS VOZKORA)
      // -------------------------------------------------------------------
      async loadCompanies() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Cargando registro privado de empresas...</div>';
        try {
          const [emps, usrs] = await Promise.all([crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.renderCompaniesView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl font-bold">Error cargando empresas: ${esc(e.message)}</div>`;
        }
      },

      renderCompaniesView() {
        const body = $('crm-body');
        const q = (this.companySearch || '').toLowerCase();
        const filtered = this.cachedCompanies.filter(c => {
          if (this.companyFilterStatus === 'ACTIVAS' && !c.activa) return false;
          if (this.companyFilterStatus === 'SUSPENDIDAS' && c.activa) return false;
          if (q && !(
            (c.nombre || '').toLowerCase().includes(q) ||
            (c.ruc || '').toLowerCase().includes(q)
          )) return false;
          return true;
        });

        body.innerHTML = `
          <div class="bg-white rounded-2xl p-4 border border-[#dce6e5] space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 class="text-sm font-extrabold text-[#073e3b]">🏢 Registro Privado de Empresas (${this.cachedCompanies.length})</h3>
                <p class="text-[11px] text-slate-500">Tus clientes SaaS contratados: define su Plan, Cupo máximo de usuarios, Entorno y APIs del Proveedor Software Contable.</p>
              </div>
              <button onclick="CRM.openNewCompanyModal()" class="px-4 py-2.5 rounded-xl text-xs font-extrabold bg-[#087e70] hover:bg-[#073e3b] text-white shadow cursor-pointer">
                + Registrar Nueva Empresa
              </button>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-100">
              <div class="flex gap-1.5">
                <button onclick="CRM.companyFilterStatus='ALL'; CRM.renderCompaniesView();" class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${this.companyFilterStatus === 'ALL' ? 'bg-[#073e3b] text-[#70d2bd]' : 'bg-[#f5f8f8] text-slate-700 border border-[#dce6e5]'}">
                  Todas (${this.cachedCompanies.length})
                </button>
                <button onclick="CRM.companyFilterStatus='ACTIVAS'; CRM.renderCompaniesView();" class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${this.companyFilterStatus === 'ACTIVAS' ? 'bg-[#087e70] text-white' : 'bg-[#f5f8f8] text-slate-700 border border-[#dce6e5]'}">
                  Activas (${this.cachedCompanies.filter(x => x.activa).length})
                </button>
                <button onclick="CRM.companyFilterStatus='SUSPENDIDAS'; CRM.renderCompaniesView();" class="px-2.5 py-1 rounded-lg text-[11px] font-bold cursor-pointer ${this.companyFilterStatus === 'SUSPENDIDAS' ? 'bg-rose-600 text-white' : 'bg-[#f5f8f8] text-slate-700 border border-[#dce6e5]'}">
                  Suspendidas (${this.cachedCompanies.filter(x => !x.activa).length})
                </button>
              </div>
              <input type="text" value="${esc(this.companySearch)}" oninput="CRM.companySearch=this.value; CRM.renderCompaniesView();" placeholder="🔍 Buscar empresa o RUC..." class="w-full sm:w-64 px-3 py-1.5 rounded-xl border border-[#d7e1e0] text-[11px]" />
            </div>

            <div class="space-y-2.5">
              ${filtered.map(emp => {
                const realIdx = this.cachedCompanies.findIndex(x => x.id === emp.id);
                const empUsers = this.cachedUsers.filter(u => (u.empresa_id === emp.id || u.empresa_ruc === emp.ruc) && u.activo);
                const usedCount = empUsers.length;
                const maxCount = Number(emp.max_usuarios) || 1;
                const hasKeys = !!(emp.contifico_api_key && emp.contifico_pos_token);
                return `
                  <div class="p-3.5 rounded-2xl bg-[#f5f8f8] border ${emp.activa ? 'border-[#dce6e5]' : 'border-rose-300 bg-rose-50/50'} space-y-2">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <span class="font-extrabold text-sm text-[#073e3b]">${esc(emp.nombre)}</span>
                        <span class="ml-1.5 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-[#073e3b] text-[#70d2bd]">${esc(emp.entorno)}</span>
                        <span class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold ${usedCount >= maxCount ? 'bg-amber-100 text-amber-900' : 'bg-[#e7f5f1] text-[#087e70]'}">
                          👥 Cupo Usuarios: ${usedCount} / ${maxCount}
                        </span>
                        <span class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${hasKeys ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">
                          ${hasKeys ? '🔑 API Proveedor Software Contable OK' : '⚠️ Falta API Software Contable'}
                        </span>
                      </div>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${emp.activa ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                        ${emp.activa ? '● Activa' : '● Suspendida'}
                      </span>
                    </div>

                    <div class="text-[11px] text-slate-600 font-mono">
                      RUC: <strong>${esc(emp.ruc)}</strong> · Tel: ${esc(emp.telefono || 'N/A')} · Contacto: ${esc(emp.email_contacto || 'N/A')}
                    </div>

                    <div class="text-[10.5px] text-slate-600 flex flex-wrap items-center gap-2">

      async saveNewCompany() {
        const nombre = $('empNewName').value.trim();
        const ruc = $('empNewRuc').value.trim();
        const telefono = $('empNewTel').value.trim();
        const email_contacto = $('empNewEmail').value.trim().toLowerCase();
        const plan_activo = $('empNewPlan').value;
        const max_usuarios = Math.max(1, parseInt($('empNewQuota').value, 10) || 1);
        const entorno = $('empNewEnv').value;
        if (!nombre || !ruc) return toast('Ingresa nombre y RUC de la empresa.');
        try {
          await crmCrearEmpresa({ nombre, ruc, telefono, email_contacto, plan_activo, max_usuarios, entorno, activa: true });
          V.closeModal();
          toast(`✓ Empresa ${nombre} registrada con cupo de ${max_usuarios} usuario(s).`);
          this.loadCompanies();
        } catch (e) {
          toast('Error creando empresa: ' + e.message);
        }

        toast(`✓ Plan actualizado a ${pl ? pl.name : plan_activo} (Cupo base: ${max_usuarios} usuarios).`);

        this.loadCompanies();

          });
          V.closeModal();

          this.loadCompanies();

          toast('Error: ' + e.message);
        }

      async changeCompanyPeriodicity(id, periodicidad) {
        const fecha_proximo_corte = calcularProximoCorte(periodicidad);
        await crmActualizarEmpresa(id, { periodicidad, fecha_proximo_corte });
        toast(`✓ Periodicidad cambiada a ${periodicidad}. Próximo corte: ${fecha_proximo_corte}`);
        this.loadCompanies();
      },

      async toggleCompanySvaPack(empId, packId) {
        const emp = this.cachedCompanies.find(x => x.id === empId);
        if (!emp) return;
        const prev = Array.isArray(emp.packs_ia) ? emp.packs_ia.slice() : [];
        const next = prev.includes(packId) ? prev.filter(x => x !== packId) : [...prev, packId];
        // Actualización optimista inmediata en pantalla
        emp.packs_ia = next;
        emp.sva_elegidos_fijos = next.length > 0;
        this.renderCompaniesView();
        try {
          await crmActualizarEmpresa(empId, { packs_ia: next, sva_elegidos_fijos: next.length > 0 });
          toast('✓ Módulos IA actualizados en vivo para ' + emp.nombre);
        } catch (e) {
          emp.packs_ia = prev;
          this.renderCompaniesView();
          toast('⚠️ Error guardando módulo IA: ' + e.message);
        }

        const empId = $('usrEditCompanyId').value;
        const emp = this.cachedCompanies.find(c => c.id === empId);
        const nombre_completo = $('usrEditFullName').value.trim();
        const email = $('usrEditEmail').value.trim().toLowerCase();
        const clave = $('usrEditPass').value.trim();
        const rol = $('usrEditRol').value;
        const activo = $('usrEditActivo').value === 'true';

        if (!nombre_completo || !email || !clave) {
          return toast('Completa nombre, correo y contraseña.');

        const patch = {
          nombre_completo,
          email,
          clave,
          rol,
          activo
        };
        if (emp) {
          patch.empresa_id = emp.id;
          patch.empresa_nombre = emp.nombre;
          patch.empresa_ruc = emp.ruc;
          patch.entorno = emp.entorno;
          patch.plan_activo = emp.plan_activo;
          patch.packs_ia = emp.packs_ia || [];
        }

        try {
          await crmActualizarUsuario(id, patch);
          V.closeModal();
          toast(`✓ Usuario ${email} actualizado correctamente.`);
          this.loadUsers();
        } catch (e) {
          toast('Error actualizando usuario: ' + e.message);
        }
      },

          this.loadUsers();

          toast('Error eliminando usuario: ' + e.message);
        }

      getQuotaStatusText(empId) {
        const emp = this.cachedCompanies.find(c => c.id === empId);
        if (!emp) return '';
        const used = this.cachedUsers.filter(u => (u.empresa_id === emp.id || u.empresa_ruc === emp.ruc) && u.activo).length;
        if (used >= emp.max_usuarios) {
          return `⚠️ CUPO LLENO (${used}/${emp.max_usuarios}): Amplía el cupo de usuarios de ${emp.nombre} antes de crear otro.`;
        }
        return `✓ Cupo disponible en Plan ${emp.plan_activo.toUpperCase()}: ${used} de ${emp.max_usuarios} usuarios usados.`;

      async saveNewUser() {
        const empId = $('usrNewCompanyId').value;
        const emp = this.cachedCompanies.find(c => c.id === empId);
        const nombre_completo = $('usrNewFullName').value.trim();
        const email = $('usrNewEmail').value.trim().toLowerCase();
        const clave = $('usrNewPass').value.trim();
        const rol = $('usrNewRol').value;

        if (!emp || !nombre_completo || !email || !clave) {
          return toast('Completa empresa, nombre, correo y contraseña.');
        }

        // Cruce estricto contra el cupo contratado en el plan de la empresa
        const activeUsersCount = this.cachedUsers.filter(u => (u.empresa_id === emp.id || u.empresa_ruc === emp.ruc) && u.activo).length;
        if (activeUsersCount >= emp.max_usuarios) {
          return toast(`⛔ Límite alcanzado: ${emp.nombre} tiene ${activeUsersCount}/${emp.max_usuarios} usuarios en su plan ${emp.plan_activo.toUpperCase()}. Amplía el cupo en Empresas.`);
        }

        try {
          await crmCrearUsuario({
            empresa_id: emp.id,
            empresa_nombre: emp.nombre,
            empresa_ruc: emp.ruc,
            empresa_telefono: emp.telefono || '',
            nombre_completo,
            email,
            clave,
            rol,
            entorno: emp.entorno,
            plan_activo: emp.plan_activo,
            packs_ia: emp.packs_ia || ['voz', 'ventas'],
            activo: true
          });
          V.closeModal();
          toast(`✓ Usuario ${email} creado en ${emp.nombre} (${activeUsersCount + 1}/${emp.max_usuarios} cupos).`);
          this.loadUsers();
        } catch (e) {
          toast('Error creando usuario: ' + e.message);
        }

      // -------------------------------------------------------------------
      ticketLabel(st) {
        if (st === 'PENDIENTE') return '🟡 Abierto';
        if (st === 'EN_PROCESO') return '🔵 En Proceso';
        if (st === 'APROBADO') return '🟢 Cerrado (Resuelto)';
        if (st === 'RECHAZADO') return '🔴 Cerrado (Rechazado)';
        return st;
      },

      async loadTickets() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Cargando bandeja de leads y tickets...</div>';
        try {
          const [tks, emps, usrs] = await Promise.all([crmListarTickets(), crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedTickets = tks;
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.cachedStaff = usrs.filter(u => ['SUPERADMIN', 'SOPORTE', 'VENTAS'].includes(String(u.rol || '').toUpperCase()));
          this.renderTicketsView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      async assignTicketStaff(ticketId, staffEmail) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const staffObj = this.cachedStaff.find(s => s.email === staffEmail) || this.cachedUsers.find(u => u.email === staffEmail);
        const staffName = staffObj ? `${staffObj.nombre_completo || staffObj.email} (${staffObj.rol})` : 'Sin asignar';
        try {
          await crmAsignarTicketAColaborador(ticketId, staffEmail, staffName, tk.detalle || {});

                        ${isSuper ? `
                          <select onchange="CRM.assignTicketStaff('${tk.id}', this.value)" class="border border-[#d7e1e0] rounded-lg px-2 py-1 bg-[#f5f8f8] font-bold text-[#073e3b]">
                            <option value="">-- Sin asignar --</option>
                            <optgroup label="👥 Usuarios de ${esc(tk.empresa_nombre)}">
                              ${(this.cachedUsers || []).filter(u => u.empresa_ruc === tk.empresa_ruc && u.activo).map(u => {

                            </optgroup>

                      <button onclick="CRM.openClient360ByRuc('${esc(tk.empresa_ruc)}')" class="px-2.5 py-1 rounded-lg bg-[#e7f5f1] hover:bg-[#087e70] text-[#073e3b] hover:text-white border border-[#b9d1cd] font-extrabold cursor-pointer">

      openTicketTransitionModal(idx, targetEstado) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const fromLabel = this.ticketLabel(tk.estado);
        const toLabel = this.ticketLabel(targetEstado);
        const isUserCreation = tk.tipo_solicitud === 'NUEVO_USUARIO' && targetEstado === 'APROBADO';

        V.openModal(
          `🔄 Cambiar Estado de Ticket`,
          `<div class="space-y-2.5">
             <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">
               <div><strong>Empresa:</strong> ${esc(tk.empresa_nombre)} (RUC: ${esc(tk.empresa_ruc)})</div>
               <div><strong>Cambio de estado:</strong> ${fromLabel} → <strong>${toLabel}</strong></div>
             </div>
             <div>
               <label class="font-bold text-[11px] text-[#073e3b]">Motivo / Observación obligatoria del cambio *</label>
               <textarea id="tkTransitionReason" rows="3" class="w-full border border-[#d7e1e0] rounded-xl p-2.5 mt-1 text-xs focus:outline-none focus:border-[#087e70]" placeholder="Escribe obligatoriamente el porqué del cambio de estado o la solución aplicada..."></textarea>
             </div>
             ${isUserCreation ? `
               <label class="flex items-center gap-2 p-2 rounded-xl bg-[#e7f5f1] border border-[#b9d1cd] text-[11px] font-bold text-[#073e3b] cursor-pointer">
                 <input type="checkbox" id="tkAlsoCreateUser" checked />
                 <span>Abrir formulario para crear el usuario (${esc(tk.detalle?.email_nuevo || '')}) inmediatamente</span>
               </label>
             ` : ''}
           </div>`,
          `<button onclick="V.closeModal()" class="px-3 py-2 rounded-xl text-xs font-bold text-slate-500 cursor-pointer">Cancelar</button>
           <button onclick="CRM.confirmTicketTransition(${idx}, '${targetEstado}')" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-[#087e70] text-white cursor-pointer">Guardar Cambio en Bitácora</button>`
        );
      },

      async confirmTicketTransition(idx, targetEstado) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const motivo = ($('tkTransitionReason')?.value || '').trim();
        if (!motivo) {
          return toast('⚠️ Debes escribir obligatoriamente el motivo del cambio de estado.');
        }

        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };
        const det = Object.assign({}, tk.detalle || {});
        const prevHist = Array.isArray(det.historial) ? det.historial.slice() : [
          {
            fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
            de_estado: 'NUEVO',
            a_estado: '🟡 Abierto',
            motivo: det.descripcion || 'Solicitud inicial del cliente',
            autor: tk.solicitado_por
          }
        ];

        prevHist.push({
          fecha: nowFormatted(),
          de_estado: this.ticketLabel(tk.estado),
          a_estado: this.ticketLabel(targetEstado),
          motivo,
          autor: ses.email
        });
        det.historial = prevHist;

        const alsoCreateUser = !!$('tkAlsoCreateUser')?.checked;

        try {
          const updatedRow = await crmActualizarTicket(tk.id, targetEstado, det);
          if (updatedRow) {
            this.cachedTickets[idx] = updatedRow;
          } else {
            this.cachedTickets[idx].estado = targetEstado;
            this.cachedTickets[idx].detalle = det;
          }
          V.closeModal();
          toast(`✓ Ticket actualizado a ${this.ticketLabel(targetEstado)} y guardado en bitácora.`);
          await this.loadTickets();

          if (alsoCreateUser && tk.tipo_solicitud === 'NUEVO_USUARIO' && targetEstado === 'APROBADO') {
            this.openNewUserForm({
              empresa_ruc: tk.empresa_ruc,
              nombre: det.nombre || '',
              email: det.email_nuevo || ''
            });
          }
        } catch (e) {
          toast('Error actualizando ticket: ' + e.message);
        }
      },

      openTicketCommentModal(idx) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const currLabel = this.ticketLabel(tk.estado);
        V.openModal(
          '💬 Agregar Nota / Comentario en Bitácora',
          `<div class="space-y-2.5">
             <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">
               <div><strong>Empresa:</strong> ${esc(tk.empresa_nombre)} (RUC: ${esc(tk.empresa_ruc)})</div>
               <div><strong>Estado actual (se mantiene sin cambios):</strong> ${currLabel}</div>
             </div>
             <div>
               <label class="font-bold text-[11px] text-[#073e3b]">Comentario / Seguimiento realizado *</label>
               <textarea id="tkOnlyCommentText" rows="3" class="w-full border border-[#d7e1e0] rounded-xl p-2.5 mt-1 text-xs focus:outline-none focus:border-[#087e70]" placeholder="Escribe el avance, llamada o nota de seguimiento sin cambiar el estado del ticket..."></textarea>
             </div>
           </div>`,
          `<button onclick="V.closeModal()" class="px-3 py-2 rounded-xl text-xs font-bold text-slate-500 cursor-pointer">Cancelar</button>
           <button onclick="CRM.submitTicketComment(${idx})" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-[#087e70] text-white cursor-pointer">Guardar en Bitácora</button>`
        );
      },

      async submitTicketComment(idx) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const comentario = ($('tkOnlyCommentText')?.value || '').trim();
        if (!comentario) {
          return toast('⚠️ Escribe un comentario antes de guardar en la bitácora.');
        }

        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };
        const det = Object.assign({}, tk.detalle || {});
        const prevHist = Array.isArray(det.historial) ? det.historial.slice() : [
          {
            fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
            de_estado: 'NUEVO',
            a_estado: '🟡 Abierto',
            motivo: det.descripcion || 'Solicitud inicial del cliente',
            autor: tk.solicitado_por
          }
        ];

        const currLabel = this.ticketLabel(tk.estado);
        prevHist.push({
          fecha: nowFormatted(),
          de_estado: '💬 Nota',
          a_estado: currLabel,
          motivo: comentario,
          autor: ses.email
        });
        det.historial = prevHist;

        try {
          const updatedRow = await crmActualizarTicket(tk.id, tk.estado, det);
          if (updatedRow) {
            this.cachedTickets[idx] = updatedRow;
          } else {
            this.cachedTickets[idx].detalle = det;
          }
          V.closeModal();
          toast('✓ Comentario registrado en la bitácora sin cambiar el estado.');
          await this.loadTickets();
        } catch (e) {
          toast('Error guardando comentario: ' + e.message);
        }
      },

      openTicketBitacoraModal(idx) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const det = tk.detalle || {};
        const hist = Array.isArray(det.historial) && det.historial.length > 0
          ? det.historial
          : [{
              fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
              de_estado: 'NUEVO',
              a_estado: this.ticketLabel(tk.estado),
              motivo: det.descripcion || 'Solicitud registrada por el cliente',
              autor: tk.solicitado_por
            }];

        const clientMsg = tk.tipo_solicitud === 'NUEVO_USUARIO'
          ? `Alta de usuario: ${det.nombre || ''} (${det.email_nuevo || ''}) · Perfil: ${det.perfil || ''}`
          : (det.descripcion || 'Sin descripción adicional');

          `📜 Bitácora Completa del Ticket`,

             <div class="p-2.5 rounded-xl bg-[#073e3b] text-white text-[11px] space-y-1">
               <div class="flex justify-between items-center">
                 <strong>${esc(tk.empresa_nombre)}</strong>
                 <span class="px-2 py-0.5 rounded-full bg-white/15 text-[#70d2bd] text-[10px] font-bold">${this.ticketLabel(tk.estado)}</span>
               </div>
               <div class="text-teal-100 text-[10.5px]">RUC: ${esc(tk.empresa_ruc)} · Solicitante: ${esc(tk.solicitado_por)}</div>

             <div class="text-[11px] font-extrabold text-[#073e3b]">Historial cronológico de estados y motivos (${hist.length}):</div>
             <div class="space-y-2 max-h-[45vh] overflow-y-auto pr-1">
               ${hist.map((h, i) => `
                 <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">
                   <div class="flex justify-between items-center font-bold text-[#073e3b]">
                     <span>#${i + 1} · ${esc(h.de_estado)} → ${esc(h.a_estado)}</span>
                     <span class="font-mono text-[10px] text-slate-500">${esc(h.fecha)}</span>
                   </div>
                   <div class="text-slate-700"><strong>Motivo:</strong> ${esc(h.motivo)}</div>
                   <div class="text-[10px] text-slate-500">Registrado por: ${esc(h.autor || 'Sistema')}</div>
                 </div>
               `).join('')}
             </div>
           </div>`,
          `<button onclick="V.closeModal(); CRM.openTicketCommentModal(${idx});" class="px-3.5 py-2 rounded-xl text-xs font-extrabold bg-white text-[#073e3b] border border-[#b9d1cd] cursor-pointer">💬 Agregar Comentario</button>

      async loadRepo(tabla) {
        this.repoTable = tabla;
        const body = $('crm-body');

          this.repoRows = await consultarRepositorio(tabla);
          this.renderRepoView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }

      getFilteredRepoRows() {
        const q = (this.repoSearch || '').toLowerCase();
        return this.repoRows.filter(r => {
          if (this.repoFilterEmpresa !== 'ALL' && r.empresa_ruc !== this.repoFilterEmpresa) return false;
          if (this.repoFilterEntorno !== 'ALL' && r.entorno !== this.repoFilterEntorno) return false;
          const rowDate = (r.creado_en || '').slice(0, 10);
          if (this.repoFilterDesde && rowDate && rowDate < this.repoFilterDesde) return false;
          if (this.repoFilterHasta && rowDate && rowDate > this.repoFilterHasta) return false;
          if (q) {
            const hay = Object.values(r).some(v => String(v ?? '').toLowerCase().includes(q));
            if (!hay) return false;
          }
          return true;
        });
      },

                <!-- Histórico de Compras / Facturas y Pagos -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5] space-y-1.5">
                    <div class="font-extrabold text-[#073e3b]">🧾 Últimas Facturas (${hist360.facturas.length})</div>
                    ${hist360.facturas.length === 0 ? '<p class="text-[11px] text-slate-500">Sin facturas registradas.</p>' : hist360.facturas.slice(0, 8).map(f => `
                      <div class="p-2 rounded-lg bg-white border border-slate-200 text-[10.5px] flex justify-between">
                        <span><strong>${esc(f.numero_factura)}</strong> · ${esc(f.cliente_nombre)}</span>
                        <strong class="font-mono text-[#087e70]">$${Number(f.total || 0).toFixed(2)}</strong>
                      </div>
                    `).join('')}
                  </div>

                  <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5] space-y-1.5">
                    <div class="font-extrabold text-[#073e3b]">💰 Pagos, Proformas y Órdenes</div>
                    ${hist360.cobros.slice(0, 4).map(cb => `
                      <div class="p-2 rounded-lg bg-white border border-slate-200 text-[10.5px] flex justify-between">
                        <span>Cobro: ${esc(cb.cliente_nombre)}</span>
                        <strong class="font-mono text-[#073e3b]">+$${Number(cb.monto || 0).toFixed(2)}</strong>
                      </div>
                    `).join('')}
                    ${hist360.proformas.slice(0, 4).map(pr => `
                      <div class="p-2 rounded-lg bg-white border border-slate-200 text-[10.5px] flex justify-between">
                        <span>Proforma: ${esc(pr.numero_proforma)}</span>
                        <strong class="font-mono text-slate-700">$${Number(pr.total || 0).toFixed(2)}</strong>
                      </div>
                    `).join('')}
                    ${(hist360.cobros.length === 0 && hist360.proformas.length === 0) ? '<p class="text-[11px] text-slate-500">Sin pagos o proformas registradas.</p>' : ''}
                  </div>
                </div>
              `)}
            </div>
          </div>
        `;
      },

      exportRepoCsv() {
        const rows = this.getFilteredRepoRows();
        if (!rows.length) return toast('No hay filas filtradas para exportar.');
        const cols = Object.keys(rows[0]);
        const csv = [
          cols.join(';'),
          ...rows.map(r => cols.map(c => `"${String(typeof r[c] === 'object' ? JSON.stringify(r[c]) : (r[c] ?? '')).replace(/"/g, '""')}"`).join(';'))
        ].join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${this.repoTable}_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
        toast(`📥 Excel/CSV descargado (${rows.length} registros).`);
      }
    };



    window.CrmAuth = {
      async login() {
        const email = $('crm-email').value;
        const pass = $('crm-pass').value;
        const err = $('crm-login-err');
        const btn = $('btn-crm-login');
        err.classList.add('hidden');
        btn.textContent = 'Verificando credenciales...';
        btn.disabled = true;
        try {
          const res = await loginVozkora(email, pass);
          if (!res.ok) {
            err.textContent = res.error;
            err.classList.remove('hidden');
            return;
          }
          if (!CRM.isInternalRole(res.user.rol)) {
            cerrarSesionVozkora();
            err.textContent = '⛔ Acceso denegado: Esta consola es exclusiva para Súper-Administradores de Vozkora.';
            err.classList.remove('hidden');
            return;
          }
          $('crm-login-screen').classList.add('hidden');
          CRM.open();
        } catch (e) {
          err.textContent = 'Error de conexión: ' + e.message;
          err.classList.remove('hidden');
        } finally {
          btn.textContent = 'Ingresar a Consola Maestra →';
          btn.disabled = false;
        }
      },
      logout() {
        cerrarSesionVozkora();
        $('crm-overlay').classList.add('hidden');
        $('crm-login-screen').classList.remove('hidden');
      }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const ses = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
      if (ses && CRM.isInternalRole(ses.rol)) {
        $('crm-login-screen').classList.add('hidden');
        CRM.open();
      }
    });
  </script>
</body>
</html>
