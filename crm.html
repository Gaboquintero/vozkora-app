    function formatLocalDateTimeCrm(dateInput = new Date()) {
      const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
      if (isNaN(d.getTime())) return String(dateInput || '');
      try {
        const parts = new Intl.DateTimeFormat('es-EC', {
          timeZone: 'America/Guayaquil',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        }).formatToParts(d);
        const get = t => (parts.find(p => p.type === t) || {}).value || '00';
        const hh = get('hour') === '24' ? '00' : get('hour');
        return `${get('year')}-${get('month')}-${get('day')} ${hh}:${get('minute')}`;
      } catch (e) {
        const utcMs = d.getTime() + (d.getTimezoneOffset() * 60000);
        const loc = new Date(utcMs - (5 * 3600000));
        const pad = n => String(n).padStart(2, '0');
        return `${loc.getFullYear()}-${pad(loc.getMonth() + 1)}-${pad(loc.getDate())} ${pad(loc.getHours())}:${pad(loc.getMinutes())}`;
      }
    }

    function nowFormatted() {
      const iso = formatLocalDateTimeCrm(new Date());
      const [ymd, hm] = iso.split(' ');
      const [y, m, d] = ymd.split('-');
      return `${d}/${m}/${y} ${hm}`;

        allTabs.forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            const ok = allowedTabs.includes(t);
            btn.classList.toggle('hidden', !ok);
            btn.style.display = ok ? '' : 'none';
          }
        });
        if (!allowedTabs.includes(tab)) {
          tab = allowedTabs[0];
        }
        this.currentTab = tab;
        allTabs.forEach(t => {
          const btn = $('crm-tab-' + t);
          if (btn) {
            btn.className = (t === tab)
              ? 'w-full text-left px-3 py-2.5 rounded-xl bg-[#70d2bd] text-[#073e3b] font-extrabold shadow-xs cursor-pointer transition flex items-center gap-2'
              : 'w-full text-left px-3 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-teal-100 cursor-pointer transition flex items-center gap-2';
          }
        });
        if (tab === 'companies') this.loadCompanies();
        else if (tab === 'users') this.loadUsers();
        else if (tab === 'staff') this.loadStaffTab();
        else if (tab === 'billing') this.loadBillingTab();
        else if (tab === 'tickets') this.loadTickets();
        else if (tab === 'crm360') this.loadCrm360View();
        else if (tab === 'activations') this.loadActivationsTab();
        else if (tab === 'invoicing') this.loadInvoicingTab();
        else if (tab === 'analytics') this.loadAnalyticsTab();
        else if (tab === 'repo') this.loadRepo(this.repoTable);
      },
      // -------------------------------------------------------------------
      // PESTAÑA 1: EMPRESAS (REGISTRO PRIVADO DE CLIENTES SAAS VOZKORA)
      // -------------------------------------------------------------------
      async loadCompanies() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Cargando registro privado de empresas...</div>';
        try {
          const [emps, usrs] = await Promise.all([crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.renderCompaniesView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl font-bold">Error cargando empresas: ${esc(e.message)}</div>`;
        }
      },

      getCompanyStatusBadge(emp) {
        if (!emp || emp.activa === false) {
          return {
            cls: 'bg-rose-100 text-rose-800 border-rose-200',
            dot: 'bg-rose-600',
            shortLabel: '🔴 Suspendida',
            fullLabel: '🔴 Suspendida (Acceso Pausado)'
          };
        }
        const sub = typeof evaluarEstadoSuscripcion === 'function'
          ? evaluarEstadoSuscripcion(emp)
          : { estado: 'AL_DIA', diasMora: 0 };
        if (sub.estado === 'BLOQUEADO_CORTE') {
          return {
            cls: 'bg-rose-100 text-rose-800 border-rose-200',
            dot: 'bg-rose-600',
            shortLabel: `🔴 Mora +${sub.diasMora}d`,
            fullLabel: `🔴 Suspendida por Corte (${sub.diasMora} días mora)`
          };
        }
        if (sub.estado === 'PENDIENTE_RENOVACION') {
          return {
            cls: 'bg-amber-100 text-amber-900 border-amber-300',
            dot: 'bg-amber-500',
            shortLabel: `🟡 Gracia (${sub.diasMora}/5d)`,
            fullLabel: `🟡 En Días de Gracia (${sub.diasMora} de 5 días)`
          };
        }
        if (sub.estado === 'EXENTO_HASTA') {
          return {
            cls: 'bg-cyan-100 text-cyan-900 border-cyan-200',
            dot: 'bg-cyan-600',
            shortLabel: '🟢 Activa (Exenta)',
            fullLabel: `🟢 Activa (Exenta hasta ${sub.exentoHasta})`
          };
        }
        return {
          cls: 'bg-emerald-100 text-emerald-800 border-emerald-200',
          dot: 'bg-emerald-600',
          shortLabel: '🟢 Activa',
          fullLabel: '🟢 Activa y Al Día'
        };

      selectCompanyMaster(empId) {
        this.selectedCompanyId = empId;
        this.renderCompaniesView();

            (c.ruc || '').toLowerCase().includes(q)

          return true;

      async saveNewCompany() {
        const nombre = $('empNewName').value.trim();
        const ruc = $('empNewRuc').value.trim();
        const telefono = $('empNewTel').value.trim();
        const email_contacto = $('empNewEmail').value.trim().toLowerCase();
        const plan_activo = $('empNewPlan').value;
        const max_usuarios = Math.max(1, parseInt($('empNewQuota').value, 10) || 1);
        const entorno = $('empNewEnv').value;
        if (!nombre || !ruc) return toast('Ingresa nombre y RUC de la empresa.');
        const allPackIds = ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas'];
        const isEnt = plan_activo === 'enterprise';
        try {
          await crmCrearEmpresa({
            nombre,
            ruc,
            telefono,
            email_contacto,
            plan_activo,
            max_usuarios,
            entorno,
            activa: true,
            packs_ia: isEnt ? allPackIds : [],
            sva_elegidos_fijos: isEnt
          });
          V.closeModal();
          toast(`✓ Empresa ${nombre} registrada con cupo de ${max_usuarios} usuario(s)${isEnt ? ' y Full IA activo' : ''}.`);

        } catch (e) {
          toast('Error creando empresa: ' + e.message);
        }
      },

      async changeCompanyPlan(id, plan_activo) {
        const pl = PLANS.find(x => x.id === plan_activo);
        const max_usuarios = pl ? pl.includedUsers : 5;
        const allPackIds = ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas'];
        const patch = { plan_activo, max_usuarios };
        if (plan_activo === 'enterprise' || (pl && pl.includesComboFull)) {
          patch.packs_ia = allPackIds;
          patch.sva_elegidos_fijos = true;
        } else {
          // Liberar selección para que el cliente elija en la App los módulos gratis de su nuevo plan
          patch.packs_ia = [];
          patch.sva_elegidos_fijos = false;
        }
        await crmActualizarEmpresa(id, patch);
        const svaMsg = plan_activo === 'enterprise'
          ? ' + 6 Módulos IA activados automáticamente'
          : (pl && pl.includedSVACount > 0 ? ` + ${pl.includedSVACount} módulo(s) IA gratis disponibles para elegir en App` : '');

      async toggleCompanySvaPack(empId, packId) {
        const emp = this.cachedCompanies.find(x => x.id === empId);
        if (!emp) return;
        const plObj = PLANS.find(p => p.id === emp.plan_activo) || PLANS[0];
        if (emp.plan_activo === 'enterprise' || plObj.includesComboFull) {
          return toast('⚡ El Plan Enterprise incluye los 6 Módulos IA activos automáticamente.');
        }
        const freeQuota = Number(plObj.includedSVACount) || 0;
        const prev = Array.isArray(emp.packs_ia) ? emp.packs_ia.slice() : [];
        const next = prev.includes(packId) ? prev.filter(x => x !== packId) : [...prev, packId];
        const fixedFlag = freeQuota > 0 ? (next.length >= freeQuota) : (next.length > 0);
        emp.packs_ia = next;
        emp.sva_elegidos_fijos = fixedFlag;
        this.renderCompaniesView();
        try {
          await crmActualizarEmpresa(empId, { packs_ia: next, sva_elegidos_fijos: fixedFlag });
          toast('✓ Módulos IA actualizados en vivo para ' + emp.nombre);
        } catch (e) {
          emp.packs_ia = prev;
          this.renderCompaniesView();
          toast('⚠️ Error guardando módulo IA: ' + e.message);
        }
      },

      ticketLabel(st) {
        if (st === 'PENDIENTE') return '🟡 Abierto';
        if (st === 'EN_PROCESO') return '🔵 En Proceso';
        if (st === 'APROBADO') return '🟢 Cerrado (Resuelto)';
        if (st === 'RECHAZADO') return '🔴 Cerrado (Rechazado)';
        return st;
      },

      async loadTickets() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Cargando bandeja de leads y tickets...</div>';
        try {
          const [tks, emps, usrs] = await Promise.all([crmListarTickets(), crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedTickets = tks;
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.cachedStaff = usrs.filter(u => ['SUPERADMIN', 'SOPORTE', 'VENTAS'].includes(String(u.rol || '').toUpperCase()));
          this.renderTicketsView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      async assignTicketStaff(ticketId, staffEmail) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const staffObj = this.cachedStaff.find(s => s.email === staffEmail);
        const staffName = staffObj ? `${staffObj.nombre_completo || staffObj.email} (${staffObj.rol})` : 'Sin asignar';
        try {
          await crmAsignarTicketAColaborador(ticketId, staffEmail, staffName, tk.detalle || {});
          toast(staffEmail ? `✅ Ticket asignado a ${staffName}` : 'Ticket marcado como Sin asignar');
          await this.loadTickets();
        } catch (e) {
          toast('Error asignando ticket: ' + e.message);
        }
      },

      selectTicketMaster(tkId) {
        this.selectedTicketId = tkId;
        this.renderTicketsView();
      },

      isTicketWhatsappSent(tk) {
        const det = (tk && tk.detalle) || {};
        if (det.whatsapp_enviado === true || String(det.whatsapp_estado || '').toUpperCase() === 'ENVIADO') {
          return true;
        }
        const hist = Array.isArray(det.historial) ? det.historial : [];
        return hist.some(h => /enviado a whatsapp/i.test(String(h.a_estado || '')));
      },

      renderTicketsView() {
        const body = $('crm-body');
        const sesNow = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
        const rolNorm = String((sesNow && sesNow.rol) || '').trim().toUpperCase();
        const isSuper = (rolNorm === 'SUPERADMIN');
        const canSeeAllTickets = ['SUPERADMIN', 'SUPERVISOR', 'AUDITOR'].includes(rolNorm);
        const isReadOnly = this.isReadOnlyRole();
        const myEmail = String((sesNow && sesNow.email) || '').trim().toLowerCase();

        const pureTickets = this.cachedTickets.filter(t => !['ACTIVACION_VENTA', 'FACTURACION_PAGO'].includes(String(t.tipo_solicitud || '').toUpperCase()));

        const baseTickets = canSeeAllTickets
          ? pureTickets
          : pureTickets.filter(t => {
              const assigned = String(t.asignado_a || (t.detalle && t.detalle.asignado_a_email) || '').trim().toLowerCase();
              return assigned !== '' && assigned === myEmail;
            });

        const abiertos = baseTickets.filter(t => t.estado === 'PENDIENTE' || t.estado === 'ABIERTO');
        const enProceso = baseTickets.filter(t => t.estado === 'EN_PROCESO');
        const cerrados = baseTickets.filter(t => t.estado === 'APROBADO' || t.estado === 'RECHAZADO');
        const waNotSentCount = baseTickets.filter(t => !this.isTicketWhatsappSent(t)).length;
        const waSentCount = baseTickets.filter(t => this.isTicketWhatsappSent(t)).length;

        let listToShow = abiertos;
        if (this.ticketFilterStatus === 'EN_PROCESO') listToShow = enProceso;
        else if (this.ticketFilterStatus === 'CERRADOS') listToShow = cerrados;
        else if (this.ticketFilterStatus === 'TODOS') listToShow = baseTickets;

        if (canSeeAllTickets) {
          if (this.ticketAssigneeFilter === 'MINE' && sesNow) {
            listToShow = listToShow.filter(t => (t.asignado_a || (t.detalle && t.detalle.asignado_a_email)) === sesNow.email);
          } else if (this.ticketAssigneeFilter === 'UNASSIGNED') {
            listToShow = listToShow.filter(t => !(t.asignado_a || (t.detalle && t.detalle.asignado_a_email)));
          }
        }

        if (this.ticketWaFilter === 'WA_SENT') {
          listToShow = listToShow.filter(t => this.isTicketWhatsappSent(t));
        } else if (this.ticketWaFilter === 'WA_NOT_SENT') {
          listToShow = listToShow.filter(t => !this.isTicketWhatsappSent(t));
        }

        if (listToShow.length > 0 && (!this.selectedTicketId || !listToShow.some(x => x.id === this.selectedTicketId))) {
          this.selectedTicketId = listToShow[0].id;
        } else if (listToShow.length === 0) {
          this.selectedTicketId = '';
        }

        const selTk = listToShow.find(x => x.id === this.selectedTicketId) || null;

        let ticketDetailHtml = `
          <div class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-400 space-y-2">
            <div class="text-3xl">🎫</div>
            <div class="text-sm font-extrabold text-[#073e3b]">Selecciona un ticket o lead del listado</div>
            <p class="text-[11px] max-w-sm">Haz clic sobre el nombre del cliente a la izquierda para ver el detalle completo, si envió o no mensaje a WhatsApp y el estado de su cuenta.</p>
          </div>
        `;

        if (selTk) {
          const realIdx = this.cachedTickets.findIndex(x => x.id === selTk.id);
          const det = selTk.detalle || {};
          const hist = Array.isArray(det.historial) ? det.historial : [];
          const waSent = this.isTicketWhatsappSent(selTk);
          const localTimeStr = det.fecha_hora_local || (selTk.creado_en ? formatLocalDateTimeCrm(selTk.creado_en) : '');
          const empObj = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(selTk.empresa_ruc || '').trim()) || null;
          const empBadge = empObj
            ? this.getCompanyStatusBadge(empObj)
            : { cls: 'bg-slate-100 text-slate-700 border-slate-200', fullLabel: '⚪ Prospecto / Sin empresa SaaS' };

          const tkBadgeCls = selTk.estado === 'PENDIENTE'
            ? 'bg-amber-100 text-amber-900'
            : (selTk.estado === 'EN_PROCESO'
              ? 'bg-cyan-100 text-cyan-900'
              : (selTk.estado === 'APROBADO' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'));

          const clientFullMsg = selTk.tipo_solicitud === 'NUEVO_USUARIO'
            ? `Solicita crear usuario para <strong>${esc(det.nombre || 'N/A')}</strong> (${esc(det.email_nuevo || 'N/A')}) · Perfil: <strong>${esc(det.perfil || 'N/A')}</strong>${det.descripcion ? ' · Nota: ' + esc(det.descripcion) : ''}`
            : `${esc(det.descripcion || det.motivo || JSON.stringify(det))}`;

          const waDigits = String(det.telefono_contacto || (empObj && empObj.telefono) || '').replace(/\D/g, '');

          ticketDetailHtml = `
            <div class="space-y-3">
              <!-- Encabezado con Estado del Ticket + Estado Cuenta + Estado WhatsApp (Verde/Rojo) -->
              <div class="p-3.5 rounded-2xl bg-gradient-to-r from-[#073e3b] to-[#0a524e] text-white space-y-2">
                <div class="flex flex-wrap items-start justify-between gap-2">
                  <div>
                    <div class="text-[10px] uppercase font-bold text-[#70d2bd]">Cliente / Empresa Solicitante</div>
                    <h4 class="text-base font-black">${esc(selTk.empresa_nombre)}</h4>
                    <div class="text-[11px] font-mono text-teal-100">RUC: <strong>${esc(selTk.empresa_ruc)}</strong> · Solicitante: ${esc(selTk.solicitado_por)}</div>

                    <option value="MINE" ${this.ticketAssigneeFilter === 'MINE' ? 'selected' : ''}>⭐ Míos</option>
                    <option value="UNASSIGNED" ${this.ticketAssigneeFilter === 'UNASSIGNED' ? 'selected' : ''}>⚪ Sin asignar</option>
                  </select>
                ` : `<span class="px-2.5 py-1 rounded-xl bg-[#e7f5f1] text-[#073e3b] text-[10.5px] font-bold">👤 ${esc(sesNow?.nombre_completo || myEmail)}</span>`}

                  const isSel = tk.id === this.selectedTicketId;

                  const localTimeStr = det.fecha_hora_local || (tk.creado_en ? formatLocalDateTimeCrm(tk.creado_en) : '');
                  const empObj = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;

                  const tkDot = tk.estado === 'PENDIENTE' ? '🟡' : (tk.estado === 'EN_PROCESO' ? '🔵' : (tk.estado === 'APROBADO' ? '🟢' : '🔴'));

                  return `
                    <button type="button" onclick="CRM.selectTicketMaster('${tk.id}')" class="w-full text-left p-2.5 rounded-xl border transition cursor-pointer space-y-1 ${isSel ? 'bg-[#073e3b] text-white border-[#073e3b] shadow-sm' : 'bg-white hover:bg-[#e7f5f1]/60 text-[#17343a] border-[#dce6e5]'}">
                      <div class="flex items-center justify-between gap-1.5">
                        <span class="font-extrabold text-xs truncate">${tkDot} ${esc(tk.empresa_nombre)}</span>
                        <span class="px-2 py-0.5 rounded-full text-[9px] font-extrabold border shrink-0 ${isSel ? 'bg-white/15 text-[#70d2bd] border-white/20' : empBadge.cls}">

                        <span class="px-1.5 py-0.5 rounded text-[9px] font-extrabold shrink-0 ${waSent ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-rose-500/20 text-rose-300 border border-rose-400/30'} ${!isSel ? (waSent ? '!bg-emerald-100 !text-emerald-800 !border-emerald-200' : '!bg-rose-100 !text-rose-800 !border-rose-200') : ''}">
                          ${waSent ? '🟢 WA' : '🔴 Sin WA'}

                      </div>

                  `;
                }).join('')}
              </div>

              <!-- PANEL DERECHO: DETALLE DEL TICKET Y CLIENTE CON SCROLL INTERNO -->

      },

      openTicketTransitionModal(idx, targetEstado) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const fromLabel = this.ticketLabel(tk.estado);
        const toLabel = this.ticketLabel(targetEstado);
        const isUserCreation = tk.tipo_solicitud === 'NUEVO_USUARIO' && targetEstado === 'APROBADO';

        V.openModal(
          `🔄 Cambiar Estado de Ticket`,
          `<div class="space-y-2.5">
             <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">
               <div><strong>Empresa:</strong> ${esc(tk.empresa_nombre)} (RUC: ${esc(tk.empresa_ruc)})</div>
               <div><strong>Cambio de estado:</strong> ${fromLabel} → <strong>${toLabel}</strong></div>
             </div>
             <div>
               <label class="font-bold text-[11px] text-[#073e3b]">Motivo / Observación obligatoria del cambio *</label>
               <textarea id="tkTransitionReason" rows="3" class="w-full border border-[#d7e1e0] rounded-xl p-2.5 mt-1 text-xs focus:outline-none focus:border-[#087e70]" placeholder="Escribe obligatoriamente el porqué del cambio de estado o la solución aplicada..."></textarea>
             </div>
             ${isUserCreation ? `
               <label class="flex items-center gap-2 p-2 rounded-xl bg-[#e7f5f1] border border-[#b9d1cd] text-[11px] font-bold text-[#073e3b] cursor-pointer">
                 <input type="checkbox" id="tkAlsoCreateUser" checked />
                 <span>Abrir formulario para crear el usuario (${esc(tk.detalle?.email_nuevo || '')}) inmediatamente</span>
               </label>
             ` : ''}
           </div>`,
          `<button onclick="V.closeModal()" class="px-3 py-2 rounded-xl text-xs font-bold text-slate-500 cursor-pointer">Cancelar</button>
           <button onclick="CRM.confirmTicketTransition(${idx}, '${targetEstado}')" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-[#087e70] text-white cursor-pointer">Guardar Cambio en Bitácora</button>`
        );
      },

      async confirmTicketTransition(idx, targetEstado) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const motivo = ($('tkTransitionReason')?.value || '').trim();
        if (!motivo) {
          return toast('⚠️ Debes escribir obligatoriamente el motivo del cambio de estado.');
        }

        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };
        const det = Object.assign({}, tk.detalle || {});
        const prevHist = Array.isArray(det.historial) ? det.historial.slice() : [
          {
            fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
            de_estado: 'NUEVO',
            a_estado: '🟡 Abierto',
            motivo: det.descripcion || 'Solicitud inicial del cliente',
            autor: tk.solicitado_por
          }
        ];

        prevHist.push({
          fecha: nowFormatted(),
          de_estado: this.ticketLabel(tk.estado),
          a_estado: this.ticketLabel(targetEstado),
          motivo,
          autor: ses.email
        });
        det.historial = prevHist;

        const alsoCreateUser = !!$('tkAlsoCreateUser')?.checked;

        try {
          const updatedRow = await crmActualizarTicket(tk.id, targetEstado, det);
          if (updatedRow) {
            this.cachedTickets[idx] = updatedRow;
          } else {
            this.cachedTickets[idx].estado = targetEstado;
            this.cachedTickets[idx].detalle = det;
          }
          V.closeModal();
          toast(`✓ Ticket actualizado a ${this.ticketLabel(targetEstado)} y guardado en bitácora.`);
          await this.loadTickets();

          if (alsoCreateUser && tk.tipo_solicitud === 'NUEVO_USUARIO' && targetEstado === 'APROBADO') {
            this.openNewUserForm({
              empresa_ruc: tk.empresa_ruc,
              nombre: det.nombre || '',
              email: det.email_nuevo || ''
            });
          }
        } catch (e) {
          toast('Error actualizando ticket: ' + e.message);
        }
      },

      openTicketCommentModal(idx) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const currLabel = this.ticketLabel(tk.estado);
        V.openModal(
          '💬 Agregar Nota / Comentario en Bitácora',
          `<div class="space-y-2.5">
             <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">

             </div>
           </div>`,
          `<button onclick="V.closeModal()" class="px-3 py-2 rounded-xl text-xs font-bold text-slate-500 cursor-pointer">Cancelar</button>

        );
      },

      async submitTicketComment(idx) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const comentario = ($('tkOnlyCommentText')?.value || '').trim();
        if (!comentario) {
          return toast('⚠️ Escribe un comentario antes de guardar en la bitácora.');
        }

        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };
        const det = Object.assign({}, tk.detalle || {});
        const prevHist = Array.isArray(det.historial) ? det.historial.slice() : [
          {
            fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
            de_estado: 'NUEVO',
            a_estado: '🟡 Abierto',
            motivo: det.descripcion || 'Solicitud inicial del cliente',
            autor: tk.solicitado_por
          }
        ];

        const currLabel = this.ticketLabel(tk.estado);
        prevHist.push({
          fecha: nowFormatted(),
          de_estado: '💬 Nota',
          a_estado: currLabel,
          motivo: comentario,
          autor: ses.email
        });
        det.historial = prevHist;

        try {
          const updatedRow = await crmActualizarTicket(tk.id, tk.estado, det);
          if (updatedRow) {
            this.cachedTickets[idx] = updatedRow;
          } else {
            this.cachedTickets[idx].detalle = det;
          }
          V.closeModal();
          toast('✓ Comentario registrado en la bitácora sin cambiar el estado.');
          await this.loadTickets();
        } catch (e) {
          toast('Error guardando comentario: ' + e.message);
        }
      },

      openTicketBitacoraModal(idx) {
        const tk = this.cachedTickets[idx];
        if (!tk) return;
        const det = tk.detalle || {};
        const hist = Array.isArray(det.historial) && det.historial.length > 0
          ? det.historial
          : [{
              fecha: (tk.creado_en || '').slice(0, 16).replace('T', ' ') || nowFormatted(),
              de_estado: 'NUEVO',
              a_estado: this.ticketLabel(tk.estado),
              motivo: det.descripcion || 'Solicitud registrada por el cliente',

          ? `Alta de usuario: ${det.nombre || ''} (${det.email_nuevo || ''}) · Perfil: ${det.perfil || ''}`

        V.openModal(
          `📜 Bitácora Completa del Ticket`,
          `<div class="space-y-2.5">
             <div class="p-2.5 rounded-xl bg-[#073e3b] text-white text-[11px] space-y-1">
               <div class="flex justify-between items-center">
                 <strong>${esc(tk.empresa_nombre)}</strong>
                 <span class="px-2 py-0.5 rounded-full bg-white/15 text-[#70d2bd] text-[10px] font-bold">${this.ticketLabel(tk.estado)}</span>
               </div>
               <div class="text-teal-100 text-[10.5px]">RUC: ${esc(tk.empresa_ruc)} · Solicitante: ${esc(tk.solicitado_por)}</div>

             <div class="text-[11px] font-extrabold text-[#073e3b]">Historial cronológico de estados y motivos (${hist.length}):</div>
             <div class="space-y-2 max-h-[45vh] overflow-y-auto pr-1">
               ${hist.map((h, i) => `
                 <div class="p-2.5 rounded-xl bg-[#f5f8f8] border border-[#dce6e5] text-[11px] space-y-1">
                   <div class="flex justify-between items-center font-bold text-[#073e3b]">
                     <span>#${i + 1} · ${esc(h.de_estado)} → ${esc(h.a_estado)}</span>
                     <span class="font-mono text-[10px] text-slate-500">${esc(h.fecha)}</span>
                   </div>
                   <div class="text-slate-700"><strong>Motivo:</strong> ${esc(h.motivo)}</div>
                   <div class="text-[10px] text-slate-500">Registrado por: ${esc(h.autor || 'Sistema')}</div>
                 </div>
               `).join('')}

      async loadRepo(tabla) {
        this.repoTable = tabla;

        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Consultando hoja de auditoría en Supabase...</div>';
        try {
          this.repoRows = await consultarRepositorio(tabla);
          this.renderRepoView();

          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      getFilteredRepoRows() {
        const q = (this.repoSearch || '').toLowerCase();
        return this.repoRows.filter(r => {
          if (this.repoFilterEmpresa !== 'ALL' && r.empresa_ruc !== this.repoFilterEmpresa) return false;
          if (this.repoFilterEntorno !== 'ALL' && r.entorno !== this.repoFilterEntorno) return false;
          const rowDate = (r.creado_en || '').slice(0, 10);
          if (this.repoFilterDesde && rowDate && rowDate < this.repoFilterDesde) return false;
          if (this.repoFilterHasta && rowDate && rowDate > this.repoFilterHasta) return false;
          if (q) {
            const hay = Object.values(r).some(v => String(v ?? '').toLowerCase().includes(q));
            if (!hay) return false;
          }
          return true;
        });
      },

      evaluateSaleBusinessRules(params) {
        const errors = [];
        const warnings = [];
        const {
          tipoOperacion, existingEmp, planNuevoId, usuariosNuevo, modulosFinales, activeUsersInDb
        } = params;

        const targetPlan = PLANS.find(p => p.id === planNuevoId) || PLANS[0];
        const currentPlan = existingEmp ? (PLANS.find(p => p.id === existingEmp.plan_activo) || PLANS[0]) : null;

        if (!existingEmp && tipoOperacion !== 'VENTA_NUEVA_PLAN') {
          errors.push('Este RUC aún no está registrado como empresa SaaS. Debes elegir "Venta Nueva de Plan".');
        }
        if (existingEmp && tipoOperacion === 'VENTA_NUEVA_PLAN') {
          errors.push(`La empresa ${existingEmp.nombre} ya existe en el sistema (Plan ${currentPlan.name}). Usa Upgrade, Downgrade o Venta Adicional.`);
        }

        if (currentPlan) {
          if (tipoOperacion === 'UPGRADE_PLAN' && targetPlan.rank <= currentPlan.rank) {
            errors.push(`No es un Upgrade válido: el plan destino (${targetPlan.name}) es igual o inferior al plan actual (${currentPlan.name}).`);
          }
          if (tipoOperacion === 'DOWNGRADE_PLAN' && targetPlan.rank >= currentPlan.rank) {
            errors.push(`No es un Downgrade válido: el plan destino (${targetPlan.name}) debe ser menor al plan actual (${currentPlan.name}).`);
          }
        }

        if (targetPlan.id === 'piloto' && usuariosNuevo > 1) {
          errors.push(`El Plan Piloto admite máximo 1 usuario y no permite usuarios adicionales (intentas asignar ${usuariosNuevo}).`);
        }
        if (usuariosNuevo < targetPlan.includedUsers) {
          errors.push(`El Plan ${targetPlan.name} incluye ${targetPlan.includedUsers} usuarios base; el cupo total no puede ser menor a ${targetPlan.includedUsers}.`);
        }
        if (activeUsersInDb > usuariosNuevo) {
          errors.push(`La empresa tiene ${activeUsersInDb} usuarios activos en la App; no puedes bajar el cupo a ${usuariosNuevo} sin desactivar primero ${activeUsersInDb - usuariosNuevo} usuario(s).`);
        }

        if (targetPlan.id === 'enterprise' && modulosFinales.length < 6) {
          warnings.push('El Plan Enterprise incluye automáticamente los 6 Módulos IA sin costo adicional.');
        }
        if (tipoOperacion === 'BAJA_MODULO_IA' && existingEmp) {
          const prevPacks = Array.isArray(existingEmp.packs_ia) ? existingEmp.packs_ia : [];
          if (prevPacks.length <= modulosFinales.length) {
            errors.push('Para una "Baja de Módulos IA" debes desmarcar al menos un módulo que actualmente tenga activo el cliente.');
          }
        }
        if (tipoOperacion === 'BAJA_USUARIOS_EXTRA' && existingEmp) {
          if (usuariosNuevo >= (Number(existingEmp.max_usuarios) || 1)) {
            errors.push(`Para una "Baja de Usuarios Adicionales" el nuevo cupo debe ser menor al cupo actual (${existingEmp.max_usuarios}).`);
          }
        }

        return { ok: errors.length === 0, errors, warnings, targetPlan, currentPlan };
      },

      autofillSaleModalByRuc(rucVal) {
        const clean = String(rucVal || '').trim();
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === clean);
        if (!emp) {
          this.recheckSaleFormLive();
          return;
        }
        if ($('saleFormNombre')) $('saleFormNombre').value = emp.nombre || '';
        if ($('saleFormTel')) $('saleFormTel').value = emp.telefono || '';
        if ($('saleFormEmail')) $('saleFormEmail').value = emp.email_contacto || '';
        if ($('saleFormPlan')) $('saleFormPlan').value = emp.plan_activo || 'expansion';
        if ($('saleFormUsers')) $('saleFormUsers').value = Number(emp.max_usuarios) || 5;
        if ($('saleFormPeriod')) $('saleFormPeriod').value = emp.periodicidad || 'MENSUAL';
        if ($('saleFormTipoOp') && $('saleFormTipoOp').value === 'VENTA_NUEVA_PLAN') {
          $('saleFormTipoOp').value = 'UPGRADE_PLAN';
        }
        const packs = Array.isArray(emp.packs_ia) ? emp.packs_ia : [];
        document.querySelectorAll('.sale-mod-chk').forEach(chk => {
          chk.checked = packs.includes(chk.value);
        });
        toast(`✓ Empresa existente detectada: ${emp.nombre}`);
        this.recheckSaleFormLive();
      },

      recheckSaleFormLive() {
        const ruc = ($('saleFormRuc')?.value || '').trim();
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === ruc) || null;
        const tipoOperacion = $('saleFormTipoOp')?.value || 'VENTA_NUEVA_PLAN';
        const planNuevoId = $('saleFormPlan')?.value || 'expansion';
        const usuariosNuevo = parseInt($('saleFormUsers')?.value, 10) || 1;
        const modulosFinales = Array.from(document.querySelectorAll('.sale-mod-chk:checked')).map(x => x.value);
        const activeUsersInDb = emp
          ? this.cachedUsers.filter(u => (u.empresa_id === emp.id || u.empresa_ruc === emp.ruc) && u.activo).length
          : 0;

        const check = this.evaluateSaleBusinessRules({
          tipoOperacion, existingEmp: emp, planNuevoId, usuariosNuevo, modulosFinales, activeUsersInDb
        });

        const box = $('saleFormValidationBox');
        if (!box) return check;
        if (!check.ok) {
          box.innerHTML = check.errors.map(err => `
            <div class="p-2 rounded-xl bg-rose-100 border border-rose-300 text-rose-900 font-bold text-[10.5px]">⛔ ${esc(err)}</div>
          `).join('');
        } else if (check.warnings.length > 0) {
          box.innerHTML = check.warnings.map(w => `
            <div class="p-2 rounded-xl bg-amber-100 border border-amber-300 text-amber-950 font-bold text-[10.5px]">⚠️ ${esc(w)}</div>
          `).join('');
        } else {
          box.innerHTML = `<div class="p-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-[10.5px]">✓ Validación de reglas comerciales y cupos correcta (${check.targetPlan.name} · ${usuariosNuevo} usu.).</div>`;
        }
        return check;
      },

      async submitSaleEntry() {
        const ruc = ($('saleFormRuc')?.value || '').trim();
        const nombre = ($('saleFormNombre')?.value || '').trim();
        const tel = ($('saleFormTel')?.value || '').trim();
        const email = ($('saleFormEmail')?.value || '').trim();
        const tipoOperacion = $('saleFormTipoOp')?.value || 'VENTA_NUEVA_PLAN';
        const planNuevoId = $('saleFormPlan')?.value || 'expansion';
        const usuariosNuevo = parseInt($('saleFormUsers')?.value, 10) || 1;
        const periodicidad = $('saleFormPeriod')?.value || 'MENSUAL';
        const modulosFinales = Array.from(document.querySelectorAll('.sale-mod-chk:checked')).map(x => x.value);
        const customDesc = ($('saleFormCustomDesc')?.value || '').trim();
        const montoUsd = parseFloat($('saleFormAmount')?.value);
        const refPago = ($('saleFormRef')?.value || '').trim();
        const formulaCobro = ($('saleFormFormula')?.value || '').trim();
        const fileObj = $('saleFormFile')?.files?.[0] || null;

        if (!ruc || !nombre) return toast('Ingresa RUC y Razón Social de la empresa.');
        if (isNaN(montoUsd) || montoUsd < 0) return toast('Ingresa el valor cobrado en USD.');
        if (!formulaCobro) return toast('⚠️ Debes escribir obligatoriamente la fórmula de cálculo / prorrateo utilizada.');
        if (!fileObj && tipoOperacion !== 'DOWNGRADE_PLAN' && tipoOperacion !== 'BAJA_USUARIOS_EXTRA' && tipoOperacion !== 'BAJA_MODULO_IA') {
          return toast('⚠️ Debes adjuntar obligatoriamente el comprobante de pago (imagen o PDF).');
        }

        const check = this.recheckSaleFormLive();
        if (!check.ok) {
          return toast('⛔ Corrige los errores de validación marcados en rojo antes de guardar.');
        }

        const btn = $('btnSubmitSaleEntry');
        if (btn) { btn.textContent = 'Subiendo comprobante...'; btn.disabled = true; }

        try {
          let compUrl = '';
          if (fileObj && typeof subirComprobanteOperacionSupabase === 'function') {
            const up = await subirComprobanteOperacionSupabase(fileObj, 'activaciones', ruc);
            if (up && up.url) compUrl = up.url;
          }

          const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || {};
          const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === ruc) || null;
          const prevUsers = emp ? (Number(emp.max_usuarios) || 1) : 0;
          const opMeta = SALE_OPERATION_TYPES[tipoOperacion] || { label: tipoOperacion };
          const fechaLocal = nowFormatted();

          await crearTicketVozkora({
            empresa_ruc: ruc,
            empresa_nombre: nombre,
            solicitado_por: ses.email || 'ventas@vozkora.com',
            tipo_solicitud: 'ACTIVACION_VENTA',
            estado: 'PENDIENTE',
            detalle: {
              categoria: opMeta.label,
              tipo_operacion: tipoOperacion,
              plan_anterior: emp ? emp.plan_activo : 'NINGUNO',
              plan_anterior_label: emp ? emp.plan_activo.toUpperCase() : 'Cliente Nuevo',
              plan_nuevo: planNuevoId,
              usuarios_anterior: prevUsers,
              usuarios_nuevo: usuariosNuevo,
              usuarios_delta: usuariosNuevo - prevUsers,
              periodicidad,
              modulos_finales: planNuevoId === 'enterprise' ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas'] : modulosFinales,
              descripcion_personalizada: customDesc,
              monto_usd: montoUsd,
              referencia_pago: refPago || 'N/A',
              formula_cobro: formulaCobro,
              comprobante_url: compUrl,
              telefono_contacto: tel,
              email_contacto: email,
              agente_email: ses.email || '',
              agente_nombre: ses.nombre_completo || ses.email || 'Asesor',
              agente_rol: ses.rol || 'VENTAS',
              fecha_hora_local: fechaLocal,
              fecha_iso_local: typeof obtenerFechaLocalISO === 'function' ? obtenerFechaLocalISO(0) : new Date().toISOString().slice(0, 10),
              historial: [
                {
                  fecha: fechaLocal,
                  de_estado: 'NUEVO',
                  a_estado: '🟡 Pendiente de Activación',
                  motivo: `${opMeta.label} por $${montoUsd.toFixed(2)} — Fórmula: ${formulaCobro}`,
                  autor: ses.email || 'Asesor'
                }
              ]
            }
          });

          V.closeModal();
          toast('🚀 Venta enviada a Activaciones Pendientes para validación.');
          if (this.currentTab === 'activations') await this.loadActivationsTab();
        } catch (e) {
          toast('Error registrando venta: ' + e.message);
        } finally {
          if (btn) { btn.textContent = '🚀 Enviar a Activaciones Pendientes'; btn.disabled = false; }
        }
      },

                 <li>• <strong>Cobro Validado:</strong> <strong class="text-[#70d2bd] font-mono">$${Number(det.monto_usd || 0).toFixed(2)} USD</strong></li>

             ${!check.ok ? `

               <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 font-bold">
                 ✓ Validación superada: No hay conflictos de cupo ni jerarquía de planes.

           ${check.ok ? `<button onclick="CRM.executeSmartActivation('${tk.id}')" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-[#087e70] text-white shadow cursor-pointer">✅ Confirmar y Activar Ahora</button>` : ''}`
        );
      },

      async executeSmartActivation(ticketId) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const det = Object.assign({}, tk.detalle || {});
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;
        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };

        const planId = det.plan_nuevo || 'expansion';
        const maxUsuarios = Math.max(1, Number(det.usuarios_nuevo) || 1);
        const periodicidad = det.periodicidad || 'MENSUAL';
        const packsIa = planId === 'enterprise'
          ? ['voz', 'cobranza', 'ventas', 'gerencia', 'operaciones', 'finanzas']
          : (Array.isArray(det.modulos_finales) ? det.modulos_finales : []);

        try {
          if (emp) {
            const patch = {
              plan_activo: planId,
              max_usuarios: maxUsuarios,
              periodicidad,
              packs_ia: packsIa,
              activa: true
            };
            if (det.tipo_operacion === 'UPGRADE_PLAN' || det.tipo_operacion === 'VENTA_NUEVA_PLAN') {
              patch.fecha_proximo_corte = calcularProximoCorte(periodicidad);
            }
            await crmActualizarEmpresa(emp.id, patch);
          } else {
            await crmCrearEmpresa({
              nombre: tk.empresa_nombre,
              ruc: tk.empresa_ruc,
              telefono: det.telefono_contacto || '',
              email_contacto: det.email_contacto || tk.solicitado_por,
              plan_activo: planId,
              max_usuarios: maxUsuarios,
              periodicidad,
              entorno: 'PRODUCCION',
              activa: true,
              packs_ia: packsIa,
              sva_elegidos_fijos: planId === 'enterprise'
            });
          }

          const hist = Array.isArray(det.historial) ? det.historial.slice() : [];
          hist.push({
            fecha: nowFormatted(),
            de_estado: '🟡 Pendiente de Activación',
            a_estado: '🟢 Activada en SaaS',
            motivo: `Activación aprobada y aplicada automáticamente (Plan ${planId.toUpperCase()} · ${maxUsuarios} usu.).`,
            autor: ses.email
          });
          det.historial = hist;
          det.activado_en = nowFormatted();
          det.activado_por = ses.email;

          await crmActualizarTicket(tk.id, 'APROBADO', det);
          V.closeModal();
          toast(`✅ Activación aplicada automáticamente a ${tk.empresa_nombre}.`);
          await this.loadActivationsTab();
        } catch (e) {
          toast('Error aplicando activación: ' + e.message);
        }
      },

      async rejectActivationRequest(ticketId) {
        const motivo = prompt('Escribe el motivo del rechazo de esta venta/activación:');
        if (!motivo || !motivo.trim()) return toast('Debes indicar el motivo del rechazo.');
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };
        const det = Object.assign({}, tk.detalle || {});
        const hist = Array.isArray(det.historial) ? det.historial.slice() : [];
        hist.push({
          fecha: nowFormatted(),
          de_estado: '🟡 Pendiente',
          a_estado: '🔴 Rechazada',
          motivo: motivo.trim(),
          autor: ses.email
        });
        det.historial = hist;
        await crmActualizarTicket(tk.id, 'RECHAZADO', det);
        toast('Solicitud rechazada y registrada en bitácora.');
        await this.loadActivationsTab();
      },

      async loadInvoicingTab() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Cargando bandeja de Facturación Pendientes...</div>';
        try {
          const [tks, emps] = await Promise.all([crmListarTickets(), crmListarEmpresas()]);
          this.cachedTickets = tks;
          this.cachedCompanies = emps;
          this.renderInvoicingView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      renderInvoicingView() {
        const body = $('crm-body');
        const rolNorm = this.getSessionRole();
        const isSuper = (rolNorm === 'SUPERADMIN');
        const sesNow = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
        const myEmail = String((sesNow && sesNow.email) || '').trim().toLowerCase();

        const allPays = this.cachedTickets.filter(t => String(t.tipo_solicitud || '').toUpperCase() === 'FACTURACION_PAGO');
        const visiblePays = (['SUPERADMIN', 'SUPERVISOR', 'AUDITOR'].includes(rolNorm))
          ? allPays
          : allPays.filter(t => String(t.solicitado_por || '').trim().toLowerCase() === myEmail);

        const pend = visiblePays.filter(t => t.estado === 'PENDIENTE');
        const fact = visiblePays.filter(t => t.estado === 'APROBADO');

        let list = pend;
        if (this.invoicingFilter === 'FACTURADAS') list = fact;
        else if (this.invoicingFilter === 'TODAS') list = visiblePays;

        if (list.length > 0 && (!this.selectedInvoicingId || !list.some(x => x.id === this.selectedInvoicingId))) {
          this.selectedInvoicingId = list[0].id;
        } else if (list.length === 0) {
          this.selectedInvoicingId = '';
        }

        const selPay = list.find(x => x.id === this.selectedInvoicingId) || null;
        let detailHtml = `
          <div class="h-full flex flex-col items-center justify-center text-center py-16 text-slate-400 space-y-2">
            <div class="text-3xl">🧾</div>
            <div class="text-sm font-extrabold text-[#073e3b]">Selecciona un reporte de pago / facturación</div>
            <p class="text-[11px] max-w-sm">Revisa el comprobante bancario reportado por Cobranzas, valida la fórmula y renueva el ciclo SaaS en 1 clic.</p>
          </div>
        `;

      async submitPaymentEntry() {
        const ruc = ($('payFormRuc')?.value || '').trim();
        const nombre = ($('payFormNombre')?.value || '').trim();
        const concepto = $('payFormConcept')?.value || 'Renovación Mensual';
        const banco = $('payFormBank')?.value || 'Transferencia';
        const montoUsd = parseFloat($('payFormAmount')?.value);
        const refPago = ($('payFormRef')?.value || '').trim();
        const formulaCobro = ($('payFormFormula')?.value || '').trim();
        const fileObj = $('payFormFile')?.files?.[0] || null;

        if (!ruc || !nombre) return toast('Ingresa RUC y Razón Social del cliente.');
        if (isNaN(montoUsd) || montoUsd <= 0) return toast('Ingresa un monto válido.');
        if (!formulaCobro) return toast('⚠️ Debes escribir la observación / fórmula de cobro.');
        if (!fileObj) return toast('⚠️ Debes adjuntar obligatoriamente el comprobante de pago (imagen o PDF).');

        const btn = $('btnSubmitPayEntry');
        if (btn) { btn.textContent = 'Subiendo comprobante...'; btn.disabled = true; }

        try {
          let compUrl = '';
          if (typeof subirComprobanteOperacionSupabase === 'function') {
            const up = await subirComprobanteOperacionSupabase(fileObj, 'cobranzas', ruc);
            if (up && up.url) compUrl = up.url;
          }
          const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || {};
          const fechaLocal = nowFormatted();

          await crearTicketVozkora({
            empresa_ruc: ruc,
            empresa_nombre: nombre,
            solicitado_por: ses.email || 'cobranzas@vozkora.com',
            tipo_solicitud: 'FACTURACION_PAGO',
            estado: 'PENDIENTE',
            detalle: {
              categoria: `💳 ${concepto}`,
              concepto_pago: concepto,
              banco_canal: banco,
              monto_usd: montoUsd,
              referencia_pago: refPago || 'N/A',
              formula_cobro: formulaCobro,
              comprobante_url: compUrl,
              agente_email: ses.email || '',
              agente_nombre: ses.nombre_completo || ses.email || 'Cobranzas',
              agente_rol: ses.rol || 'COBRANZAS',
              fecha_hora_local: fechaLocal,
              fecha_iso_local: typeof obtenerFechaLocalISO === 'function' ? obtenerFechaLocalISO(0) : new Date().toISOString().slice(0, 10),
              historial: [
                {
                  fecha: fechaLocal,
                  de_estado: 'NUEVO',
                  a_estado: '🟡 Pendiente de Facturar',
                  motivo: `${concepto} por $${montoUsd.toFixed(2)} (${banco}) — ${formulaCobro}`,
                  autor: ses.email || 'Cobranzas'
                }
              ]
            }
          });

          V.closeModal();
          toast('🧾 Pago enviado a Facturación Pendientes.');
          if (this.currentTab === 'invoicing') await this.loadInvoicingTab();
        } catch (e) {
          toast('Error registrando pago: ' + e.message);
        } finally {
          if (btn) { btn.textContent = '🧾 Enviar a Facturación Pendientes'; btn.disabled = false; }
        }
      },

      async approveInvoicingAndRenew(ticketId) {
        const tk = this.cachedTickets.find(x => x.id === ticketId);
        if (!tk) return;
        const emp = this.cachedCompanies.find(c => String(c.ruc || '').trim() === String(tk.empresa_ruc || '').trim()) || null;
        const det = Object.assign({}, tk.detalle || {});
        const ses = (typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null) || { email: 'admin@vozkora.com' };

        if (!confirm(`¿Confirmas validar el pago de $${Number(det.monto_usd || 0).toFixed(2)} de ${tk.empresa_nombre} y renovar su próximo ciclo de corte?`)) {
          return;
        }

        try {
          if (emp) {
            const per = String(det.concepto_pago || '').toUpperCase().includes('ANUAL') ? 'ANUAL' : (emp.periodicidad || 'MENSUAL');
            const nextCorte = calcularProximoCorte(per);
            await crmActualizarEmpresa(emp.id, {
              periodicidad: per,
              fecha_proximo_corte: nextCorte,
              activa: true
            });
          }

          const hist = Array.isArray(det.historial) ? det.historial.slice() : [];
          hist.push({
            fecha: nowFormatted(),
            de_estado: '🟡 Pendiente de Facturar',
            a_estado: '🟢 Facturado y Renovado',
            motivo: `Pago validado ($${Number(det.monto_usd || 0).toFixed(2)}) y ciclo renovado.`,
            autor: ses.email
          });
          det.historial = hist;
          await crmActualizarTicket(tk.id, 'APROBADO', det);
          toast(`✅ Pago validado y ciclo renovado para ${tk.empresa_nombre}.`);
          await this.loadInvoicingTab();
        } catch (e) {
          toast('Error validando pago: ' + e.message);
        }
      },

      // ===================================================================

      async loadAnalyticsTab() {
        const body = $('crm-body');
        body.innerHTML = '<div class="p-4 bg-white rounded-2xl">Consolidando indicadores gerenciales y métricas de calidad del equipo...</div>';
        try {
          const [tks, emps, usrs] = await Promise.all([crmListarTickets(), crmListarEmpresas(), crmListarUsuarios()]);
          this.cachedTickets = tks;
          this.cachedCompanies = emps;
          this.cachedUsers = usrs;
          this.cachedStaff = usrs.filter(u => this.isInternalRole(u.rol));
          this.renderAnalyticsView();
        } catch (e) {
          body.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl">Error: ${esc(e.message)}</div>`;
        }
      },

      renderAnalyticsView() {
        const body = $('crm-body');
        const period = this.analyticsPeriod || 'month';
        const refDate = this.analyticsDate || new Date().toISOString().slice(0, 10);
        const refYear = refDate.slice(0, 4);
        const refMonth = refDate.slice(0, 7);

        const matchesDate = (tk) => {
          const det = tk.detalle || {};
          const iso = String(det.fecha_iso_local || (tk.creado_en ? formatLocalDateTimeCrm(tk.creado_en).slice(0, 10) : refDate)).slice(0, 10);
          if (period === 'day') return iso === refDate;
          if (period === 'year') return iso.slice(0, 4) === refYear;
          return iso.slice(0, 7) === refMonth;
        };

        const approvedSales = this.cachedTickets.filter(t => t.tipo_solicitud === 'ACTIVACION_VENTA' && t.estado === 'APROBADO' && matchesDate(t));
        const approvedPays = this.cachedTickets.filter(t => t.tipo_solicitud === 'FACTURACION_PAGO' && t.estado === 'APROBADO' && matchesDate(t));

        const sumByOp = (opKey) => {
          const items = approvedSales.filter(t => (t.detalle || {}).tipo_operacion === opKey);
          return {
            count: items.length,
            total: items.reduce((a, x) => a + Number((x.detalle || {}).monto_usd || 0), 0)
          };
        };

        const kpiNuevas = sumByOp('VENTA_NUEVA_PLAN');
        const kpiUpgrades = sumByOp('UPGRADE_PLAN');
        const kpiUsersExtra = sumByOp('VENTA_USUARIOS_EXTRA');
        const kpiModulosIa = sumByOp('VENTA_MODULO_IA');
        const kpiPersonalizado = sumByOp('VENTA_MODULO_PERSONALIZADO');
        const kpiDowngrades = sumByOp('DOWNGRADE_PLAN');
        const kpiBajaUsers = sumByOp('BAJA_USUARIOS_EXTRA');
        const kpiBajaMods = sumByOp('BAJA_MODULO_IA');
        const totalRecaudoCobranzas = approvedPays.reduce((a, x) => a + Number((x.detalle || {}).monto_usd || 0), 0);

        const sellersMap = {};
        approvedSales.forEach(t => {
          const det = t.detalle || {};
          const k = det.agente_email || t.solicitado_por || 'Sin asignar';
          if (!sellersMap[k]) sellersMap[k] = { name: det.agente_nombre || k, email: k, count: 0, total: 0 };
          sellersMap[k].count += 1;
          sellersMap[k].total += Number(det.monto_usd || 0);
        });
        const topSellers = Object.values(sellersMap).sort((a, b) => b.total - a.total);

        const collectorsMap = {};
        approvedPays.forEach(t => {
          const det = t.detalle || {};
          const k = det.agente_email || t.solicitado_por || 'Sin asignar';
          if (!collectorsMap[k]) collectorsMap[k] = { name: det.agente_nombre || k, email: k, count: 0, total: 0 };
          collectorsMap[k].count += 1;
          collectorsMap[k].total += Number(det.monto_usd || 0);
        });
        const topCollectors = Object.values(collectorsMap).sort((a, b) => b.total - a.total);

        const staffForQuality = this.cachedStaff.filter(u => String(u.rol || '').toUpperCase() !== 'SUPERADMIN');
        const demoQualityRows = staffForQuality.length > 0
          ? staffForQuality.map((u, idx) => {
              const r = String(u.rol || '').toUpperCase();
              const area = r === 'COBRANZAS' ? 'Cobranzas' : (r === 'SOPORTE' ? 'Soporte Técnico' : 'Ventas & Retención');
              const demoScore = [96, 92, 89, 94, 91, 88][idx % 6];
              return { name: u.nombre_completo || u.email, rol: r, area, score: demoScore, cases: 14 + (idx * 3) };
            })
          : [
              { name: 'Laura Mendoza (Demo)', rol: 'VENTAS', area: 'Ventas & Retención', score: 95, cases: 18 },
              { name: 'Carlos Paredes (Demo)', rol: 'COBRANZAS', area: 'Cobranzas', score: 92, cases: 24 },
              { name: 'Andrea Gómez (Demo)', rol: 'RETENCION', area: 'Ventas & Retención', score: 90, cases: 12 }

        const avgGeneral = demoQualityRows.length > 0
          ? (demoQualityRows.reduce((a, x) => a + x.score, 0) / demoQualityRows.length).toFixed(1)
          : '92.5';
        const salesQRows = demoQualityRows.filter(x => x.area !== 'Cobranzas');
        const cobQRows = demoQualityRows.filter(x => x.area === 'Cobranzas');
        const avgVentasQ = salesQRows.length > 0 ? (salesQRows.reduce((a, x) => a + x.score, 0) / salesQRows.length).toFixed(1) : '93.0';
        const avgCobranzasQ = cobQRows.length > 0 ? (cobQRows.reduce((a, x) => a + x.score, 0) / cobQRows.length).toFixed(1) : '91.5';

        body.innerHTML = `
          <div class="bg-white rounded-2xl p-4 border border-[#dce6e5] space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
              <div>
                <h3 class="text-sm font-extrabold text-[#073e3b]">📈 Informe Gerencial de Operación SaaS & Calidad</h3>
                <p class="text-[11px] text-slate-500">Consolidado en vivo de ventas nuevas, upgrades, bajas, recaudación y desempeño del equipo.</p>
              </div>
              <div class="flex flex-wrap items-center gap-1.5 bg-[#f5f8f8] p-1.5 rounded-xl border border-[#dce6e5]">
                <button onclick="CRM.analyticsPeriod='day'; CRM.renderAnalyticsView();" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${period === 'day' ? 'bg-[#073e3b] text-[#70d2bd]' : 'text-slate-600'}">Por Día</button>
                <button onclick="CRM.analyticsPeriod='month'; CRM.renderAnalyticsView();" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${period === 'month' ? 'bg-[#073e3b] text-[#70d2bd]' : 'text-slate-600'}">Por Mes</button>
                <button onclick="CRM.analyticsPeriod='year'; CRM.renderAnalyticsView();" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${period === 'year' ? 'bg-[#073e3b] text-[#70d2bd]' : 'text-slate-600'}">Por Año</button>
                ${period === 'day' ? `<input type="date" value="${esc(refDate)}" onchange="CRM.analyticsDate=this.value; CRM.renderAnalyticsView();" class="border border-[#d7e1e0] rounded-lg px-2 py-0.5 text-[11px] font-mono bg-white" />` : ''}
                ${period === 'month' ? `<input type="month" value="${esc(refMonth)}" onchange="CRM.analyticsDate=this.value+'-01'; CRM.renderAnalyticsView();" class="border border-[#d7e1e0] rounded-lg px-2 py-0.5 text-[11px] font-mono bg-white" />` : ''}
                ${period === 'year' ? `
                  <select onchange="CRM.analyticsDate=this.value+'-01-01'; CRM.renderAnalyticsView();" class="border border-[#d7e1e0] rounded-lg px-2 py-0.5 text-[11px] font-mono bg-white">
                    ${[2025, 2026, 2027].map(y => `<option value="${y}" ${refYear === String(y) ? 'selected' : ''}>Año ${y}</option>`).join('')}
                  </select>
                ` : ''}
              </div>
            </div>

            <!-- KPIs Segmentados por Movimiento -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
              <div class="p-3 rounded-2xl bg-[#073e3b] text-white">
                <div class="text-[10px] uppercase font-bold text-teal-200">🆕 Ventas Nuevas Planes</div>
                <div class="text-lg font-black font-mono text-[#70d2bd] mt-0.5">$${kpiNuevas.total.toFixed(2)}</div>
                <div class="text-[10px] text-teal-100">${kpiNuevas.count} cliente(s) nuevo(s)</div>
              </div>
              <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5]">
                <div class="text-[10px] uppercase font-bold text-[#087e70]">⬆️ Upgrades de Planes</div>
                <div class="text-lg font-black font-mono text-[#073e3b] mt-0.5">$${kpiUpgrades.total.toFixed(2)}</div>
                <div class="text-[10px] text-slate-500">${kpiUpgrades.count} ascenso(s) de plan</div>
              </div>
              <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5]">
                <div class="text-[10px] uppercase font-bold text-indigo-800">🤖+ Módulos Adicionales IA</div>
                <div class="text-lg font-black font-mono text-[#073e3b] mt-0.5">$${(kpiModulosIa.total + kpiPersonalizado.total).toFixed(2)}</div>
                <div class="text-[10px] text-slate-500">${kpiModulosIa.count} IA · ${kpiPersonalizado.count} a medida</div>
              </div>
              <div class="p-3 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5]">
                <div class="text-[10px] uppercase font-bold text-teal-800">👥+ Usuarios Adicionales</div>
                <div class="text-lg font-black font-mono text-[#073e3b] mt-0.5">$${kpiUsersExtra.total.toFixed(2)}</div>
                <div class="text-[10px] text-slate-500">${kpiUsersExtra.count} ampliación(es) cupo</div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <div class="p-3 rounded-2xl bg-orange-50 border border-orange-200">
                <div class="text-[10px] uppercase font-bold text-orange-900">⬇️ Downgrades de Planes</div>
                <div class="text-base font-black font-mono text-orange-800 mt-0.5">${kpiDowngrades.count} caso(s) · $${kpiDowngrades.total.toFixed(2)}</div>
              </div>
              <div class="p-3 rounded-2xl bg-rose-50 border border-rose-200">
                <div class="text-[10px] uppercase font-bold text-rose-900">📉 Bajas Usuarios / Módulos</div>
                <div class="text-base font-black font-mono text-rose-800 mt-0.5">${kpiBajaUsers.count} baja usu. · ${kpiBajaMods.count} baja mód.</div>
              </div>
              <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200">
                <div class="text-[10px] uppercase font-bold text-emerald-900">💳 Recaudo Cobranzas</div>
                <div class="text-base font-black font-mono text-emerald-800 mt-0.5">$${totalRecaudoCobranzas.toFixed(2)} (${approvedPays.length} pagos)</div>
              </div>
            </div>

            <!-- Rankings: Top Vendedores y Top Cobranzas -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div class="p-3.5 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5] space-y-2">
                <div class="font-extrabold text-[#073e3b]">🥇 Top Vendedores / Retención</div>
                ${topSellers.length === 0 ? '<p class="text-[11px] text-slate-500">Sin activaciones aprobadas en este período.</p>' : topSellers.map((s, i) => `
                  <div class="p-2 rounded-xl bg-white border border-slate-200 flex items-center justify-between">
                    <span><strong>#${i + 1} ${esc(s.name)}</strong> <span class="text-[10px] text-slate-500">(${s.count} op.)</span></span>
                    <strong class="font-mono text-[#087e70]">$${s.total.toFixed(2)}</strong>
                  </div>
                `).join('')}
              </div>

              <div class="p-3.5 rounded-2xl bg-[#f5f8f8] border border-[#dce6e5] space-y-2">
                <div class="font-extrabold text-[#073e3b]">🥇 Top Gestores de Cobranzas</div>
                ${topCollectors.length === 0 ? '<p class="text-[11px] text-slate-500">Sin pagos conciliados en este período.</p>' : topCollectors.map((c, i) => `
                  <div class="p-2 rounded-xl bg-white border border-slate-200 flex items-center justify-between">
                    <span><strong>#${i + 1} ${esc(c.name)}</strong> <span class="text-[10px] text-slate-500">(${c.count} cobros)</span></span>
                    <strong class="font-mono text-[#087e70]">$${c.total.toFixed(2)}</strong>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Bloque de Calidad del Equipo (Datos Ficticios Provisionales hasta definir rúbrica con Auditor) -->
            <div class="p-4 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <div class="font-extrabold text-indigo-950 text-xs">⭐ Indicadores de Calidad del Equipo (Vista Preliminar)</div>
                  <div class="text-[10.5px] text-indigo-800">Datos referenciales provisionales listos para conectar con la rúbrica de Auditoría.</div>
                </div>
                <span class="px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-900 font-extrabold text-[10px]">Escala 0 – 100 pts</span>
              </div>

              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="p-2.5 rounded-xl bg-white border border-indigo-200">
                  <div class="text-[10px] text-slate-500 font-bold">Calidad General Equipo</div>
                  <div class="text-lg font-black font-mono text-indigo-900">${avgGeneral}%</div>
                </div>
                <div class="p-2.5 rounded-xl bg-white border border-indigo-200">
                  <div class="text-[10px] text-slate-500 font-bold">Nota Calidad Ventas</div>
                  <div class="text-lg font-black font-mono text-[#087e70]">${avgVentasQ}%</div>
                </div>
                <div class="p-2.5 rounded-xl bg-white border border-indigo-200">
                  <div class="text-[10px] text-slate-500 font-bold">Nota Calidad Cobranzas</div>
                  <div class="text-lg font-black font-mono text-[#073e3b]">${avgCobranzasQ}%</div>
                </div>
              </div>

              <div class="space-y-1.5">
                ${demoQualityRows.map(q => `
                  <div class="p-2.5 rounded-xl bg-white border border-indigo-100 flex items-center justify-between gap-2 text-[11px]">
                    <div>
                      <strong class="text-[#073e3b]">${esc(q.name)}</strong>
                      <span class="ml-1.5 px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[9.5px] font-bold">${esc(q.area)}</span>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="text-[10px] text-slate-500">${q.cases} casos rev.</span>
                      <span class="px-2.5 py-0.5 rounded-full font-mono font-extrabold ${q.score >= 92 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">${q.score} / 100</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      },

      exportRepoCsv() {
        const rows = this.getFilteredRepoRows();
        if (!rows.length) return toast('No hay filas filtradas para exportar.');
        const cols = Object.keys(rows[0]);
        const csv = [
          cols.join(';'),
          ...rows.map(r => cols.map(c => `"${String(typeof r[c] === 'object' ? JSON.stringify(r[c]) : (r[c] ?? '')).replace(/"/g, '""')}"`).join(';'))
        ].join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${this.repoTable}_${new Date().toISOString().slice(0,10)}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
        toast(`📥 Excel/CSV descargado (${rows.length} registros).`);
      }
    };



    window.CrmAuth = {
      async login() {
        const email = $('crm-email').value;
        const pass = $('crm-pass').value;
        const err = $('crm-login-err');
        const btn = $('btn-crm-login');
        err.classList.add('hidden');
        btn.textContent = 'Verificando credenciales...';
        btn.disabled = true;
        try {
          const res = await loginVozkora(email, pass);
          if (!res.ok) {
            err.textContent = res.error;
            err.classList.remove('hidden');
            return;
          }
          const cleanRol = String((res.user && res.user.rol) || '').trim().toUpperCase();
          if (!CRM.isInternalRole(cleanRol)) {
            cerrarSesionVozkora();
            err.textContent = `⛔ Acceso denegado: Tu rol (${cleanRol || 'SIN_ROL'}) no tiene permisos para ingresar a Control CRM.`;
            err.classList.remove('hidden');
            return;
          }
          $('crm-login-screen').classList.add('hidden');
          CRM.open();
        } catch (e) {
          err.textContent = 'Error de conexión: ' + e.message;
          err.classList.remove('hidden');
        } finally {
          btn.textContent = 'Ingresar a Consola Maestra →';
          btn.disabled = false;
        }
      },
      logout() {
        cerrarSesionVozkora();
        $('crm-overlay').classList.add('hidden');
        $('crm-login-screen').classList.remove('hidden');
      }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const ses = typeof obtenerSesionVozkora === 'function' ? obtenerSesionVozkora() : null;
      if (ses && CRM.isInternalRole(ses.rol)) {
        $('crm-login-screen').classList.add('hidden');
        CRM.open();
      }
    });
  </script>
</body>
